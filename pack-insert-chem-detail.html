<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindray BS-Series Chemistry Reagent Atlas</title>
<style>
:root{
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --blue: #2a78d6;
  --blue-dark: #184f95;
  --orange: #eb6834;
  --aqua: #1baf7a;
  --yellow: #eda100;
  --magenta: #e87ba4;
  --green: #008300;
  --violet: #4a3aa7;
  --red: #e34948;
  --good: #0ca30c;
  --critical: #d03b3b;
  --cat-liver: #2a78d6;
  --cat-renal: #eb6834;
  --cat-lipid: #1baf7a;
  --cat-glucose: #eda100;
  --cat-cardiac: #e34948;
  --cat-electrolyte: #4a3aa7;
  --cat-iron: #e87ba4;
  --cat-pancreas: #008300;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322; --ink:#ffffff; --ink-2:#c3c2b7;
    --ink-muted:#898781; --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10);
    --blue:#3987e5; --blue-dark:#104281; --orange:#d95926; --aqua:#199e70; --yellow:#c98500;
    --magenta:#d55181; --green:#008300; --violet:#9085e9; --red:#e66767; --good:#0ca30c; --critical:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322; --ink:#ffffff; --ink-2:#c3c2b7;
  --ink-muted:#898781; --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10);
  --blue:#3987e5; --blue-dark:#104281; --orange:#d95926; --aqua:#199e70; --yellow:#c98500;
  --magenta:#d55181; --green:#008300; --violet:#9085e9; --red:#e66767; --good:#0ca30c; --critical:#e66767;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
body{min-height:100vh;}
a{color:var(--blue);}
.app{display:flex;min-height:100vh;}
/* ---------- Sidebar ---------- */
.sidebar{width:300px;flex:0 0 300px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;}
.brand{padding:18px 18px 10px;border-bottom:1px solid var(--border);}
.brand h1{font-size:15px;margin:0 0 2px;font-weight:700;letter-spacing:.2px;}
.brand p{margin:0;font-size:11.5px;color:var(--ink-muted);line-height:1.4;}
.search{padding:10px 14px;border-bottom:1px solid var(--border);}
.search input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink);font-size:13px;outline:none;}
.search input:focus{border-color:var(--blue);}
.nav{overflow-y:auto;flex:1;padding:6px 0 20px;}
.nav-cat{margin-top:10px;}
.nav-cat-label{display:flex;align-items:center;gap:7px;padding:4px 16px;font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--ink-muted);}
.nav-cat-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
.nav-item{display:flex;align-items:baseline;gap:8px;padding:6px 16px 6px 27px;cursor:pointer;font-size:13px;
  border-left:2px solid transparent;color:var(--ink-2);}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--surface-2);border-left-color:var(--blue);color:var(--ink);font-weight:600;}
.nav-item .code{font-weight:700;color:var(--ink);min-width:56px;}
.nav-item.active .code{color:var(--blue);}
.nav-item .nm{font-size:11.5px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:28px 34px 80px;max-width:980px;}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
.crumb{font-size:12px;color:var(--ink-muted);margin-bottom:6px;}
.hgroup h2{font-size:26px;margin:0 0 4px;letter-spacing:-.2px;}
.hgroup .method{font-size:14px;color:var(--ink-2);margin:0;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;
  border-radius:100px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;}
.badge .dot{width:7px;height:7px;border-radius:50%;}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:18px 0 22px;}
.stat{background:var(--surface);padding:12px 14px;}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-muted);margin-bottom:4px;}
.stat .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
section.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-muted);margin:0 0 12px;
  display:flex;align-items:center;gap:8px;}
section.card h3 .n{width:20px;height:20px;border-radius:6px;background:var(--surface-2);display:inline-flex;
  align-items:center;justify-content:center;font-size:11px;color:var(--ink-2);}
.prose{font-size:14px;line-height:1.65;color:var(--ink-2);}
.prose strong{color:var(--ink);}
.eqbox{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:13px;color:var(--ink);white-space:pre-wrap;line-height:1.7;margin:10px 0;overflow-x:auto;}
.rxn-flow{display:flex;flex-direction:column;gap:4px;}
.rxn-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);
  margin:14px 0 8px;padding-top:12px;border-top:1px dashed var(--border);}
.rxn-group-label:first-child{margin-top:0;padding-top:0;border-top:none;}
.rxn-step{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;}
.rxn-side{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1 1 150px;}
.rxn-side.products{justify-content:flex-start;}
.rxn-chip{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;
  font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;line-height:1.3;}
.rxn-chip.product{border-color:var(--blue);background:color-mix(in srgb, var(--blue) 10%, var(--surface-2));}
.rxn-chip.blocked{border-color:var(--critical);background:color-mix(in srgb, var(--critical) 10%, var(--surface-2));
  color:var(--ink-muted);text-decoration:line-through;text-decoration-color:var(--critical);}
.rxn-plus{color:var(--ink-muted);font-weight:700;font-size:13px;}
.rxn-arrow-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:110px;flex:0 0 auto;gap:1px;}
.rxn-enzyme{font-size:11px;font-weight:700;color:var(--blue);text-align:center;line-height:1.25;}
.rxn-arrow{width:100%;min-width:60px;height:2px;background:var(--ink-muted);position:relative;margin:3px 0;}
.rxn-arrow::after{content:'';position:absolute;right:-1px;top:-4px;width:0;height:0;
  border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid var(--ink-muted);}
.rxn-arrow.blocked{background:var(--critical);background-image:linear-gradient(90deg,var(--critical) 0 6px,transparent 6px 10px);
  background-size:10px 2px;}
.rxn-arrow.blocked::after{border-left-color:var(--critical);}
.rxn-blocked-x{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;color:var(--critical);
  background:var(--surface);border-radius:50%;line-height:1;padding:1px;}
.rxn-sub{font-size:10px;color:var(--ink-muted);text-align:center;line-height:1.25;max-width:150px;}
.rxn-measured{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:12.5px;
  color:var(--ink-2);display:flex;gap:8px;align-items:flex-start;line-height:1.5;}
.rxn-measured .ic{font-size:15px;flex:0 0 auto;line-height:1.3;}
.rxn-notes{margin-top:8px;font-size:11.5px;color:var(--ink-muted);line-height:1.5;}
.rxn-notes div{margin-bottom:3px;}
.rxn-raw-toggle{margin-top:10px;}
.rxn-raw-toggle summary{cursor:pointer;font-size:11.5px;color:var(--ink-muted);user-select:none;}
.rxn-raw-toggle summary:hover{color:var(--ink-2);}
@media (max-width:640px){
  .rxn-step{flex-direction:column;align-items:stretch;}
  .rxn-arrow-wrap{min-width:0;width:100%;padding:6px 0;}
  .rxn-arrow{transform:rotate(90deg);width:40px;margin:8px auto;}
}
.pre{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.6;overflow-x:auto;}
.pre .r1{color:var(--blue);font-weight:700;}
.pre .r2{color:var(--orange);font-weight:700;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:760px){.two-col{grid-template-columns:1fr;}}
.diagram-wrap{overflow-x:auto;}
.chart-wrap{overflow-x:auto;}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-muted);margin-top:6px;}
.legend-row span{display:inline-flex;align-items:center;gap:5px;}
.legend-row i{width:10px;height:10px;border-radius:2px;display:inline-block;}
.note{font-size:11.5px;color:var(--ink-muted);margin-top:8px;font-style:italic;}
table.dt{width:100%;border-collapse:collapse;font-size:13px;}
table.dt th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);
  padding:6px 8px;border-bottom:1px solid var(--border);}
table.dt td{padding:7px 8px;border-bottom:1px solid var(--grid);color:var(--ink-2);font-variant-numeric:tabular-nums;}
table.dt tr:last-child td{border-bottom:none;}
.interf-ok{color:var(--good);font-weight:700;}
.curve-grid{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start;}
@media (max-width:820px){.curve-grid{grid-template-columns:1fr;}}
.breakdown{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
.breakdown li{position:relative;padding:2px 0 2px 0;font-size:13px;line-height:1.55;color:var(--ink-2);
  border-left:2px solid var(--border);padding-left:14px;}
.breakdown li strong{color:var(--ink);display:block;font-size:13.5px;margin-bottom:2px;}
.breakdown .bt{display:inline-block;font-size:10.5px;font-weight:700;color:var(--blue);text-transform:uppercase;
  letter-spacing:.3px;margin-bottom:2px;font-variant-numeric:tabular-nums;}
.topic-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
.topic-item{font-size:13px;line-height:1.55;color:var(--ink-2);padding:8px 12px;border-radius:8px;background:var(--surface-2);}
.topic-warn{border-left:3px solid var(--yellow);}
.rowlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.rowlist li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;background:var(--surface);
  padding:8px 12px;font-size:13px;}
.rowlist .rl-label{color:var(--ink-2);}
.rowlist .rl-value{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.note-block{margin-top:10px;font-size:12.5px;color:var(--ink-muted);}
.conv-block{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);}
.conv-block .conv-head{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  color:var(--aqua);margin-bottom:8px;}
.conv-block .conv-src{font-size:11px;color:var(--ink-muted);margin-top:8px;}
.conv-block .conv-bun-note{font-size:11.5px;color:var(--ink-muted);margin-top:8px;font-style:italic;}
.conv-missing{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--ink-muted);}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);}
.wl-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.55;color:var(--ink-2);
  background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:10px;}
.wl-note.warn{border-left:3px solid var(--yellow);}
.wl-note .ic{flex:0 0 auto;font-size:14px;}
table.dt th.grp{text-align:center;border-left:1px solid var(--border);}
table.dt td.grp-first{border-left:1px solid var(--border);}
table.dt caption{caption-side:top;text-align:left;font-size:12px;color:var(--ink-muted);padding-bottom:8px;}
.reagent-group{margin-bottom:14px;}
.reagent-group:last-child{margin-bottom:0;}
.reagent-group h4{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);margin:0 0 6px;
  display:flex;align-items:center;gap:6px;}
.reagent-group h4 .sw{width:9px;height:9px;border-radius:2px;display:inline-block;}
.reagent-meta{font-size:12.5px;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.reagent-meta div{margin-bottom:3px;}
.reagent-meta b{color:var(--ink);}
.assay-block{margin-bottom:18px;}
.assay-block:last-child{margin-bottom:0;}
.assay-block h4{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--blue);margin:0 0 8px;
  padding-bottom:6px;border-bottom:1px solid var(--border);}
.assay-steps{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--ink-2);}
.assay-steps li{margin-bottom:6px;}
.assay-steps li:last-child{margin-bottom:0;}
.footer-note{font-size:11.5px;color:var(--ink-muted);text-align:center;padding:30px 0 10px;}
.menu-btn{display:none;}
@media (max-width:880px){
  .sidebar{position:fixed;z-index:20;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax rgba(0,0,0,.4);}
  .menu-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px;cursor:pointer;}
  .main{padding:18px 16px 60px;}
}
</style>
</head>

  "summary": "Plasma proteins are synthesized predominantly in the liver, plasma cells, lymph nodes, the spleen and in bone marrow. In the course of disease the total protein concentration and the percentage represented by individual fractions can significantly deviate from normal values. The change of total protein is usually corresponded to decrease with albumin and increase with the globulin. Total protein, A, G, and the A/G are combined to application in clinic. Hypoproteinemia can be caused by diseases and disorders such as loss of blood, sprue, nephrotic syndrome, severe burns, salt retention syndrome and Kwashiorkor (acute protein deficiency). Hyperproteinemia can be observed in cases of severe dehydration and illnesses such as multiple myeloma. Total protein measurements are used in the diagnosis and treatment of a variety of disease involving the liver, kidney, or bone, marrow, as well as other metabolic or nurtritional disorders.",

 {
  "code": "HbA1c",
  "full_name": "Hemoglobin A1c (Glycated Hemoglobin)",
  "category": "Glucose & Diabetes Monitoring",
  "method_name": "Enzymatic assay: protease + fructosyl-peptide oxidase (FPOX), ratio to total Hb",
  "pattern": "F",
  "direction": "increase",
  "cat_no": "HBA0xxx",
  "intended_use": "In vitro test for the quantitative determination of HbA1c concentration in human whole blood on photometric systems.",
  "summary": "Hemoglobin (Hb) consists of four protein chains with four heme portions, and is the red-pigmented protein located in the erythrocytes. Its main function is the transport HbA1c of oxygen and carbon dioxide in blood. Each Hb molecule is able to bind four oxygen molecules. Hb consists of a variety of subfractions and derivatives. Among this heterogeneous group of hemoglobins HbA1c is one of the glycated hemoglobins, a subfraction formed by the attachment of various sugars to the Hb molecule. HbA1c is formed in two steps by the non-enzymatic reaction of glucose with the N-terminal amino group of the β-chain of normal adult Hb (HbA). The first step is reversible and yields labile HbA1c. This slowly rearranges in the second reaction step to yield stable HbA1c. In the erythrocytes, the relative amount of HbA converted to stable HbA1c increases with the average concentration of glucose in the blood. The conversion to stable HbA1c is limited by the erythrocyte’s life span of approximately 100 to 120 days. As a result, HbA1c reflects the average blood glucose level during the preceding 2 to 3 months. HbA1c is thus suitable to monitor long-term blood glucose control in individuals with diabetes mellitus. More recent glucose levels have a greater influence on the HbA1c level. The approximate relationship between HbA1c and mean blood glucose value during the preceding 2 to 3 months has been analyzed by several studies.",
  "principle_raw": "In the first reaction, the concentration of hemoglobin is measured at absorbance of\nfixed wavelength, and simultaneously the fructosyl dipeptides are generated from the\nN-terminus amino groups of the beta-chain of HbA1c by the reaction of protease. In\nthe second reaction, the reaction of Fructosyl peptide oxidase(FPOX) with fructosyl\ndipeptides, generated hydroperoxide allows\n10-(carboxymethylaminocarbonyl)-3,7-bis(dimethylamino) phenothiazine sodium\nsalt to develop a color in the presence of peroxidase. The change in absorbance is\nmeasured for HbA1c determination. The combined assay results for hemoglobin and\nHbA1c are used by the system to calculate and express HbA1c%.",
  "wavelengths_nm": [
   500,
   660
  ],
  "assay_procedure_raw": "Non-twin test\n1.Hb\nBlank Sample\nR（Hb） 180 μL 180 μL\nDist. water 12 μL -\nSample - 12 μL\nMix, incubate for 5 min. at 37 ℃, and read the absorbance A at 500 nm\nΔA = [A sample]- [A blank]\n2.HbA1c\nBlank Sample\nR1（HbA1c） 180 μL 180 μL\nDist. water 12 μL -\nSample - 12 μL\nMix, incubate for 5 min. at 37 ℃, and read the absorbance A1 at 660 nm, then add:\nR2（HbA1c） 60 μL 60 μL\nMix thoroughly at 37 ℃, and read the absorbance A2 at 660 nm again 5 min later.\nΔA = [（A2-A1）sample]-[（A2-A1）blank]\nTwin test\nBlank Sample\nR1 180 μL 180 μL\nDist. water 12 μL -\nHbA1c\nSample - 12 μL\nMix, incubate for 5 min. at 37 ℃, and read the absorbance A at 500 nm, the\nabsorbance A1 at 660 nm, then add:\nR2 60 μL 60 μL\nMix thoroughly at 37 ℃, and read the absorbance A2 at 660 nm again 5 min later.\nΔAHb =A sample –A blank\nΔAHbA1c=[(A2-A1) sample ]–[(A2-A1) blank]",

  "principle_raw": "Creatine kinase activity is measured in the presence of an antibody to the\ncreatine kinase-M monomer which completely inhibits creatine kinase-MM\nbut does not affect the B monomer activity of the creatine kinase-MB or\ncreatine kinase-BB. Since creatine kinase-MB consists of equal M and B\nsubunits, its measured activity is 50 percent of that found in the absence of\nthe antibody. Creatine kinase-B monomer activity is then determined in the\nfollowing reaction sequence.\nCK-MM + Anti-CK-MM Antigen-Antibody Complex\nCreatine Kinase-B\nADP + Creatine phosphate Creatine + ATP\nHexokinase\nATP + Glucose ADP + Glucose -6-phosphorate\nG-6-PDH\nGlucose -6-phosphorate + NADP+ Gluconate-6-phosphate +\nNADPH + H+\nCK-MB\nIn the reaction, the creatine kinase-B catalyzes the transfer of a phosphate\ngroup from the creatine phosphate substrate to ADP. The subsequent\nformation of ATP is measured through the use of two coupled reactions\ncatalyzed by hexokinase (HK) and glucose-6-phosphate dehydrogenase\n(G-6-PDH) which results in the production of the reduced form of NADPH\nfrom NADP. The rate of absorbency increase at 405nm is directly\nproportional to the activity of creatine kinase-B.",
  "wavelengths_nm": [
   340
  ],
  "assay_procedure_raw": "Blank Sample\nReagent 1 1000 μL 1000 μL\nDist. water 50 μL -\nSample - 50 μL\nMix, incubate for 3 min. at 37℃, then add:\nReagent 2 250 μL 250 μL\nMix thoroughly, incubate at 37℃ for 3 min., and then read the absorbance\nchange value within 1-3 min.\nΔA/min = [ΔA/min sample]- [ΔA/min blank]",
  "linearity": "Sample Type Conventional Units S.I. Units Serum 5-600 U/L 0.08-10.00 μkat/L If the value of sample exceeds 600 U/L, the sample should be diluted with 9 g/L NaCl solution (e.g. 1+ 9) and rerun; the result should be multiplied by 10.",

  "summary": "-Amylases originate from various organs and are mainly produced by the pancreas (P-type) and the salivary glands (S-type). -Amylases catalyze the hydrolytic degradation of polymeric carbohydrates, such as amylose, amylopectin and glycogen by cleaving 1, 4--glucosidic bonds into various fragments. The pancreatic amylase is produced by the pancreas and released into the intestinal tract; the salivary amylase is synthesized in the salivary glands and secreted into saliva. Because of its small molecular weight, the blood amylase is eliminated through the kidney and excreted into urine. Elevation of urine amylase activity reflects the rise of serum amylase activity. Measurement of -amylase in serum and urine is mainly used for the diagnosis of pancreatic disorders, as well as for detecting the development of complications. Normally the -amylases present low activity, in acute pancreatitis the blood amylase activity increases within 8-12 hours after onset of abdominal pain, peaks after approx. 12-24 hours. The blood amylase activity returns to normal values at the latest after 2-5 days, but the high urine amylase level will still last for 5-7 days. However, various nonpancreatic diseases, e.g. parotitis, renal insufficiency or pulmonary inflammation, can also increase amylase levels. To confirm pancreatic disorders, additional pancreas specific enzyme, lipase or pancreatic--amylase, is recommended to be determined at the same time.",

    <section class="card">

      <div id="patGroups" style="margin-top:16px;"></div>
    </section>
    <section class="card">
      <h3><span class="n">ii</span>BS-2800M / BS-2600M Analyzer Parameter Reference <span style="font-weight:400;text-transform:none;letter-spacing:0;">(Mindray doc. Z-0005-240-2.0)</span></h3>
      <p class="prose" style="margin-top:0;">Analyzer-configured settings for every chemistry channel on this platform — reaction type, direction, primary/secondary wavelength, timing and linearity limits, straight from the manufacturer's parameter sheet. Rows in <b>bold</b> are covered by a pack insert in this atlas and open its page; the rest are listed for reference only.</p>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;">

            <div class="ov-card" data-id="${p.id}" style="cursor:pointer;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface-2);">

function renderConventionalTable(host){
  const body = DATA.map(p=>{
    const cu = p.conventional_ref_update;
    const nameCell = `<a href="#${p.id}" class="bs-link" data-id="${p.id}" style="font-weight:700;">${esc(p.code)}</a>`;
    if(!cu || !cu.covered){
      return `<tr><td>${nameCell}</td><td colspan="3" style="color:var(--ink-muted);font-style:italic;">Not in this reference document</td></tr>`;
    }
    return `<tr><td>${nameCell}</td><td>${esc(cu.unit)}</td>
      <td>${esc(cu.overview_ref)}</td>
      <td style="font-variant-numeric:tabular-nums;">${esc(cu.overview_lin)}</td></tr>`;
  }).join('');
  host.innerHTML = `<table class="dt"><thead><tr>
    <th>Parameter</th><th>Unit</th><th>Reference range (adult)</th><th>Linearity</th>
    </tr></thead><tbody>${body}</tbody></table>`;
  host.querySelectorAll('.bs-link').forEach(el=> el.onclick = (e)=>{ e.preventDefault(); selectParam(el.dataset.id); });
}

/* ================= Overview: reaction-type infographic ================= */
function drawPatternGroups(labels, host){
  const order = ['A','C_kinetic','E','B','C','D','F'];
  const colors = ['var(--blue)','var(--blue-dark)','var(--violet)','var(--orange)','var(--yellow)','var(--aqua)','var(--magenta)'];
  const examples = {A:'e.g. ALT, AST, CK — continuous rate monitoring', C_kinetic:'e.g. Urea — two-reagent, rate monitored',
    E:'e.g. CO2 — fixed-time, initial vs. final read', B:'e.g. UA, Glucose — blank read, then sample read',
    C:'e.g. TP, HDL-C — single read after full incubation', D:'e.g. Ca, Mg, Albumin — one reagent, one read',
    F:'e.g. HbA1c — two independent reactions, ratio result'};
  let html = '<div style="display:flex;flex-direction:column;gap:10px;">';
  order.forEach((k,i)=>{
    const items = DATA.filter(d=>d.pattern===k);
    if(!items.length) return;
    html += `<div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px;">
        <span style="width:10px;height:10px;border-radius:3px;background:${colors[i]};display:inline-block;flex:0 0 auto;"></span>
        <strong style="font-size:13px;">${esc(labels[k])}</strong>
        <span style="font-size:11.5px;color:var(--ink-muted);">(${items.length}) — ${esc(examples[k]||'')}</span>
      </div>
      <div class="chips" style="margin-bottom:0;">
        ${items.map(p=>`<span class="chip chip-click" data-id="${p.id}" style="cursor:pointer;">${esc(p.code)}</span>`).join('')}
      </div>
    </div>`;
  });
  html += '</div>';
  host.innerHTML = html;
  host.querySelectorAll('.chip-click').forEach(el=> el.onclick = ()=> selectParam(el.dataset.id));
}

/* ================= Overview: BS-2800M analyzer parameter summary table ================= */
function renderBS2800MTable(host){
  const rows = (BS2800M.rows||[]);
  if(!rows.length){ host.innerHTML = '<p class="prose">Reference sheet not loaded.</p>'; return; }
  // reverse-map: sheet chem code -> atlas id (for linking)
  const chemToId = {};
  Object.entries(BS2800M.id_to_chem||{}).forEach(([id, chems])=> chems.forEach(c=> chemToId[c]=id));
  const rowHtml = (r)=>{
    const id = chemToId[r.chem];
    const nameCell = id ? `<a href="#${id}" class="bs-link" data-id="${id}" style="font-weight:700;">${esc(r.chem)}</a>` : esc(r.chem);
    const wave = r.pri_wave!=null ? (r.sec_wave!=null ? `${r.pri_wave} / ${r.sec_wave}` : `${r.pri_wave}`) : '—';
    const lin = (r.lin_low!=null && r.lin_up!=null) ? `${r.lin_low}–${r.lin_up}` : '—';
    return `<tr><td>${nameCell}</td><td>${esc(r.no)}</td><td>${esc(r.reac_type)}</td><td>${esc(r.direction)}</td>
      <td style="font-variant-numeric:tabular-nums;">${wave}</td><td>${esc(r.unit)}</td>
      <td style="font-variant-numeric:tabular-nums;">${lin}</td><td>${esc(r.rule)}</td></tr>`;
  };
  const groupHeader = (label, count)=> `<tr><td colspan="8" style="background:var(--surface-2);
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);
    padding:7px 8px;border-bottom:1px solid var(--border);">${esc(label)} (${count})</td></tr>`;

  // The parameters covered by a pack insert here come first, in this
  // atlas's own order (every chem code that maps back to an id — same
  // criterion used for the bold/linked name cell); the remaining sheet
  // channels (reference only) follow.
  const rowByChem = {};
  rows.forEach(r=> rowByChem[r.chem] = r);
  const covered = [];
  DATA.forEach(p=>{
    (BS2800M.id_to_chem[p.id] || []).forEach(chem=>{
      const r = rowByChem[chem];
      if(r) covered.push(r);
    });
  });
  const coveredSet = new Set(covered.map(r=>r.chem));
  const other = rows.filter(r=>!coveredSet.has(r.chem));

  const body = groupHeader('In this atlas', covered.length) + covered.map(rowHtml).join('')
    + groupHeader('Reference only — not covered by a pack insert here', other.length) + other.map(rowHtml).join('');

  host.innerHTML = `<table class="dt"><thead><tr>
    <th>Chem.</th><th>No.</th><th>Reac. type</th><th>Direction</th><th>Pri/Sec wave (nm)</th><th>Unit</th><th>Linearity range</th><th>Rule</th>
    </tr></thead><tbody>${body}</tbody></table>`;
  host.querySelectorAll('.bs-link').forEach(el=> el.onclick = (e)=>{ e.preventDefault(); selectParam(el.dataset.id); });
}

function drawPatternBar(counts, labels, host){
  const order = ['A','C_kinetic','E','B','C','D','F'];
  const colors = ['var(--blue)','var(--blue-dark)','var(--violet)','var(--orange)','var(--yellow)','var(--aqua)','var(--magenta)'];
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  let html = '<div style="display:flex;height:26px;border-radius:6px;overflow:hidden;">';
  order.forEach((k,i)=>{ if(counts[k]) html += `<div style="flex:${counts[k]};background:${colors[i]};" title="${labels[k]}: ${counts[k]}"></div>`; });
  html += '</div><div class="legend-row" style="margin-top:10px;">';
  order.forEach((k,i)=>{ if(counts[k]) html += `<span><i style="background:${colors[i]}"></i>${labels[k]} (${counts[k]})</span>`; });
  html += '</div>';
  host.innerHTML = html;
}

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  CAT_ORDER.forEach(cat=>{
    const items = DATA.filter(d=>d.category===cat);
    if(!items.length) return;
    const wrap = document.createElement('div');
    wrap.className='nav-cat';
    wrap.innerHTML = `<div class="nav-cat-label"><span class="nav-cat-dot" style="background:${CAT_COLOR[cat]}"></span>${cat}</div>`;
    items.forEach(it=>{
      const el = document.createElement('div');
      el.className='nav-item';
      el.dataset.id = it.id;
      el.innerHTML = `<span class="code">${it.code}</span><span class="nm">${it.full_name}</span>`;
      el.onclick = ()=>{ selectParam(it.id); document.getElementById('sidebar').classList.remove('open'); };
      wrap.appendChild(el);
    });
    nav.appendChild(wrap);
  });
}

document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el=>{
    const txt = el.textContent.toLowerCase();
    el.style.display = txt.includes(q) ? '' : 'none';

  document.querySelectorAll('.nav-cat').forEach(cat=>{
    const any = [...cat.querySelectorAll('.nav-item')].some(i=>i.style.display!=='none');
    cat.style.display = any ? '' : 'none';

document.getElementById('menuBtn').onclick = ()=> document.getElementById('sidebar').classList.toggle('open');

window.addEventListener('hashchange', ()=>{
  const id = decodeURIComponent(location.hash.replace('#',''));
  if(DATA.find(d=>d.id===id) && (!current || current.id!==id)) selectParam(id);
});

function selectParam(id){
  const p = DATA.find(d=>d.id===id);
  if(!p) return;
  current = p;
  if(location.hash.replace('#','')!==id) location.hash = id;
  document.getElementById('overviewBtn').classList.remove('active');
  document.querySelectorAll('.nav-item').forEach(el=> el.classList.toggle('active', el.dataset.id===id));
  render(p);
  document.getElementById('content').scrollIntoView({behavior:'instant'});
  window.scrollTo(0,0);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlightReagents(txt){
  return esc(txt)
    .replace(/\b(Reagent\s*1|R1|R（[^）]*）\/R1[^\n]*|R（[^）]*）\/R1[^\n]*)\b/g, m=>`<span class="r1">${m}</span>`)
    .replace(/\b(Reagent\s*2|R2)\b/g, m=>`<span class="r2">${m}</span>`);
}

function wavelengthText(p){
  const aw = p.analyzer_wl;
  if(aw && aw.composite){
    return aw.reactions.map(r=> r.sec!=null ? `${r.pri}/${r.sec}` : `${r.pri}`).join(', ')+' nm (2 reactions)';
  }
  if(aw && !aw.excluded && aw.pri!=null){
    return aw.sec!=null ? `${aw.pri} / ${aw.sec} nm` : `${aw.pri} nm`;
  }
  if(p.wavelengths_nm.length===2) return p.wavelengths_nm.join(' / ')+' nm';
  return p.wavelengths_nm.length ? p.wavelengths_nm[0]+' nm' : '—';
}
// Pri./Sec. wave figures for the stat-strip tiles. Prefers the authoritative
// analyzer parameter sheet (BS-2800M/BS-2600M, Z-0005-240-2.0); falls back to
// the pack insert's own stated wavelength(s) only when that sheet has no
// matching/trusted row for this chemistry.
function analyzerWaveStats(p){
  const aw = p.analyzer_wl;
  if(aw && aw.composite){
    const pri = aw.reactions.map(r=>`${r.pri} (${r.label.split(' ')[0]})`).join(' / ');
    const sec = aw.reactions.map(r=> r.sec!=null ? `${r.sec} (${r.label.split(' ')[0]})` : '—').join(' / ');
    return {pri, sec, source:'analyzer'};
  }
  if(aw && aw.excluded){
    return {pri:'—', sec:'—', source:'excluded'};
  }
  if(aw && aw.pri!=null){
    return {pri:`${aw.pri}`, sec: aw.sec!=null ? `${aw.sec}` : '—', source:'analyzer'};
  }
  if(p.wavelengths_nm && p.wavelengths_nm.length){
    return {pri:`${p.wavelengths_nm[0]}`, sec: p.wavelengths_nm.length>1 ? `${p.wavelengths_nm[1]}` : '—', source:'insert'};
  }
  return {pri:'—', sec:'—', source:'none'};
}
// Explains WHY a parameter shows more than one wavelength, or flags a
// wavelength inconsistency actually present in its own pack insert — never
// invents a bichromatic reference wavelength the insert doesn't state.
function wavelengthNote(p){
  const aw = p.analyzer_wl;
  if(p.id==='hba1c' && aw && aw.composite){
    const hb = aw.reactions[0], ha = aw.reactions[1];
    return {type:'info', html:
      `<strong>Two separate reactions, each read at its own wavelength — not one bichromatic read.</strong> ` +
      `R(Hb)+sample is read at <b>${hb.pri}${hb.sec!=null?'/'+hb.sec:''}&nbsp;nm</b> (bichromatic) to give total haemoglobin. Independently, R1(HbA1c)+sample is read as a reagent blank, then R2(HbA1c) is added and the developed color is read at <b>${ha.pri}${ha.sec!=null?'/'+ha.sec:''}&nbsp;nm</b>. ` +
      `%HbA1c is the ratio of the HbA1c-reaction signal to the Hb-reaction signal (× a calibration factor) — dividing by [Hb] is what cancels out sample dilution/hemoglobin concentration, not the choice of wavelength. ` +
      `<span style="color:var(--ink-muted);">Analyzer settings per Mindray BS-2800M/BS-2600M parameter sheet (${esc(aw.source_ref)}), channels Hb-${esc(hb.no)} / HbA1c-${esc(ha.no)}.</span>`};
  }
  if(p.id==='ck-mb'){
    const confirm = (aw && !aw.excluded && aw.pri!=null)
      ? ` The BS-2800M/BS-2600M analyzer parameter sheet (${esc(aw.source_ref)}) confirms <b>${aw.pri}${aw.sec!=null?'/'+aw.sec:''}&nbsp;nm</b> as the configured reading wavelength, matching the reagent-blank figure.`
      : '';
    return {type:'warn', html:
      `<strong>This insert states two different wavelengths for CK-MB, and they don't agree.</strong> ` +
      `The Reaction Principle text says the monitored rate is read at <b>405&nbsp;nm</b>, but the Reagent Blank Absorbance section specifies the blank check at <b>340&nbsp;nm</b> — the wavelength this NADPH-producing (IFCC) method is normally read at.${confirm} ` +
      `Treat 340&nbsp;nm as authoritative for this NADPH-based chemistry; 405&nbsp;nm in the principle text looks like a copy-over from a different (chromogenic, NADH-analog) assay template.`};
  }
  if(aw && aw.excluded){
    return {type:'warn', html:
      `<strong>Not merged with the BS-2800M/BS-2600M analyzer parameter sheet.</strong> ${esc(aw.note)}`};
  }
  if(aw && aw.pri!=null){
    const sec = aw.sec!=null ? `, Secondary <b>${aw.sec}&nbsp;nm</b>` : '';
    return {type:'info', html:
      `<strong>Analyzer-configured wavelengths</strong> — Mindray BS-2800M/BS-2600M parameter sheet (${esc(aw.source_ref)}), channel ${esc(aw.chem)}/${esc(aw.no)}: Primary <b>${aw.pri}&nbsp;nm</b>${sec}.`};
  }
  if(p.wavelengths_nm.length>=2){
    return {type:'info', html:
      `<strong>Two wavelengths are stated for this assay.</strong> Values: ${p.wavelengths_nm.join(' nm, ')} nm — see the Reaction Principle and Assay Procedure above for which read each one corresponds to.`};
  }
  return null;
}

/* ================= Reaction principle, as a flow diagram ================= */
function directionIcon(p){
  if(p.direction==='decrease') return '↓';
  if(p.direction==='increase_inverse') return '↑ (inverse)';
  return '↑';
}
function renderPrincipleDiagram(p){
  const pd = p.principle_diagram;
  if(!pd || !pd.steps || !pd.steps.length){
    return `<div class="eqbox">${esc(p.principle_raw)}</div>`;
  }
  let html = '<div class="rxn-flow">';
  let lastGroup = undefined;
  pd.steps.forEach(step=>{
    if(step.group !== undefined && step.group !== lastGroup){
      html += `<div class="rxn-group-label">${esc(step.group)}</div>`;
      lastGroup = step.group;
    }
    const reactants = step.reactants.map(r=>`<span class="rxn-chip">${esc(r)}</span>`).join('<span class="rxn-plus">+</span>');
    const products = step.products.map(r=>`<span class="rxn-chip product${step.blocked?' blocked':''}">${esc(r)}</span>`).join('<span class="rxn-plus">+</span>');
    html += `<div class="rxn-step">
      <div class="rxn-side reactants">${reactants}</div>
      <div class="rxn-arrow-wrap">
        ${step.arrow_label ? `<div class="rxn-enzyme">${esc(step.arrow_label)}</div>` : ''}
        <div class="rxn-arrow${step.blocked?' blocked':''}">${step.blocked?'<span class="rxn-blocked-x">⊘</span>':''}</div>
        ${step.arrow_sub ? `<div class="rxn-sub">${esc(step.arrow_sub)}</div>` : ''}
      </div>
      <div class="rxn-side products">${products}</div>
    </div>`;
  });
  html += '</div>';
  if(pd.measured){
    html += `<div class="rxn-measured"><span class="ic">${p.direction==='decrease'?'📉':'📈'}</span>
      <span><strong>${directionIcon(p)} Measured:</strong> ${esc(pd.measured)}</span></div>`;
  }
  if(pd.notes && pd.notes.length){
    html += `<div class="rxn-notes">${pd.notes.map(n=>`<div>· ${esc(n)}</div>`).join('')}</div>`;
  }
  html += `<details class="rxn-raw-toggle"><summary>Show exact pack-insert wording</summary><div class="eqbox">${esc(p.principle_raw)}</div></details>`;
  return html;
}

function reactionTypeLabel(p){
  const map = {
    "A":"Kinetic (rate) assay — continuous absorbance monitoring",
    "B":"Two-reagent fixed-time endpoint (blank read, then final read)",
    "C":"Two-reagent endpoint — single read after full incubation",
    "C_kinetic":"Two-reagent kinetic (rate) assay",
    "D":"Single-reagent fixed-time endpoint",
    "E":"Fixed-window rate assay (initial vs. final absorbance)",
    "F":"Dual independent reactions, ratio result (%)"
  };
  return map[p.pattern] || p.pattern;
}

        <p class="method">${esc(p.method_name)}</p>
      </div>
      <span class="badge"><span class="dot" style="background:${catColor}"></span>${p.category}</span>
    </div>

    <div class="stat-strip">
      <div class="stat"><div class="k">Pri. Wave</div><div class="v">${(()=>{const s=analyzerWaveStats(p); return s.pri==='—'?'—':esc(s.pri)+' nm';})()}</div></div>
      <div class="stat"><div class="k">Sec. Wave</div><div class="v">${(()=>{const s=analyzerWaveStats(p); return s.sec==='—'?'—':esc(s.sec)+' nm';})()}</div></div>
      <div class="stat"><div class="k">Reaction type</div><div class="v" style="font-size:12.5px;line-height:1.3;">${reactionTypeLabel(p)}</div></div>
      <div class="stat"><div class="k">Direction</div><div class="v">${p.direction==='decrease'?'Absorbance ↓':(p.direction==='increase_inverse'?'Signal ↑ (analyte inverse)':'Absorbance ↑')}</div></div>
      <div class="stat"><div class="k">Specimen type</div><div class="v" style="font-size:12.5px;line-height:1.3;">${(p.specimen_types&&p.specimen_types.length) ? esc(p.specimen_types.join(', ')) : '—'}</div></div>
      <div class="stat"><div class="k">Catalogue</div><div class="v" style="font-size:13px;">${esc(p.cat_no)}</div></div>
    </div>

    <section class="card">
      <h3><span class="n">1</span>Intended Use &amp; Clinical Significance</h3>
      <p class="prose"><strong>Intended use:</strong> ${esc(p.intended_use)}</p>

    <section class="card">

        <div class="pre">${esc(p.specimen || '—')}</div>
      </section>

    <div class="two-col">
      <section class="card">
        <h3><span class="n">8</span>Linearity Range</h3>
        ${renderRangeList(p.linearity_rows, p.linearity_note, p.linearity)}

      </section>
      <section class="card">
        <h3><span class="n">9</span>Reference Interval</h3>
        ${renderRangeList(p.reference_rows, p.reference_note, p.reference_interval)}
        ${renderConventionalBlock(p, 'ref')}

    <section class="card">
      <h3><span class="n">10</span>Precision (Manufacturer Data)</h3>

    <section class="card">
      <h3><span class="n">12</span>Method Comparison</h3>
      <p class="prose">${esc(p.method_comparison) || 'Not stated in this pack insert.'}</p>
    </section>
  `;
  drawDiagram(p, document.getElementById('diagram'));
  drawChart(p, document.getElementById('chart'));
  renderBreakdown(p, document.getElementById('breakdown'));
}

/* ================= Linearity / Reference: one line per row ================= */
function renderRangeList(rows, note, rawFallback){
  if(!rows || !rows.length){
    return `<p class="prose">${esc(rawFallback) || 'Not stated in this pack insert.'}</p>`;
  }
  const items = rows.map(r=>`<li><span class="rl-label">${esc(r.label)}</span><span class="rl-value">${esc(r.value)}</span></li>`).join('');
  return `<ul class="rowlist">${items}</ul>${note ? `<p class="note-block">${esc(note)}</p>` : ''}`;
}

/* ================= Conventional-unit reference/linearity update ================= */
function renderConventionalBlock(p, kind){
  const cu = p.conventional_ref_update;
  if(!cu){ return ''; }
  if(!cu.covered){
    return `<div class="conv-missing">Not covered by ${esc(cu.source)} — this parameter isn't listed in that document.</div>`;
  }
  const rows = kind==='ref' ? cu.ref_rows : cu.lin_rows;
  const items = rows.map(r=>`<li><span class="rl-label">${esc(r.label)}</span><span class="rl-value">${esc(r.value)}</span></li>`).join('');
  const headLabel = kind==='ref'
    ? (cu.is_bun ? 'Conventional unit — BUN (this reference document)' : `Conventional unit (${esc(cu.unit)})`)
    : `Conventional unit (${esc(cu.unit)})`;
  return `<div class="conv-block">
    <div class="conv-head">${headLabel}</div>
    <ul class="rowlist">${items}</ul>
    ${cu.note && kind==='ref' ? `<p class="conv-bun-note">${esc(cu.note)}</p>` : ''}
    <p class="conv-src">Source: ${esc(cu.source)}.</p>
  </div>`;
}

/* ================= Precision: SD/CV% table by level ================= */
function renderPrecisionTable(p){
  const pt = p.precision_table;
  if(!pt || !pt.rows || !pt.rows.length){
    return `<div class="pre">${esc(p.precision || 'Not stated in this pack insert.')}</div>`;
  }
  const levels = pt.levels;
  const unit = pt.unit ? esc(pt.unit) : '';
  const meanCaption = levels.map(lv=>{
    const m = pt.level_means[lv];
    return m!=null ? `${esc(lv)} mean ≈ ${m}${unit?(' '+unit):''}` : esc(lv);
  }).join(' &nbsp;·&nbsp; ');
  const headTop = `<th></th>` + levels.map(lv=>`<th class="grp" colspan="2">${esc(lv)}</th>`).join('');
  const headSub = `<th>Precision type</th>` + levels.map(()=>`<th class="grp">SD</th><th>CV%</th>`).join('');
  const rows = pt.rows.map(r=>{
    const cells = levels.map((lv,i)=>{
      const cell = r.levels[lv] || {};
      const sd = cell.sd!=null ? cell.sd : '—';
      const cv = cell.cv!=null ? cell.cv+'%' : '—';
      return `<td class="grp-first">${sd}</td><td>${cv}</td>`;
    }).join('');
    return `<tr><td>${esc(r.type)}</td>${cells}</tr>`;
  }).join('');
  return `
    <p class="prose" style="margin-top:0;font-size:12.5px;color:var(--ink-muted);">${meanCaption}</p>
    <div style="overflow-x:auto;">
      <table class="dt"><thead><tr>${headTop}</tr><tr>${headSub}</tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

/* ================= Reagent composition: grouped by physical bottle ================= */
function renderReagentTable(p){
  const rt = p.reagent_table;
  if(!rt || !rt.groups || !rt.groups.length){
    return `<div class="pre">${highlightReagents(p.reagent_components || '—')}</div>`;
  }
  const swatch = {R:'var(--ink-muted)', R0:'var(--ink-muted)', R1:'var(--blue)', R2:'var(--orange)', R3:'var(--violet)'};
  const groupsHtml = rt.groups.map(g=>{
    const rows = g.components.map(c=>`<tr><td>${esc(c.name)}</td><td style="text-align:right;">${esc(c.value)||'—'}</td></tr>`).join('');
    const label = g.label==='R' ? 'R (single reagent)' : g.label;
    return `
      <div class="reagent-group">
        <h4><span class="sw" style="background:${swatch[g.label]||'var(--ink-muted)'}"></span>${esc(label)}</h4>
        <table class="dt"><thead><tr><th>Component</th><th style="text-align:right;">Concentration</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>`;
  }).join('');
  const metaRows = [];
  if(rt.calibrator) metaRows.push(`<div><b>Calibrator:</b> ${esc(rt.calibrator)}</div>`);
  if(rt.control) metaRows.push(`<div><b>Control:</b> ${esc(rt.control)}</div>`);
  if(rt.pretreatment) metaRows.push(`<div><b>Pretreatment solution:</b> ${esc(rt.pretreatment)}</div>`);
  return groupsHtml + (metaRows.length ? `<div class="reagent-meta">${metaRows.join('')}</div>` : '');
}

/* ================= Assay procedure, as a pack-insert-style table ================= */
function renderAssayTable(p){
  const blocks = p.assay_table;
  if(!blocks || !blocks.length){
    return `<div class="pre">${highlightReagents(p.assay_procedure_raw || 'Not stated in this pack insert.')}</div>`;
  }
  const multi = blocks.length > 1;
  return blocks.map(b=>{
    const heading = (multi && b.heading) ? `<h4>${esc(b.heading)}</h4>` : '';
    let tableHtml = '';
    if(b.rows && b.rows.length){
      const isTwoCol = b.columns.length === 3;
      const head = isTwoCol
        ? `<tr><th>Component</th><th style="text-align:right;">Blank</th><th style="text-align:right;">Sample</th></tr>`
        : `<tr><th>Component</th><th style="text-align:right;">Volume</th></tr>`;
      const rows = b.rows.map(r=> isTwoCol
        ? `<tr><td>${highlightReagents(r.name)}</td><td style="text-align:right;">${esc(r.blank)}</td><td style="text-align:right;">${esc(r.sample)}</td></tr>`
        : `<tr><td>${highlightReagents(r.name)}</td><td style="text-align:right;">${esc(r.vol)}</td></tr>`
      ).join('');
      tableHtml = `<div style="overflow-x:auto;"><table class="dt"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
    }
    const metaEntries = Object.entries(b.meta || {});
    const metaHtml = metaEntries.length
      ? `<div class="reagent-meta">${metaEntries.map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join('')}</div>`
      : '';
    const insHtml = (b.instructions && b.instructions.length)
      ? `<ol class="assay-steps">${b.instructions.map(i=>`<li>${highlightReagents(i)}</li>`).join('')}</ol>`
      : '';
    if(!tableHtml && !metaHtml && !insHtml) return '';
    return `<div class="assay-block">${heading}${tableHtml}${metaHtml}${insHtml}</div>`;
  }).join('');
}

/* ================= Interference topics (structured) ================= */
function renderInterferenceTopics(p){
  const s = p.interference_structured;
  if(!s || !s.substances || !s.substances.length){
    return `<div class="pre">${esc(p.interferences || 'Not stated in this pack insert.')}</div>`;
  }
  const rows = s.substances.map(row=>{
    const ok = row.effect === 'NSI';
    return `<tr><td>${esc(row.substance)}</td><td>${esc(row.level)}</td>
      <td>${ok ? '<span class="interf-ok">✓ No significant interference</span>' : esc(row.effect)}</td></tr>`;
  }).join('');
  const notes = (s.notes||[]).map(n=>`<li class="topic-item topic-warn">${esc(n)}</li>`).join('');
  return `
    <p class="prose" style="margin-top:0;"><strong>Criterion:</strong> ${esc(s.criterion)}. Each substance below was spiked to the level shown and tested for recovery against this criterion — this is the "topic list" of what has been checked for this assay.</p>
    <div style="overflow-x:auto;">
      <table class="dt"><thead><tr><th>Substance tested</th><th>Level tested</th><th>Observed effect</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    ${notes ? `<p class="prose" style="margin:14px 0 6px;"><strong>Additional cautions stated in this insert:</strong></p><ul class="topic-list">${notes}</ul>` : ''}
  `;
}

/* ================= Reaction-curve breakdown (text steps) ================= */
function directionReason(p){
  const raw = (p.principle_raw||'').replace(/\s+/g,' ');
  const m = raw.match(/[^.]*proportional[^.]*\./i);
  return m ? m[0].trim() : 'The absorbance change is proportional to analyte concentration/activity.';
}
function fmtT(n){ return (Math.round(n*10)/10).toString(); }

function renderBreakdown(p, host){
  const t = p.timing || {};
  const wlx = wl(p);
  const reason = directionReason(p);
  const dirWord = p.direction==='decrease' ? 'falls' : 'rises';
  let steps = [];

  if(p.pattern==='D'){
    const tr = t.t_read;
    steps = [
      ['0 min','Sample + Reagent mixed', `Sample is pipetted into Reagent (R) and mixed thoroughly at 37°C — the color/complex-forming reaction begins immediately.`],
      [`0 → ${fmtT(tr)} min`,'Color/complex develops', `The absorbance ${dirWord} gradually during incubation as the reaction proceeds toward completion.`],
      [`${fmtT(tr)} min`,`Single read at ${wlx}`, `Absorbance is read once at the fixed end-point time. ${reason}`],
    ];
  } else if(p.pattern==='B'){
    const t1=t.t1, t2=t.t2;
    if(t1==null){
      steps = [['—','Timing not stated', 'This insert states only volumes; consult the analyzer parameter file for exact timing.']];
    } else {
      steps = [
        ['0 min','Sample + Reagent 1', `Sample is mixed with Reagent 1 and incubated at 37°C.`],
        [`${fmtT(t1)} min`,`Read A-blank at ${wlx}`, `Absorbance is read to establish the sample blank, then Reagent 2 is added to start the indicator reaction.`],
        [`${fmtT(t1)} → ${fmtT(t1+t2)} min`,'Indicator reaction develops', `The absorbance ${dirWord} as the coupled color/turbidity reaction proceeds.`],
        [`${fmtT(t1+t2)} min`,`Read A-sample at ${wlx}`, `Final absorbance is read. ΔA = A-sample − A-blank. ${reason}`],
      ];
    }
  } else if(p.pattern==='C'){
    const t1=t.t1, t2=t.t2;
    if(t1==null){
      steps = [['—','Timing not stated', 'This insert states only volumes and wavelength (see Assay Procedure); consult the analyzer parameter file for exact incubation times.']];
    } else {
      steps = [
        ['0 min','Sample + Reagent 1', `Sample and Reagent 1 are mixed and incubated at 37°C.`],
        [`${fmtT(t1)} min`,'Reagent 2 added', `Reagent 2 is added directly (no intermediate read) to start the indicator reaction.`],
        [`${fmtT(t1)} → ${fmtT(t1+t2)} min`,'Color develops', `The absorbance ${dirWord} during the second incubation.`],
        [`${fmtT(t1+t2)} min`,`Single read at ${wlx}`, `Absorbance is read once at the end of the full incubation. ${reason}`],
      ];
    }
  } else if(p.pattern==='A'||p.pattern==='C_kinetic'){
    const ti=t.t_incubate, tl=t.t_lag, tm=t.t_monitor;
    steps = [
      ['0 min','Sample + Reagent 1', `Sample and Reagent 1 are mixed and incubated for ${fmtT(ti)} min at 37°C — substrates equilibrate; no analytically-used absorbance change yet.`],
      [`${fmtT(ti)} min`,'Reagent 2 added', `Reagent 2 is added, starting (or coupling into) the enzymatic reaction.`],
      [`${fmtT(ti)} → ${fmtT(ti+tl)} min`,'Short lag', `A brief lag lets the coupled reaction reach a steady rate; this window is not used for the result.`],
      [`${fmtT(ti+tl)} → ${fmtT(ti+tl+tm)} min`,`Monitor ΔA/min at ${wlx}`, `Absorbance is read repeatedly and the rate of change (ΔA/min) is calculated over this fixed window. ${reason}`],
    ];
  } else if(p.pattern==='E'){
    const tl=t.t_lag, tm=t.t_monitor;
    steps = [
      ['0 min','Sample + Reagent mixed', `Sample and Reagent are mixed at 37°C; the PEPC/MDH-coupled reaction begins.`],
      [`${fmtT(tl)} min`,`Read A(initial) at ${wlx}`, `The initial absorbance is read after the reaction has been running for ${fmtT(tl)} min.`],
      [`${fmtT(tl)} → ${fmtT(tl+tm)} min`,'Reaction continues', `NADH-analog continues to be consumed, so absorbance keeps falling over this fixed window.`],
      [`${fmtT(tl+tm)} min`,`Read A(final) at ${wlx}`, `ΔA = (A-initial − A-final) ÷ ${fmtT(tm)} min gives the rate, which is proportional to CO₂ concentration.`],
    ];
  } else if(p.pattern==='F'){
    steps = [
      ['0 → 5 min','Hb reaction', `Sample + R(Hb) are mixed and incubated 5 min; absorbance A is read at 500 nm to give total [Hb].`],
      ['0 → 5 min','HbA1c reaction — blank', `Sample + R1(HbA1c) incubate 5 min; absorbance A1 is read at 660 nm as the reaction blank.`],
      ['5 → 10 min','HbA1c reaction — develop', `R2(HbA1c) (fructosyl-peptide oxidase/peroxidase) is added; the indicator reaction develops for a further 5 min.`],
      ['10 min','Read A2 at 660 nm', `%HbA1c is calculated as [HbA1c] ÷ [Hb] × K, canceling out sample hemoglobin concentration/dilution.`],
    ];
  }

  host.innerHTML = steps.map(s=>`<li><span class="bt">${esc(s[0])}</span><strong>${esc(s[1])}</strong><br>${esc(s[2])}</li>`).join('');
}

/* ================= SVG DIAGRAM (assay flow) ================= */
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function drawDiagram(p, host){
  host.innerHTML='';
  const W=420, stepW=110, H= p.pattern==='F' ? 200 : 140;
  const svg = svgEl('svg',{viewBox:`0 0 ${W} ${H}`, width:'100%', height:H, style:'max-width:420px'});
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#111';
  const ink2 = 'var(--ink-2)';
  const blue='var(--blue)', orange='var(--orange)', surf2='var(--surface-2)';

  function box(x,y,w,h,label,sub,fill){
    const g = svgEl('g',{});
    g.appendChild(svgEl('rect',{x,y,width:w,height:h,rx:8,fill:fill||surf2,stroke:'var(--border)'}));
    const t1 = svgEl('text',{x:x+w/2,y:y+h/2-2,'text-anchor':'middle','font-size':'11','font-weight':'700',fill:ink});
    t1.textContent = label; g.appendChild(t1);
    if(sub){
      const t2 = svgEl('text',{x:x+w/2,y:y+h/2+13,'text-anchor':'middle','font-size':'9.5',fill:ink2});
      t2.textContent = sub; g.appendChild(t2);
    }
    return g;
  }
  function arrow(x1,y,x2,label){
    const g = svgEl('g',{});
    g.appendChild(svgEl('line',{x1,y1:y,x2:x2-6,y2:y,stroke:'var(--axis)','stroke-width':1.4}));
    g.appendChild(svgEl('polygon',{points:`${x2-6},${y-4} ${x2},${y} ${x2-6},${y+4}`, fill:'var(--axis)'}));
    if(label){
      const t = svgEl('text',{x:(x1+x2)/2,y:y-6,'text-anchor':'middle','font-size':'9',fill:ink2});
      t.textContent=label; g.appendChild(t);
    }
    return g;
  }

  const y0=30, bh=48, bw=92;
  if(p.pattern==='D'){
    svg.appendChild(box(10,y0,bw,bh,'Sample + R', wl(p)+ ' mixed'));
    svg.appendChild(arrow(10+bw,y0+bh/2,10+bw+40));
    svg.appendChild(box(10+bw+40,y0,bw,bh,'Incubate', (p.timing.t_read||'—')+' min, 37°C'));
    svg.appendChild(arrow(10+bw*2+40,y0+bh/2,10+bw*2+80));
    svg.appendChild(box(10+bw*2+80,y0,bw+30,bh,'Read A',wl(p)));
  } else if(p.pattern==='C' || p.pattern==='B'){
    const t1 = p.timing.t1, t2=p.timing.t2;
    svg.appendChild(box(10,y0,bw,bh,'Sample + R1', (t1!=null? t1+' min':'—')+' incub.'));
    svg.appendChild(arrow(10+bw,y0+bh/2,10+bw+34, p.pattern==='B'?'read A-blank':''));
    svg.appendChild(box(10+bw+34,y0,bw,bh,'+ Reagent 2', (t2!=null? t2+' min':'—')+' incub.'));
    svg.appendChild(arrow(10+bw*2+34,y0+bh/2,10+bw*2+68));
    svg.appendChild(box(10+bw*2+68,y0,bw+40,bh,'Read A-sample',wl(p)));
  } else if(p.pattern==='A' || p.pattern==='C_kinetic'){
    const ti=p.timing.t_incubate, tl=p.timing.t_lag, tm=p.timing.t_monitor;
    svg.appendChild(box(10,y0,bw,bh,'Sample + R1', ti+' min incub.'));
    svg.appendChild(arrow(10+bw,y0+bh/2,10+bw+34));
    svg.appendChild(box(10+bw+34,y0,bw,bh,'+ Reagent 2', 'mix'));
    svg.appendChild(arrow(10+bw*2+34,y0+bh/2,10+bw*2+68));
    svg.appendChild(box(10+bw*2+68,y0,bw+40,bh,'Monitor ΔA/min', `${tl}–${(tl+tm).toFixed(1)} min, ${wl(p)}`));
  } else if(p.pattern==='E'){
    const tl=p.timing.t_lag, tm=p.timing.t_monitor;
    svg.appendChild(box(10,y0,bw,bh,'Sample + R', 'mix, 37°C'));
    svg.appendChild(arrow(10+bw,y0+bh/2,10+bw+34,`+${tl} min`));
    svg.appendChild(box(10+bw+34,y0,bw,bh,'Read A(initial)',wl(p)));
    svg.appendChild(arrow(10+bw*2+34,y0+bh/2,10+bw*2+68,`+${tm} min`));
    svg.appendChild(box(10+bw*2+68,y0,bw+40,bh,'Read A(final)',wl(p)));
  } else if(p.pattern==='F'){
    svg.appendChild(box(10,10,100,44,'Hb: R + Sample','read A @500nm, 5 min'));
    svg.appendChild(arrow(110,32,150));
    svg.appendChild(box(150,10,110,44,'[Hb] result',''));
    svg.appendChild(box(10,75,100,44,'HbA1c: R1+Sample','read A1 @660nm, 5 min'));
    svg.appendChild(arrow(110,97,150));
    svg.appendChild(box(150,75,110,44,'+ R2, read A2','660nm, +5 min'));
    const t = svgEl('text',{x:10,y:150,'font-size':'11','font-weight':'700',fill:ink});
    t.textContent='%HbA1c = [HbA1c] ÷ [Hb] × K'; svg.appendChild(t);
    const t2b = svgEl('text',{x:10,y:168,'font-size':'9.5',fill:'var(--ink-2)'});
    t2b.textContent='(K = calibration factor from the assigned calibrator)'; svg.appendChild(t2b);
  }
  host.appendChild(svg);
  const legend = document.createElement('div');
  legend.className='legend-row';

  host.appendChild(legend);
}
function wl(p){ return (p.wavelengths_nm && p.wavelengths_nm.length)? p.wavelengths_nm[0]+' nm' : ''; }

/* ================= SVG REACTION CURVE ================= */
function drawChart(p, host){
  host.innerHTML='';
  const W=420,H=200, padL=38,padR=14,padT=14,padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const svg = svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,style:'max-width:420px'});
  svg.appendChild(svgEl('rect',{x:0,y:0,width:W,height:H,fill:'transparent'}));

  // build (t, y) points on 0..1 axes then scale
  let pts = [], markers = [], shade=null, tMax=10, yLabel='Absorbance (rel.)';
  const up = p.direction!=='decrease';
  function seg(t0,t1,y0,y1,n){ const r=[]; for(let i=0;i<=n;i++){const f=i/n; r.push([t0+(t1-t0)*f, y0+(y1-y0)*f]);} return r; }
  function ease(t0,t1,y0,y1,n){ const r=[]; for(let i=0;i<=n;i++){const f=i/n; const e=1-Math.pow(1-f,2.2); r.push([t0+(t1-t0)*f, y0+(y1-y0)*e]);} return r; }

  if(p.pattern==='D'){
    const tr = p.timing.t_read || 5;
    tMax = tr*1.25;
    pts = ease(0, tr, 0.12, 0.75, 24);
    markers = [[tr,0.75,'Read']];
  } else if(p.pattern==='C'||p.pattern==='B'){
    const t1=p.timing.t1, t2=p.timing.t2;
    if(t1==null){ tMax=8; pts = ease(0,6,0.12,0.7,24); markers=[[6,0.7,'Read']]; }
    else {
      tMax = (t1+t2)*1.15;
      pts = seg(0,t1,0.12,0.12,4).concat(ease(t1,t1+t2,0.12,0.72,24).slice(1));
      markers = [[t1,0.12, p.pattern==='B'?'A-blank':''], [t1+t2,0.72,'A-sample']];
      if(p.pattern==='B') shade=[t1,t1+t2];
    }
  } else if(p.pattern==='A'||p.pattern==='C_kinetic'){
    const ti=p.timing.t_incubate, tl=p.timing.t_lag, tm=p.timing.t_monitor;
    tMax = (ti+tl+tm)*1.2;
    const base = up?0.15:0.78;
    const midY = up?0.30:0.62;
    const endY = up? 0.80: 0.14;
    pts = seg(0,ti,base,base,4)
      .concat(seg(ti,ti+tl,base, midY, 6).slice(1))
      .concat(seg(ti+tl, ti+tl+tm, midY, endY, 16).slice(1));
    shade=[ti+tl, ti+tl+tm];
    markers=[[ti,base,'+R2'],[ti+tl,midY,'start'],[ti+tl+tm,endY,'stop']];
  } else if(p.pattern==='E'){
    const tl=p.timing.t_lag, tm=p.timing.t_monitor;
    tMax=(tl+tm)*1.25;
    pts = seg(0,tl,0.5,0.5,4).concat(seg(tl,tl+tm,0.72,0.20,16).slice(1));
    markers=[[tl,0.72,'initial'],[tl+tm,0.20,'final']];
    shade=[tl,tl+tm];
  } else if(p.pattern==='F'){
    tMax=11;
    pts = seg(0,5,0.15,0.6,10);
    markers=[[5,0.6,'Hb read']];
  }

  const x = t => padL + (t/tMax)*plotW;
  const y = v => padT + (1-v)*plotH;

  // axes
  svg.appendChild(svgEl('line',{x1:padL,y1:padT,x2:padL,y2:H-padB,stroke:'var(--axis)','stroke-width':1}));
  svg.appendChild(svgEl('line',{x1:padL,y1:H-padB,x2:W-padR,y2:H-padB,stroke:'var(--axis)','stroke-width':1}));
  const xt = svgEl('text',{x:(padL+W-padR)/2,y:H-6,'text-anchor':'middle','font-size':'10',fill:'var(--ink-muted)'});
  xt.textContent='Time (min)'; svg.appendChild(xt);
  const ytxt = svgEl('text',{x:12,y:padT+8,'font-size':'9.5',fill:'var(--ink-muted)'});
  ytxt.textContent=up?'A ↑':'A ↓'; svg.appendChild(ytxt);

  // shaded monitor window
  if(shade){
    svg.appendChild(svgEl('rect',{x:x(shade[0]),y:padT,width:x(shade[1])-x(shade[0]),height:plotH,fill:'var(--blue)','fill-opacity':0.08}));
  }
  // gridlines (y at .25/.5/.75)
  [0.25,0.5,0.75].forEach(v=>{
    svg.appendChild(svgEl('line',{x1:padL,y1:y(v),x2:W-padR,y2:y(v),stroke:'var(--grid)','stroke-width':1}));
  });

  // x-axis ticks at t=0 and every marker time, so the timeline reads precisely
  const tickTimes = Array.from(new Set([0, ...markers.map(m=>Math.round(m[0]*10)/10)])).sort((a,b)=>a-b);
  tickTimes.forEach(tt=>{
    svg.appendChild(svgEl('line',{x1:x(tt),y1:H-padB,x2:x(tt),y2:H-padB+4,stroke:'var(--axis)','stroke-width':1}));
    const t = svgEl('text',{x:x(tt),y:H-padB+15,'text-anchor':'middle','font-size':'8.5',fill:'var(--ink-muted)'});
    t.textContent = tt; svg.appendChild(t);
  });

  // curve path
  const d = pts.map((pt,i)=> (i===0?'M':'L')+x(pt[0]).toFixed(1)+' '+y(pt[1]).toFixed(1)).join(' ');
  svg.appendChild(svgEl('path',{d,fill:'none',stroke:'var(--blue)','stroke-width':2,'stroke-linecap':'round'}));

  // markers
  markers.forEach(m=>{
    svg.appendChild(svgEl('circle',{cx:x(m[0]),cy:y(m[1]),r:3.4,fill:'var(--surface)',stroke:'var(--blue)','stroke-width':2}));
    if(m[2]){
      const t = svgEl('text',{x:x(m[0]),y:y(m[1])-8,'text-anchor':'middle','font-size':'9',fill:'var(--ink-2)'});
      t.textContent=m[2]; svg.appendChild(t);
    }
  });

  host.appendChild(svg);
  const legend = document.createElement('div');
  legend.className='legend-row';
  let desc = '';
  if(p.pattern==='A'||p.pattern==='C_kinetic') desc = 'Shaded band = ΔA/min monitoring window';
  else if(p.pattern==='B') desc = 'Shaded band = interval between A-blank and A-sample reads';
  else if(p.pattern==='E') desc = 'Shaded band = interval between initial and final reads';
  legend.innerHTML = `<span>${desc}</span>`;
  host.appendChild(legend);
  const note = document.createElement('p');
  note.className='note';
  note.textContent = 'Curve shape is illustrative — it encodes the stated reaction direction and the exact incubation/read timings from the pack insert, not measured absorbance values.';
  host.appendChild(note);
}
</script>
<script src="/js/back.js"></script>
</body>
