<html lang="th">
<head>

<title>Sigma - Uncertainty Calculator V.2</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1b2430;--mut:#667085;--line:#d9dee7;--pri:#1f3a5f;--inp:#fffbe8;--onpri:#fff;
--s6:#2e9e5b;--s5:#8cc152;--s4:#f2c230;--s3:#f08c3a;--s0:#e5484d;--q1:#6366f1;--q2:#f59e0b;--q3:#e5484d;
--t0:#4f8ef7;--t1:#f0a030;--t2:#38b27a}
:root[data-theme="dark"]{--bg:#10151c;--card:#18202a;--ink:#e6ebf2;--mut:#93a0b3;--line:#2c3746;--pri:#7fb0ff;--inp:#2a2810;--onpri:#10151c;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#18202a;--ink:#e6ebf2;--mut:#93a0b3;--line:#2c3746;--pri:#7fb0ff;--inp:#2a2810;--onpri:#10151c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{margin:0;font-size:20px;color:var(--pri)} header p{margin:2px 0 0;color:var(--mut)}
main{padding:16px;max-width:1500px;margin:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;border-right:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 16px;cursor:pointer;font:inherit}
.seg button:last-child{border-right:0}.seg button.on{background:var(--pri);color:var(--onpri);font-weight:600}
.infobar{display:flex;gap:6px 18px;flex-wrap:wrap;margin:0 0 10px;padding:6px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:13px}
.infobar b{color:var(--pri)}.infobar i{color:var(--mut);font-style:normal}
.infoform{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.infoform label{display:block;font-size:12px;color:var(--mut)}.infoform input{width:100%;margin-top:2px;font:inherit;color:var(--ink);background:color-mix(in srgb,var(--inp) 75%,var(--card));border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:22px}.card span{color:var(--mut);font-size:12px}.card .cls{color:#111;font-size:12px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap}

td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.g0 td{background:color-mix(in srgb,var(--t0) 11%,var(--card))}
tr.g1 td{background:color-mix(in srgb,var(--t1) 13%,var(--card))}
tr.g2 td{background:color-mix(in srgb,var(--t2) 12%,var(--card))}
tr.first td{border-top:2px solid var(--mut)}
td input,td select{font:inherit;color:var(--ink);background:color-mix(in srgb,var(--inp) 75%,var(--card));border:1px solid var(--line);border-radius:5px;padding:3px 5px}
td input{width:70px;text-align:right} td input.w2{width:110px;text-align:left} td input.wl{width:54px;text-align:left}
td select{max-width:160px} td input:disabled{opacity:.4}
td.out{font-variant-numeric:tabular-nums}
.cls{font-weight:600;border-radius:6px;padding:2px 8px;color:#111;display:inline-block}
.s6{background:var(--s6)}.s5{background:var(--s5)}.s4{background:var(--s4)}.s3{background:var(--s3)}.s0{background:var(--s0)}
.q1{background:var(--q1);color:#fff}.q2{background:var(--q2)}.q3{background:var(--q3)}
.del{border:0;background:none;color:var(--s0);cursor:pointer;font-size:16px}.del[data-add]{color:var(--pri);font-size:12px;font-weight:700}
section{margin-top:20px} h2{font-size:16px;color:var(--pri);margin:0 0 8px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto}
.doc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.doc code{background:var(--bg);padding:1px 5px;border-radius:4px}.doc li{margin:3px 0}
a{color:var(--pri)} .note{color:var(--mut);font-size:12px}
.chartbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:4px}.btn.sm{padding:2px 10px;font-size:12px}
.pg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin:0 0 20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--pri);padding-bottom:10px;margin-bottom:14px}
.pg-kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pg-head h2{font-size:22px;margin:2px 0 0;color:var(--pri)}.pg-sub{font-size:12px;color:var(--mut)}
.pg-meta{display:grid;grid-template-columns:auto auto;gap:2px 18px;font-size:12px}.pg-meta b{color:var(--pri)}
.pg-foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.op-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.op-chart{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);overflow:auto}

.pg table{font-size:12px}
.tpg-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media(max-width:1000px){.tpg-grid{grid-template-columns:1fr}}
.ptable td,.ptable th{padding:5px 8px}.ptable tr:nth-child(even) td{background:color-mix(in srgb,var(--pri) 5%,var(--card))}
.ptable tr.prow-hi td{background:color-mix(in srgb,var(--pri) 14%,var(--card))}
.ptable tr.psec td{background:var(--pri);color:var(--onpri);font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px}
.tpg .pg-head{border-bottom-width:4px}.tpg-side{display:flex;flex-direction:column;gap:10px}
.pg-h3{font-size:14px;color:var(--pri);margin:14px 0 6px}
.bars2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bars2 svg{min-width:0!important}
@media(max-width:900px){.bars2{grid-template-columns:1fr}}
.qg-guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.qg-guide div{border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:8px;padding:8px 10px;font-size:12px}
.print-only{display:none}
@page{size:A4 landscape;margin:10mm}
body.exportmode header,body.exportmode #tabs,body.exportmode #tools,body.exportmode #groupBar,body.exportmode #infoBar{display:none}
.exp-bar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.exp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0}.exp-row select,.exp-row input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.exp-det{flex:1 1 100%}.exp-det summary{cursor:pointer;color:var(--pri)}.exp-grp{margin:6px 0}.exp-chk{display:inline-block;margin:2px 10px 2px 0;font-size:12px;white-space:nowrap}
.abbr{margin-top:12px;padding:6px 10px;border:1px dashed var(--line);border-radius:8px;font-size:11px;color:var(--mut);line-height:1.5}.abbr b{color:var(--pri)}
@media print{.screen-only{display:none!important}.print-only{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4 landscape;margin:10mm}
header,.infoform,.tabs,.seg,.bar,.chartbar,#tools,#infoBar,#groupBar,.del,.btn,.exp-bar{display:none!important}
.wrap{overflow:visible;border:0}body{background:#fff;color:#111}main{padding:0;max-width:none}.pg{box-shadow:none;border:0;border-radius:0;padding:0;margin:0}.pg+.pg{page-break-before:always}.pg table{font-size:9px}.pg th,.pg td{padding:2px 4px}tr{page-break-inside:avoid}.op-chart{overflow:visible;border:0}.op-chart svg{min-width:0!important}
.tpg{break-inside:avoid;page-break-inside:avoid}.tpg-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)!important}.tpg-grid>div{min-width:0}
body.portrait .pg table{width:100%!important;min-width:0}body.portrait .pg th,body.portrait .pg td{white-space:normal;padding:2px 3px;font-size:8px}
body.portrait .pg .cards{grid-template-columns:repeat(4,1fr);gap:6px}body.portrait .pg .card{padding:4px 8px}body.portrait .pg .card b{font-size:16px}
body.portrait .bars2{grid-template-columns:1fr!important}body.portrait .op-chart{padding:4px}body.portrait .pg-head h2{font-size:18px}
body.portrait .tpg .ptable td,body.portrait .tpg .ptable th{font-size:11px;padding:3px 8px}body.portrait .tpg .ptable tr.psec td{font-size:10px}body.portrait .tpg .pg-meta{max-width:none;width:100%;justify-content:flex-start}
body.portrait .pg-h3{font-size:12px}body.portrait .op-guide,body.portrait .abbr{font-size:9px}body.portrait .qg-guide{grid-template-columns:1fr 1fr 1fr}.tpg .pg-head{margin-bottom:6px;padding-bottom:6px}.tpg .pg-head h2{font-size:18px}
.tpg .cards{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-columns:none;gap:6px;margin-bottom:6px}.tpg .card{padding:3px 8px}.tpg .card b{font-size:15px}.tpg .card span,.tpg .card small{font-size:10px}
.tpg .ptable td,.tpg .ptable th{padding:0 7px;font-size:9.5px;line-height:1.25}.tpg .pg-meta{display:flex;flex-wrap:wrap;gap:0 14px;font-size:9px;max-width:55%;justify-content:flex-end}.tpg .pg-kicker{font-size:9px}.tpg .pg-sub{font-size:10px}.tpg .ptable tr.psec td{padding:1px 7px;font-size:9px}.tpg .cls{padding:0 6px}
.tpg .op-guide{font-size:10px;padding:4px 8px;margin-top:6px}.tpg .note{font-size:9px;margin:4px 0}.tpg .pg-foot{margin-top:6px;padding-top:4px;font-size:9px}.tpg .pg-h3{font-size:12px}.tpg .abbr{font-size:8px;line-height:1.3;padding:3px 7px;margin-top:4px}}
</style>
</head>
<body>
<header><div><h1>Measurement Uncertainty &amp; Sigma Metric</h1>
<p>Biochemistry / CBC — top-down MU (ISO 15189, ISO/TS 20914) · TEa อ้างอิง Westgard QC (CLIA 2025, Ricos desirable)</p></div><button class="btn" id="themeBtn" type="button" aria-label="Toggle Dark mode / Normal mode"></button></header>
<main>
<div class="tabs" id="tabs"></div>
<div class="bar" id="tools">
  <button class="btn" id="btnImport">⬆ Import CSV / Excel</button><input type="file" id="fileIn" accept=".csv,.txt,.xlsx" hidden>
  <label class="note"><input type="checkbox" id="appendChk"> เพิ่มต่อท้าย (ไม่แทนที่ข้อมูลเดิม)</label>
  <button class="btn" id="btnTplX" title="ไฟล์ Excel เปล่าสำหรับกรอกข้อมูล แล้วกด Import กลับเข้ามา">⬇ Template (Excel)</button><button class="btn" id="btnTplC" title="ไฟล์ CSV เปล่าสำหรับกรอกข้อมูล แล้วกด Import กลับเข้ามา">⬇ Template (CSV)</button>
  <button class="btn" id="btnCsv">⬇ Export CSV</button><button class="btn" id="btnXlsx">⬇ Export Excel (.xlsx)</button><button class="btn" id="btnPdf" title="โหมดเตรียมพิมพ์ PDF แบบ 1 เทส / หน้า">📄 Export mode (PDF)</button>
  <span class="note" id="status"></span></div>
<div id="infoBar"></div>
<div id="groupBar"></div>
<div id="view"></div>
</main>
<script>
/* io.js — dependency-free CSV / XLSX import & export helpers (inlined into index.html by build_web.py).
   Also loadable in Node for tests: const io = require("./io.js") */
(function(root){
const enc=new TextEncoder(),dec=new TextDecoder();
const concat=a=>{const n=a.reduce((x,y)=>x+y.length,0),o=new Uint8Array(n);let p=0;for(const y of a){o.set(y,p);p+=y.length}return o};

/* ---------------- ZIP (store) writer ---------------- */
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=crcT[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const parts=[],cd=[];let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);dv.setUint16(12,0x21,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);dv.setUint16(26,name.length,true);
    lh.set(name,30);parts.push(lh,data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,off,true);
    ch.set(name,46);cd.push(ch);off+=lh.length+data.length;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);
  return concat([...parts,...cd,end]);
}

/* ---------------- XLSX writer ---------------- */
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colL=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
function sheetXml(rows,header,dv){
  const widths=[];
  rows.forEach(r=>r.forEach((v,j)=>{const l=v==null?0:String(v).length;widths[j]=Math.min(60,Math.max(widths[j]||8,l+2))}));
  let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}>`;
  if(header)x+='<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  x+="<cols>"+widths.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join("")+"</cols><sheetData>";
  rows.forEach((r,i)=>{
    x+=`<row r="${i+1}">`;
    r.forEach((v,j)=>{
      if(v===null||v===undefined||v==="")return;
      const ref=colL(j)+(i+1),s=header&&i===0?' s="1"':"";
      if(typeof v==="number"&&isFinite(v))x+=`<c r="${ref}"${s}><v>${v}</v></c>`;
      else x+=`<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    });
    x+="</row>";
  });
  x+="</sheetData>";
  if(dv&&dv.length)x+=`<dataValidations count="${dv.length}">`+dv.map(d=>`<dataValidation type="list" allowBlank="1" showErrorMessage="1" sqref="${d.sqref}"><formula1>${xe(d.list)}</formula1></dataValidation>`).join("")+"</dataValidations>";
  return x+"</worksheet>";
}
function makeXlsx(sheets){
  const E=s=>enc.encode(s),H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const names=sheets.map((s,i)=>(s.name||"Sheet"+(i+1)).replace(/[\[\]:*?\/\\]/g,"_").slice(0,31));
  const files=[
    {name:"[Content_Types].xml",data:E(H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+"</Types>")},
    {name:"_rels/.rels",data:E(H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:"xl/workbook.xml",data:E(H+`<workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>`+names.map((n,i)=>`<sheet name="${xe(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+"</sheets></workbook>")},
    {name:"xl/_rels/workbook.xml.rels",data:E(H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`)},
    {name:"xl/styles.xml",data:E(H+`<styleSheet ${NS}><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F3A5F"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`)},
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:E(sheetXml(s.rows,s.header!==false,s.dv))}));
  return zipStore(files);
}

/* ---------------- ZIP / XLSX reader ---------------- */
async function inflateRaw(u8){
  const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function readZip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("ไม่ใช่ไฟล์ .xlsx (zip)");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u8.subarray(ds,ds+csz);
    files[name]=method===0?raw:await inflateRaw(raw);
    p+=46+nl+el+cl;

  const out=[];
  PRESETS.filter(p=>p.group===group).forEach(p=>p.ex_levels.forEach(([m,sd],i)=>{
    const r=newRow(group,p.test,"L"+(i+1));r.mean=m;r.sd=sd;
    r.bias=[0,0,0].map(()=>+((Math.random()*2-1)*Math.max(p.ric.I,.5)*.6).toFixed(2)).join(", ");
    out.push(r)}));
  return out;
}
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:NaN};
function calc(r){
  const p=byName(r.test);const mean=num(r.mean),sd=num(r.sd);
  if(!p||!(mean>0)||!(sd>=0))return null;
  const cv=sd/mean*100;
  const bs=String(r.bias||"").split(/[,;\s]+/).map(num).filter(isFinite);
  const meanBias=bs.length?bs.reduce((a,b)=>a+b,0)/bs.length:0;
  const rms=bs.length?Math.sqrt(bs.reduce((a,b)=>a+b*b,0)/bs.length):0;
  const uref=num(r.uref)||0,ucal=num(r.ucal)||0,k=num(r.k)||2;
  const ubias=Math.hypot(rms,uref);
  const uc=Math.sqrt(cv*cv+ubias*ubias+ucal*ucal);
  const U=k*uc,Uabs=U/100*mean;
  let pct=0,abs=0;
  if(r.src===SRC.CUSTOM)pct=num(r.custom)||0;
  else if(r.src===SRC.CLIA){pct=p.clia_pct||0;abs=p.clia_abs||0}
  else pct=p.ric.TE;
  const tea=Math.max(pct,abs/mean*100);
  const sigma=cv>0&&tea>0?(tea-Math.abs(meanBias))/cv:null;
  const qgi=sigma!=null?Math.abs(meanBias)/(1.5*cv):null;
  return{cv,meanBias,rms,uref,ubias,ucal,uc,k,U,Uabs,tea,sigma,qgi,nb:bs.length,unit:p.unit,mean};
}
function cls(s){
  if(s==null)return["","",""];
  if(s>=6)return["World class","s6","1:3s, N=2, R=1"];
  if(s>=5)return["Excellent","s5","1:3s/2:2s/R:4s, N=2, R=1"];
  if(s>=4)return["Good","s4","1:2.5s/2:2s/R:4s/4:1s/10x, N=4, R=2"];
  if(s>=3)return["Marginal","s3","1:2s/2:2s/R:4s/4:1s/8x/10x, N=6, R=2"];
  return["Unacceptable","s0","ไม่ผ่าน: ต้องปรับปรุงวิธี"];
}
function qgiInfo(q,s){
  if(q==null)return null;

  if(q<0.8)return{cls:"q1",name:"Imprecision",need,act:"ลด imprecision: ตรวจ maintenance/probe/pipette, reagent & QC lot, ความถี่ calibration, ลด SD ของ IQC"};
  if(q<=1.2)return{cls:"q2",name:"Imprecision + Inaccuracy",need,act:"ปรับปรุงทั้ง precision และ bias"};
  return{cls:"q3",name:"Inaccuracy (bias)",need,act:"ลด bias: recalibrate, ตรวจ calibrator/traceability, เทียบกับ reference หรือกลุ่ม EQA"};
}

let opLabels=false;
function opSvg(pts,group,legend,labels,legW,bottom){

  for(let v=0;v<=XM;v+=10)s+=`<line x1="${px(v)}" x2="${px(v)}" y1="${py(0)}" y2="${py(YM)}" stroke="var(--line)"/><text x="${px(v)}" y="${PH0-m.b+16}" text-anchor="middle" font-size="11" fill="var(--mut)">${v}</text>`;
  for(let v=0;v<=YM;v+=20)s+=`<line x1="${px(0)}" x2="${px(XM)}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${py(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${v}</text>`;
  s+=`<line x1="${px(100/3)}" x2="${px(100/3)}" y1="${py(0)}" y2="${py(YM)}" stroke="var(--mut)" stroke-dasharray="5 4"/><line x1="${px(0)}" x2="${px(XM)}" y1="${py(100/3)}" y2="${py(100/3)}" stroke="var(--mut)" stroke-dasharray="5 4"/><text x="${px(100/3)+4}" y="${py(YM)+12}" font-size="10" fill="var(--mut)">33% TEa</text>`;
  lineCol.forEach(([sg,c])=>{const x1=Math.min(XM,100/sg),y1=100-sg*x1;
    s+=`<line x1="${px(0)}" y1="${py(100)}" x2="${px(x1)}" y2="${py(y1)}" stroke="var(${c})" stroke-width="2"/><text x="${px(x1)+4}" y="${py(y1)-4}" font-size="11" font-weight="700" fill="var(${c})">σ${sg}</text>`});

  s+=`<text x="${(m.l+PW-m.r)/2}" y="${PH0-8}" text-anchor="middle" font-size="12" fill="var(--ink)">Normalized CV (CV% / TEa × 100)</text><text transform="translate(14 ${(m.t+PH0-m.b)/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--ink)">Normalized Bias (|Bias%| / TEa × 100)</text>`;
  if(legend&&bottom){

      g.items.forEach((it,ii)=>{s+=`<text x="${x0+20}" y="${yy+22+ii*15}" font-size="12" fill="var(--ink)">${esc(it)}</text>`});
    }));
  }
  if(legend&&!bottom){

      s+=`<circle cx="${x0+6}" cy="${y}" r="6" fill="var(${g.v})"/><text x="${x0+20}" y="${y+4}" font-size="12" font-weight="700" fill="var(${g.v})">${g.name} (${g.n})</text>`;y+=18;

function keyinOut(tr,kind){
  const r=state.rows[state.group][+tr.dataset.i],c=calc(r),p=byName(r.test),q=s=>tr.querySelector(`[data-o="${s}"]`),set=(k,v)=>{const e=q(k);if(e)e.textContent=v};
  set("cv",c?f2(c.cv):"");set("mb",c?f2(c.meanBias):"");
  if(kind==="unc"){set("rms",c?f2(c.rms):"");set("uc",c?f2(c.uc):"");set("U",c?f2(c.U):"");set("res",c?fmtU(c.mean,c.Uabs,c.unit):"")}
  else{
    set("clia",p.clia_pct||p.clia_abs?p.clia_text:"— (ไม่มีใน CLIA)");set("ric",p.ric.TE);set("tea",c?f2(c.tea):"");set("sg",c&&c.sigma!=null?f2(c.sigma):"");
    q("cl").innerHTML=c?chip(c.sigma):"";
    const cu=r.src!==SRC.CUSTOM;tr.querySelector('[data-f="custom"]').disabled=cu;tr.querySelector('[data-f="csrc"]').disabled=cu;
  }
}

/* ---------- 2) Uncertainty ---------- */

  const lab=v=>v.r.test+(v.r.level?" "+v.r.level:"");
  const sumRows=byTest(ok).map(([t,a],ti)=>{const Us=a.map(v=>v.c.U),worst=a.reduce((x,v)=>v.c.U>x.c.U?v:x);

  const body=ok.map(v=>{const c=v.c;return`<tr ${trc(v)}><td>${esc(v.r.test)}</td><td>${esc(v.r.level)}</td><td>${esc(c.unit)}</td><td>${+c.mean.toFixed(3)}</td>
    <td>${f2(c.cv)}</td><td>${f2(c.rms)}</td><td>${f2(c.uref)}</td><td>${f2(c.ubias)}</td><td>${f2(c.ucal)}</td><td><b>${f2(c.uc)}</b></td><td>${c.k}</td>

  $("view").innerHTML=`<p class="note">Top-down: u<sub>c</sub> = √(u<sub>Rw</sub>² + u<sub>bias</sub>² + u<sub>cal</sub>²), U = k·u<sub>c</sub> · u<sub>Rw</sub> = CV จาก IQC · u<sub>bias</sub> = √(RMS bias² + u<sub>ref</sub>²)</p>`+
  cards([["จำนวน level ที่คำนวณได้",ok.length],["U% เฉลี่ย",ok.length?f2(mean_(ok.map(v=>v.c.U)))+" %":"-"],

  `<section><h2>ตารางสรุป Uncertainty รายเทส — ${g}</h2>${table(["Test","จำนวน level","U % (min – max)","Result: Mean ± U ของแต่ละ level","Level ที่ U สูงสุด"],sumRows)}</section>
   <section><h2>รายละเอียดการคำนวณ (ทุก level)</h2>${table(["Test","Level","Unit","Mean","u_Rw = CV %","RMS bias %","u_ref %","u_bias %","u_cal %","u_c %","k","U %","U (abs)","Result (Mean ± U)"],body)}</section>
   ${uncAbbrHtml()}
   <section><h2>Expanded uncertainty U% (k แต่ละแถว)</h2>${chartBox("c_unc","uncertainty_"+g,barChart(ok.map(v=>({label:lab(v),value:v.c.U,color:`var(--t${v.g})`})),{max:Math.max(10,...ok.map(v=>v.c.U))*1.05,aria:"U% chart"}))}</section>`;
}

/* ---------- 3) Sigma & OPSpecs ---------- */

  const counts=["World class","Excellent","Good","Marginal","Unacceptable"].map(n=>[n,ok.filter(v=>cls(v.c.sigma)[0]===n).length]);
  const skipped=vs.filter(v=>v.c&&v.c.sigma==null).length;
  const sumRows=byTest(ok).map(([t,a],ti)=>{const w=a.reduce((x,v)=>v.c.sigma<x.c.sigma?v:x);
    return`<tr class="g${ti%3}"><td>${esc(t)}</td><td>${a.length}</td><td class="l">${a.map(v=>`${esc(v.r.level)}: ${f2(v.c.sigma)}`).join(" · ")}</td>
    <td><b>${f2(w.c.sigma)}</b> (${esc(w.r.level)})</td><td>${chip(w.c.sigma)}</td><td class="l">${cls(w.c.sigma)[2]}</td></tr>`}).join("");
  const body=ok.map(v=>{const c=v.c;return`<tr ${trc(v)}><td>${esc(v.r.test)}</td><td>${esc(v.r.level)}</td><td>${+c.mean.toFixed(3)}</td><td>${f2(c.cv)}</td>
    <td>${f2(c.meanBias)}</td><td>${esc(v.r.src)}${v.r.src===SRC.CUSTOM&&v.r.csrc?` <small>(${esc(v.r.csrc)})</small>`:""}</td><td>${f2(c.tea)}</td>
    <td><b>${f2(c.sigma)}</b></td><td>${chip(c.sigma)}</td><td class="l">${cls(c.sigma)[2]}</td></tr>`}).join("");
  const pts=ok.filter(v=>v.c.tea>0).map(v=>({label:lab(v),x:v.c.cv/v.c.tea*100,y:Math.abs(v.c.meanBias)/v.c.tea*100,sg:v.c.sigma,cc:cls(v.c.sigma)[1],name:cls(v.c.sigma)[0]}));
  const sc={s6:"--s6",s5:"--s5",s4:"--s4",s3:"--s3",s0:"--s0"};
  $("view").innerHTML=`<p class="note">Sigma = (TEa<sub>eff</sub>% − |Bias%|) / CV% · TEa<sub>eff</sub> (Effective TEa = TEa ที่ใช้จริง) = max(TEa%, TEa<sub>abs</sub>/Mean×100) · Bias = ค่าเฉลี่ย bias จาก EQA${skipped?` · <b>${skipped} แถวไม่มี TEa (เลือกแหล่ง TEa อื่น)</b>`:""}</p>`+
  cards([["Level ที่คำนวณได้",ok.length],["Sigma เฉลี่ย",ok.length?f2(mean_(ok.map(v=>v.c.sigma))):"-"],["σ ≥ 4",`${ok.filter(v=>v.c.sigma>=4).length} / ${ok.length}`],...counts.map(([n,k])=>[n,k])])+
  `<section><h2>สรุปผล Sigma รายเทส (ตัดสินจาก level ที่ต่ำสุด) — ${g}</h2>${table(["Test","จำนวน level","Sigma แต่ละ level","Sigma ต่ำสุด","Class","Suggested QC rule"],sumRows)}</section>
   <section><h2>รายละเอียด Sigma (ทุก level)</h2>${table(["Test","Level","Mean","CV %","Mean bias %","TEa source","TEa eff %","Sigma","Class","Suggested QC rule"],body)}</section>
   <section><h2>Sigma ของแต่ละ level</h2>${chartBox("c_sig","sigma_"+g,barChart(ok.map(v=>({label:lab(v),value:v.c.sigma,color:`var(${sc[cls(v.c.sigma)[1]]})`})),{max:8,lines:[3,4,5,6],lineLabel:v=>"σ"+v,aria:"Sigma chart"}))}</section>
   <section><h2>Normalized OPSpecs chart — ${g}</h2><div class="bar"><label><input type="checkbox" id="opl" ${opLabels?"checked":""}> แสดงชื่อบนจุดด้วย</label>
   <span class="note">x = CV/TEa×100 · y = |Bias|/TEa×100 · เส้น σ: y = 100 − σ·x · จุดใต้เส้น σ สูงกว่า = คุณภาพดีกว่า · รายชื่อเทสจัดกลุ่มตามสีอยู่ทางขวา</span></div>${chartBox("c_ops","opspecs_"+g,opSvg(pts,g,true,opLabels))}</section>`;
  $("opl").onchange=e=>{opLabels=e.target.checked;pageSigma()};
}

/* ---------- 4) QGI ---------- */
function pageQGI(){
  const g=state.group,vs=view(g),ok=vs.filter(v=>v.c&&v.c.qgi!=null),lab=v=>v.r.test+(v.r.level?" "+v.r.level:"");
  const need=ok.filter(v=>v.c.sigma<6),n=c=>need.filter(v=>qgiInfo(v.c.qgi,v.c.sigma).cls===c).length;
  const body=ok.map(v=>{const c=v.c,q=qgiInfo(c.qgi,c.sigma);return`<tr ${trc(v)}><td>${esc(v.r.test)}</td><td>${esc(v.r.level)}</td><td>${f2(c.cv)}</td><td>${f2(Math.abs(c.meanBias))}</td>
    <td>${f2(c.sigma)} ${chip(c.sigma)}</td><td><b>${f2(c.qgi,3)}</b></td><td><span class="cls ${q.cls}">${q.name}</span></td><td class="l">${q.need}</td><td class="l">${q.act}</td></tr>`}).join("");
  const sumRows=byTest(ok).map(([t,a],ti)=>{const w=a.reduce((x,v)=>v.c.sigma<x.c.sigma?v:x),q=qgiInfo(w.c.qgi,w.c.sigma);
    return`<tr class="g${ti%3}"><td>${esc(t)}</td><td class="l">${a.map(v=>`${esc(v.r.level)}: ${f2(v.c.qgi,2)}`).join(" · ")}</td><td>${esc(w.r.level)} (σ=${f2(w.c.sigma)})</td><td><span class="cls ${q.cls}">${q.name}</span></td><td class="l">${q.need}</td></tr>`}).join("");
  const qc={q1:"--q1",q2:"--q2",q3:"--q3"};
  $("view").innerHTML=`<p class="note">QGI (Quality Goal Index) = |Bias%| / (1.5 × CV%) · &lt;0.8 → ปัญหา imprecision · 0.8–1.2 → ทั้งสองอย่าง · &gt;1.2 → ปัญหา inaccuracy (bias) · ใช้วินิจฉัยสาเหตุเมื่อ Sigma ไม่ถึงเป้า (ตัดสินจาก level ที่ Sigma ต่ำสุด)</p>`+
  cards([["Level ที่คำนวณได้",ok.length],["Imprecision (σ<6)",n("q1")],["Imprecision + Inaccuracy (σ<6)",n("q2")],["Inaccuracy (σ<6)",n("q3")]])+
  `<section><h2>สรุป QGI รายเทส — ${g}</h2>${table(["Test","QGI แต่ละ level","Level ที่ Sigma ต่ำสุด","สาเหตุหลัก (ตาม level นั้น)","ต้องแก้ไขหรือไม่"],sumRows)}</section>
   <section><h2>รายละเอียด QGI (ทุก level)</h2>${table(["Test","Level","CV %","|Bias| %","Sigma","QGI","แปลผล","ความจำเป็น","แนวทางแก้ไข"],body)}</section>
   <section><h2>QGI ของแต่ละ level</h2>${chartBox("c_qgi","qgi_"+g,barChart(ok.map(v=>({label:lab(v),value:v.c.qgi,color:`var(${qc[qgiInfo(v.c.qgi,v.c.sigma).cls]})`})),{max:Math.max(2,...ok.map(v=>v.c.qgi))*1.05,lines:[0.8,1.2],aria:"QGI chart"}))}</section>`;
}

  $("view").innerHTML=`<div class="doc" style="margin-bottom:12px"><b>แหล่งอ้างอิง TEa (Westgard QC)</b><ul>

  <li><a href="https://www.westgard.com/clia-and-quality-regulation-requirements/quality-requirements/biodatabase1.html" target="_blank" rel="noopener">Desirable Biological Variation Database specifications</a> (Ricos 2014) — <code>I = 0.5·CVI</code>, <code>B = 0.25·√(CVI²+CVg²)</code>, <code>TE = 1.65·I + B</code></li></ul>

function pageMethod(){
  $("view").innerHTML=`<div class="doc"><h2>วิธีคำนวณ (top-down)</h2><ol>
  <li><b>u<sub>Rw</sub> (%)</b> = CV% = SD / Mean × 100 จาก IQC สะสมระยะยาว (ควรครอบคลุมการเปลี่ยน lot reagent/calibrator, ผู้ปฏิบัติงาน)</li>
  <li><b>Bias%</b> จาก EQA/PT แต่ละรอบ = (ค่าที่แล็บวัด − ค่าเป้าหมาย)/ค่าเป้าหมาย × 100 ; Mean bias (signed) ใช้ใน Sigma/QGI ; RMS bias = √(Σbias²/n) ใช้ใน MU</li>
  <li><b>u<sub>bias</sub></b> = √(RMS bias² + u<sub>ref</sub>²) — u<sub>ref</sub> คือความไม่แน่นอนของค่าเป้าหมาย EQA (ใส่ 0 หากไม่ทราบ)</li>
  <li><b>u<sub>c</sub></b> = √(u<sub>Rw</sub>² + u<sub>bias</sub>² + u<sub>cal</sub>²) ; ใส่ u<sub>cal</sub> เมื่อยังไม่ได้รวมความไม่แน่นอนของ calibrator ไว้ใน CV</li>
  <li><b>U</b> = k × u<sub>c</sub> (k = 2 ≈ 95%) ; U(abs) = U% × Mean / 100 ; รายงาน “Mean ± U”</li>
  <li><b>TEa eff%</b> = max(TEa%, TEa<sub>abs</sub>/Mean×100) รองรับเกณฑ์ “…หรือ … (greater)” และ Na/K/Ca ที่เป็นหน่วยสัมบูรณ์ (ผลขึ้นกับระดับ Mean ของ level นั้น)</li>
  <li><b>Sigma</b> = (TEa eff% − |Mean bias%|) / CV%</li>
  <li><b>OPSpecs (normalized)</b>: x = CV/TEa×100, y = |Bias|/TEa×100 ; เส้น σ: y = 100 − σ·x</li>
  <li><b>QGI</b> = |Mean bias%| / (1.5 × CV%) — ดูคำอธิบายละเอียดด้านล่าง</li></ol>
  <h2>การแปลผล Sigma</h2><p>σ ≥ 6 World class · 5–6 Excellent · 4–5 Good · 3–4 Marginal · &lt; 3 Unacceptable</p></div>

  <div class="doc" style="margin-top:14px"><h2>คำอธิบาย TEa eff (Effective Total Allowable Error)</h2>
  <p><b>TEa eff คืออะไร</b> — ค่า TEa (เป็น %) ที่ <u>ใช้จริง</u> ในการคำนวณของแต่ละ level ย่อมาจาก <i>Effective Total Allowable Error</i></p>
  <p><b>ทำไมต้องมี</b> — เกณฑ์ TEa บางตัวระบุเป็น “% หรือค่าสัมบูรณ์ แล้วแต่ว่าอันไหนมากกว่า” เช่น Glucose ±6 mg/dL หรือ ±8% ดังนั้น TEa เป็น % จึงเปลี่ยนไปตามความเข้มข้นของ level ส่วน Na, K, Ca ที่ CLIA ให้เป็นหน่วยสัมบูรณ์อย่างเดียว (เช่น Na ±4 mmol/L) ก็ต้องแปลงเป็น % ก่อนใช้</p>
  <p><b>สูตร</b> &nbsp; <code>TEa eff % = max( TEa %, TEa abs / Mean × 100 )</code></p>
  <table style="width:100%;margin:8px 0"><tr><th class="l">ตัวอย่าง</th><th class="l">เกณฑ์</th><th class="l">การคำนวณ</th><th class="l">TEa eff</th></tr>
  <tr><td class="l">Glucose, Mean = 100 mg/dL</td><td class="l">±6 mg/dL หรือ ±8%</td><td class="l">6/100×100 = 6% เทียบกับ 8%</td><td class="l"><b>8%</b> (ใช้ %)</td></tr>
  <tr><td class="l">Glucose, Mean = 50 mg/dL</td><td class="l">±6 mg/dL หรือ ±8%</td><td class="l">6/50×100 = 12% เทียบกับ 8%</td><td class="l"><b>12%</b> (ใช้ค่าสัมบูรณ์)</td></tr>
  <tr><td class="l">Sodium, Mean = 140 mmol/L</td><td class="l">±4 mmol/L</td><td class="l">4/140×100</td><td class="l"><b>2.86%</b></td></tr>
  <tr><td class="l">WBC (CLIA ±10%)</td><td class="l">±10%</td><td class="l">ไม่มีค่าสัมบูรณ์</td><td class="l"><b>10%</b></td></tr></table>
  <p><b>นำไปใช้ที่ไหน</b> — ในสูตร Sigma = (TEa eff − |Bias|)/CV และเป็นตัวหารของกราฟ OPSpecs (x = CV/TEa eff, y = |Bias|/TEa eff) · เกณฑ์ Ricos และ Custom เป็น % ล้วน จึงได้ TEa eff = TEa ที่ตั้งไว้</p>

  <div class="doc" style="margin-top:14px"><h2>คำอธิบาย QGI (Quality Goal Index)</h2>
  <p><b>QGI คืออะไร</b> — ดัชนีที่ใช้วินิจฉัยว่า <u>เมื่อ Sigma ไม่ถึงเป้า สาเหตุหลักมาจาก imprecision (CV สูง) หรือ inaccuracy (bias สูง)</u> โดยเทียบขนาดของ bias กับ imprecision ของวิธีตรวจ จึงช่วยตัดสินใจว่าควรแก้ที่ส่วนใด</p>

  <table style="width:100%;margin:8px 0"><tr><th class="l">ค่า QGI</th><th class="l">แปลผล</th><th class="l">ความหมาย</th><th class="l">แนวทางแก้ไข</th></tr>
  <tr><td class="l"><span class="cls q1">&lt; 0.8</span></td><td class="l">Imprecision</td><td class="l" style="white-space:normal">bias น้อยเมื่อเทียบกับ CV — ปัญหาอยู่ที่ความแม่น้อย/ผลแกว่ง</td><td class="l" style="white-space:normal">ตรวจ maintenance, probe/pipette, อายุ reagent และ lot ของ QC, ความถี่ calibration, สภาพแวดล้อม/อุณหภูมิ, ผู้ปฏิบัติงาน เพื่อลด SD</td></tr>
  <tr><td class="l"><span class="cls q2">0.8 – 1.2</span></td><td class="l">Imprecision + Inaccuracy</td><td class="l" style="white-space:normal">ทั้ง bias และ CV มีส่วนเท่าๆ กัน</td><td class="l" style="white-space:normal">ปรับปรุงทั้งสองด้าน — เริ่มจาก precision แล้วตามด้วยการ calibrate/ตรวจ traceability</td></tr>
  <tr><td class="l"><span class="cls q3">&gt; 1.2</span></td><td class="l">Inaccuracy (bias)</td><td class="l" style="white-space:normal">bias เป็นสาเหตุหลัก</td><td class="l" style="white-space:normal">recalibrate, ตรวจ calibrator/traceability และ lot, เทียบกับ reference หรือกลุ่มเพื่อน EQA, พิจารณาปรับ factor/ใช้ method อื่น</td></tr></table>
  <p><b>เมื่อไรควรใช้</b> — ใช้เมื่อ Sigma ต่ำกว่าเป้า (ที่ σ &lt; 4 ต้องปรับปรุง · σ 4–6 ควรติดตาม · σ ≥ 6 ไม่จำเป็นต้องแก้) หน้า QGI จึงแสดงคอลัมน์ “ความจำเป็น” และสรุปรายเทสจาก level ที่ Sigma ต่ำสุด</p>
  <p><b>ตัวอย่าง</b> — CV = 3.0%, Bias = 2.0% → QGI = 2.0 / (1.5 × 3.0) = 0.44 (&lt; 0.8) → ปัญหาหลักคือ imprecision ; ถ้า CV = 1.5%, Bias = 3.0% → QGI = 3.0 / (1.5 × 1.5) = 1.33 (&gt; 1.2) → ปัญหาหลักคือ bias</p>
  <p><b>ข้อควรระวัง</b> — QGI เป็นเครื่องมือชี้แนวทางแก้ไข ไม่ใช่เกณฑ์ผ่าน/ไม่ผ่าน (ใช้ Sigma ตัดสิน) · ถ้า bias มาจาก EQA เพียงไม่กี่รอบ ค่า bias และ QGI จะมีความไม่แน่นอนสูง · ควรคำนวณแยกทุก level ของ IQC</p></div>

  <div class="doc" style="margin-top:14px"><h2>คำอธิบายคำศัพท์</h2><ul>
  <li><b>IQC</b> — Internal Quality Control : การควบคุมคุณภาพภายในห้องปฏิบัติการ ใช้คำนวณ Mean/SD/CV</li>
  <li><b>EQA / PT</b> — External Quality Assessment / Proficiency Testing : การประเมินคุณภาพภายนอก ใช้คำนวณ bias เทียบกับค่าเป้าหมาย</li>
  <li><b>CV%</b> — สัมประสิทธิ์การกระจาย (SD/Mean×100) สะท้อน imprecision</li>
  <li><b>Bias%</b> — ความคลาดเคลื่อนเชิงระบบเทียบกับค่าเป้าหมาย สะท้อน inaccuracy</li>
  <li><b>TEa</b> — Total Allowable Error : ความคลาดเคลื่อนรวมที่ยอมรับได้ (อ้างอิง CLIA 2025 หรือ Ricos desirable)</li>
  <li><b>TEa eff</b> — Effective TEa : TEa (%) ที่ใช้จริงของแต่ละ level = max(TEa %, TEa abs/Mean×100) (ดูคำอธิบายด้านบน)</li>
  <li><b>Sigma</b> — จำนวน SD ของ imprecision ที่พอดีกับช่วง TEa หลังหัก bias ; ยิ่งสูงยิ่งดี (σ ≥ 6 = World class)</li>
  <li><b>Measurement Uncertainty (U)</b> — ช่วงที่ค่าจริงน่าจะอยู่ (ที่ความเชื่อมั่น ≈ 95% เมื่อ k = 2) ; u<sub>c</sub> = ความไม่แน่นอนมาตรฐานรวม</li>
  <li><b>u<sub>Rw</sub></b> — ความไม่แน่นอนจากความแม่น (within-lab reproducibility) = CV% จาก IQC ระยะยาว</li>
  <li><b>RMS bias</b> — ค่ากำลังสองเฉลี่ยของ bias จาก EQA/PT = √(Σbias²/n)</li>
  <li><b>u<sub>ref</sub></b> — ความไม่แน่นอนของค่าเป้าหมาย (assigned value) ของ EQA</li>
  <li><b>u<sub>bias</sub></b> — ความไม่แน่นอนเนื่องจาก bias = √(RMS bias² + u<sub>ref</sub>²)</li>
  <li><b>u<sub>cal</sub></b> — ความไม่แน่นอนของ calibrator</li>
  <li><b>u<sub>c</sub></b> — ความไม่แน่นอนมาตรฐานรวม (combined standard uncertainty) = √(u<sub>Rw</sub>² + u<sub>bias</sub>² + u<sub>cal</sub>²)</li>
  <li><b>k</b> — coverage factor (ปกติ 2)</li>
  <li><b>OPSpecs chart</b> — แผนภูมิ normalized (x = CV/TEa, y = Bias/TEa) แสดงตำแหน่งของแต่ละ test เทียบเส้น σ ; จุดที่อยู่ใกล้มุมซ้ายล่างดีที่สุด</li>
  <li><b>level</b> — ระดับของสาร QC (เช่น normal / abnormal) ; Biochemistry ใช้ 2 level, CBC ใช้ 3 level เป็นค่าเริ่มต้น</li></ul>
  <p class="note">ควรตัดสินใจจาก level ที่ตัดสินใจทางคลินิก (medical decision level) หรือ level ที่ Sigma ต่ำสุด</p></div>`;
}

  const h=Math.ceil(items.length/2);
  return`<div class="bars2">${barChart(items.slice(0,h),opts)}${barChart(items.slice(h),opts)}</div>`;
}

    <div class="pg-meta"><div><b>รพ.</b> ${esc(i.hospital)||"—"}</div><div><b>Lab</b> ${esc(i.lab)||"—"}</div><div><b>EQA</b> ${esc(i.eqa[g])||"—"}</div><div><b>วันที่</b> ${today}</div></div></div>`;

  const pages=[];

  const repSigma=(g,vs)=>{

    pages.push(`<section class="pg">${head("ผลการคำนวณ Sigma — "+g,"Sigma และ QC rule ที่แนะนำของทุก level",g)}
      ${cards([["จำนวน level",sg.length],["Sigma เฉลี่ย",sg.length?f2(mean_(sg.map(v=>v.c.sigma))):"-"],["σ ≥ 4",`${sg.filter(v=>v.c.sigma>=4).length} / ${sg.length}`],["σ < 3",sg.filter(v=>v.c.sigma<3).length]])}
      ${sg.length?table(["Test","Level","Mean","CV %","Bias %","TEa eff % (แหล่ง)","Sigma","Class","Suggested QC rule"],body):'<p class="note">ยังไม่มีข้อมูล</p>'}
      ${skipped?`<p class="note">${skipped} แถวไม่มี TEa จึงไม่คำนวณ Sigma</p>`:""}${abbr(false)}${foot(fn,g+" · ผลการคำนวณ")}</section>`);
    const pts=sg.filter(v=>v.c.tea>0).map(v=>({label:lab(v),x:v.c.cv/v.c.tea*100,y:Math.abs(v.c.meanBias)/v.c.tea*100,sg:v.c.sigma,cc:cls(v.c.sigma)[1],name:cls(v.c.sigma)[0]}));

    pages.push(`<section class="pg opg">${head("Normalized OPSpecs chart — "+g,"ตำแหน่งของแต่ละ test/level เทียบเส้น Sigma",g)}

      ${foot(fn,g+" · OPSpecs chart")}</section>`);
  };

  const repUnc=(g,vs)=>{

    pages.push(`<section class="pg">${head("รายงาน Measurement Uncertainty — "+g,"Top-down (ISO 15189 / ISO/TS 20914) ของทุก level",g)}
      ${cards([["จำนวน level",vs.length],["U% เฉลี่ย",vs.length?f2(mean_(vs.map(v=>v.c.U)))+" %":"-"],["U% สูงสุด",maxv?`${f2(maxv.c.U)} %<br><small>${esc(lab(maxv))}</small>`:"-"],["U% ต่ำสุด",minv?`${f2(minv.c.U)} %<br><small>${esc(lab(minv))}</small>`:"-"]])}
      ${vs.length?`<h3 class="pg-h3">สรุปรายเทส</h3>${table(["Test","จำนวน level","U % (min – max)","Result: Mean ± U ของแต่ละ level","Level ที่ U สูงสุด"],sum)}
      <h3 class="pg-h3">รายละเอียดการคำนวณ</h3>${table(["Test","Level","Unit","Mean","u_Rw = CV %","RMS bias %","u_ref %","u_bias %","u_cal %","u_c %","k","U %","U (abs)","Result (Mean ± U)"],det)}`:'<p class="note">ยังไม่มีข้อมูล</p>'}
      <div class="op-guide"><b>สูตรที่ใช้</b> — u<sub>Rw</sub> = CV% = SD/Mean×100 (IQC สะสม) · u<sub>bias</sub> = √(RMS bias² + u<sub>ref</sub>²) (RMS bias จาก EQA/PT) · u<sub>c</sub> = √(u<sub>Rw</sub>² + u<sub>bias</sub>² + u<sub>cal</sub>²) · U = k × u<sub>c</sub> (k = 2 ≈ 95%) · U(abs) = U% × Mean/100</div>
      ${uncAbbrHtml()}${foot(fn,g+" · ตาราง Uncertainty")}</section>`);
    const items=vs.map(v=>({label:lab(v),value:v.c.U,color:`var(--t${v.g})`}));
    pages.push(`<section class="pg opg">${head("กราฟ Expanded uncertainty U% — "+g,"U% (k ตามที่กำหนดในแต่ละแถว) ของทุก level",g)}
      <div class="op-chips"><span class="cls q1">เฉลี่ย ${vs.length?f2(mean_(vs.map(v=>v.c.U))):"-"} %</span><span class="cls q2">สูงสุด ${maxv?f2(maxv.c.U):"-"} %</span><span class="cls s6">ต่ำสุด ${minv?f2(minv.c.U):"-"} %</span></div>
      <div class="op-chart">${barsSplit(items,{max:Math.max(10,...vs.map(v=>v.c.U))*1.05,aria:"U% chart"})}</div>

      <h3 class="pg-h3">รายละเอียด QGI</h3>${table(["Test","Level","CV %","|Bias| %","Sigma","QGI","แปลผล","ความจำเป็น","แนวทางแก้ไข"],det)}`:'<p class="note">ยังไม่มีข้อมูล</p>'}
      ${foot(fn,g+" · ตาราง QGI")}</section>`);
    const items=ok.map(v=>({label:lab(v),value:v.c.qgi,color:`var(${{q1:"--q1",q2:"--q2",q3:"--q3"}[qgiInfo(v.c.qgi,v.c.sigma).cls]})`}));
    pages.push(`<section class="pg opg">${head("กราฟ QGI (Quality Goal Index) — "+g,"เส้นประ = เกณฑ์ 0.8 และ 1.2",g)}
      <div class="op-chips"><span class="cls q1">Imprecision: ${ok.filter(v=>v.c.qgi<0.8).length}</span><span class="cls q2">ทั้งสอง: ${ok.filter(v=>v.c.qgi>=0.8&&v.c.qgi<=1.2).length}</span><span class="cls q3">Inaccuracy: ${ok.filter(v=>v.c.qgi>1.2).length}</span></div>
      <div class="op-chart">${barsSplit(items,{max:Math.max(2,...ok.map(v=>v.c.qgi))*1.05,lines:[0.8,1.2],aria:"QGI chart"})}</div>
      <div class="qg-guide">
        <div style="border-left-color:var(--q1)"><b>QGI &lt; 0.8 — Imprecision</b><br>ตรวจ maintenance, probe/pipette, reagent & QC lot, ความถี่ calibration เพื่อลด SD</div>
        <div style="border-left-color:var(--q2)"><b>0.8 – 1.2 — ทั้งสองอย่าง</b><br>ปรับปรุงทั้ง precision และ bias เริ่มจาก precision</div>
        <div style="border-left-color:var(--q3)"><b>QGI &gt; 1.2 — Inaccuracy (bias)</b><br>recalibrate, ตรวจ calibrator/traceability, เทียบกับ reference หรือกลุ่ม EQA</div></div>
      ${foot(fn,g+" · กราฟ QGI")}</section>`);
  };


  const tpages=[];
  let tnum=0;const ttotal=GROUPS.reduce((n,g)=>n+byTest(view(g).filter(v=>v.c&&v.c.sigma!=null)).filter(([tt,aa])=>keepFn(g,tt,aa)).length,0);
  const PARTS=Object.assign({data:true,tea:true,sigma:true,qgi:true,unc:true,chart:true},opts&&opts.parts);
  const repTest=(g,vs)=>{
    byTest(vs.filter(v=>v.c.sigma!=null)).forEach(([test,a])=>{
      if(!keepFn(g,test,a))return;
      tnum++;
      const p=byName(test),w=a.reduce((x,v)=>v.c.sigma<x.c.sigma?v:x),q=qgiInfo(w.c.qgi,w.c.sigma),wu=a.reduce((x,v)=>v.c.U>x.c.U?v:x);
      const teaParts=v=>{const r=v.r;if(r.src===SRC.CUSTOM)return[num(r.custom)||0,0];if(r.src===SRC.CLIA)return[p.clia_pct||0,p.clia_abs||0];return[p.ric.TE,0]};
      const lv=v=>`<th>${esc(v.r.level)}</th>`;
      const row=(label,fn,cls_)=>`<tr${cls_?` class="${cls_}"`:""}><td class="l">${label}</td>${a.map(v=>`<td>${fn(v)}</td>`).join("")}</tr>`;
      const sec=(title)=>`<tr class="psec"><td colspan="${a.length+1}" class="l">${title}</td></tr>`;
      const R={};  // row builders

      if(PARTS.qgi)blocks.push(sec("QGI — Quality Goal Index")+(PARTS.data||PARTS.sigma?"":R.cv()+row("|Bias| %",v=>f2(Math.abs(v.c.meanBias))))+row("QGI",v=>`${f2(v.c.qgi,2)} <small>${qgiInfo(v.c.qgi,v.c.sigma).name}</small>`)+row("ความจำเป็น",v=>`<small>${qgiInfo(v.c.qgi,v.c.sigma).need}</small>`));
      if(PARTS.unc)blocks.push(sec("Measurement Uncertainty (k = "+esc(a[0].c.k)+")")+(PARTS.data?"":R.mean()+R.cv())+(PARTS.data?row("u<sub>bias</sub> % / u<sub>c</sub> %",v=>`${f2(v.c.ubias)} / ${f2(v.c.uc)}`):row("RMS bias % / u<sub>ref</sub> %",v=>`${f2(v.c.rms)} / ${f2(v.c.uref)}`)+row("u<sub>bias</sub> % / u<sub>cal</sub> %",v=>`${f2(v.c.ubias)} / ${f2(v.c.ucal)}`)+row("u<sub>c</sub> %",v=>f2(v.c.uc)))+row("<b>U %</b>",v=>`<b>${f2(v.c.U)}</b>`,"prow-hi")+row("Result (Mean ± U)",v=>`<small>${fmtU(v.c.mean,v.c.Uabs,v.c.unit)}</small>`));
      const hasTable=blocks.length>0;

      const pts=a.filter(v=>v.c.tea>0).map(v=>({label:test+" "+v.r.level,short:v.r.level,x:v.c.cv/v.c.tea*100,y:Math.abs(v.c.meanBias)/v.c.tea*100,sg:v.c.sigma,cc:cls(v.c.sigma)[1],name:cls(v.c.sigma)[0]}));

      const cardList=[];

      if(PARTS.qgi)cardList.push(["QGI — Quality Goal Index (level ที่ Sigma ต่ำสุด)",f2(w.c.qgi,2)]);

          <p class="note">x = CV/TEa eff×100 · y = |Bias|/TEa eff×100 · เส้น σ: y = 100 − σ·x · จุดใต้/ซ้ายเส้น σ สูงกว่า = ดีกว่า</p>${hasTable?summary:""}</div>`:"";

      tpages.push(`<section class="pg tpg">${head(esc(test),`${g} · หน่วย ${esc(p.unit)} · ${a.length} level`,g,kick)}
        ${cards(cardList)}
        <div class="tpg-grid"${single?' style="grid-template-columns:1fr!important"':""}>${leftBlock}${chartBlock}</div>
        ${PARTS.tea||PARTS.sigma?abbr(true,PARTS.unc):(PARTS.qgi?`<div class="abbr"><b>ตัวย่อ</b> — <b>QGI</b> = Quality Goal Index = |Bias%| / (1.5 × CV%) · &lt;0.8 imprecision · 0.8–1.2 ทั้งสอง · &gt;1.2 inaccuracy (bias) · <b>CV</b> = สัมประสิทธิ์การกระจาย (SD/Mean×100) · <b>Bias</b> = ความคลาดเคลื่อนเชิงระบบจาก EQA/PT · <b>σ</b> = Sigma metric</div>`:"")}${PARTS.unc?uncAbbrHtml():""}${foot(fn,`${g} · ${esc(test)} · หน้า ${tnum} / ${ttotal}`)}</section>`);
    });
  };
  GROUPS.forEach(g=>{
    if(opts&&opts.groups&&!opts.groups.includes(g))return;
    const vs=view(g).filter(v=>v.c);
    (type==="Uncertainty"?repUnc:type==="QGI"?repQgi:repSigma)(g,vs);

  });
  if(opts&&opts.collect)return opts.mode==="group"?pages:tpages;
  $("view").innerHTML=`<div class="screen-only"><div class="seg" style="margin-right:10px">${[["group","รายงานตามกลุ่ม"],["test","รายเทส (1 เทส / หน้า)"]].map(([v,l])=>`<button class="${v===rv?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>${rv==="group"?`<div class="seg">${REPORTS.map(r=>`<button class="${r===type?"on":""}" data-r="${r}">รายงาน ${r}</button>`).join("")}</div>`:""}
    <div class="bar"><span class="note">ดูรายงานบนหน้าจอ — ต้องการพิมพ์ / บันทึกเป็น PDF ให้กดปุ่ม <b>📄 Export mode (PDF)</b> ด้านบน</span></div>`+(rv==="test"?tpages:pages).join("")+`</div><div class="print-only">${tpages.join("")}</div>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{state.reportType=b.dataset.r;save();pageReport()});
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{state.reportView=b.dataset.v;save();pageReport()});
}

function buildXlsx(){

  const qg=[["Group","Test","Level","CV %","|Bias| %","Sigma","QGI","Interpretation","ความจำเป็น","แนวทางแก้ไข"]];

      qg.push([g,r.test,r.level,rnd(c.cv),rnd(Math.abs(c.meanBias)),rnd(c.sigma),rnd(c.qgi),q.name,q.need,q.act])}});

    {name:"Data",rows:data},{name:"Uncertainty",rows:unc},{name:"Sigma",rows:sig},{name:"QGI",rows:qg}]);

function setStatus(t){const e=$("status");if(e)e.textContent=t}
async function doImport(file){
  try{
    let tables;
    if(/\.xlsx$/i.test(file.name))tables=await IO.readXlsx(new Uint8Array(await file.arrayBuffer()));
    else if(/\.xls$/i.test(file.name))throw new Error("ไฟล์ .xls แบบเก่าไม่รองรับ — บันทึกเป็น .xlsx หรือ .csv ก่อน");
    else tables=[{name:"CSV",rows:IO.parseCsv(await file.text())}];
    const res=IO.importTables(tables,PRESETS,SRC);
    if(!res.count){setStatus("ไม่พบข้อมูลที่นำเข้าได้ — ไฟล์ต้องมีคอลัมน์ Test, Mean, SD"+(res.skipped.length?` (ไม่รู้จัก: ${res.skipped.slice(0,5).join(", ")})`:""));return}
    const append=$("appendChk").checked,touched=GROUPS.filter(g=>res.rows[g].length);
    if(!append&&touched.some(g=>state.rows[g].length)&&!confirm(`แทนที่ข้อมูลเดิมของ ${touched.join(" และ ")} ด้วยข้อมูลที่นำเข้า ${res.count} แถว?\n(ยกเลิกแล้วติ๊ก “เพิ่มต่อท้าย” หากต้องการเก็บข้อมูลเดิม)`))return;
    touched.forEach(g=>{state.rows[g]=append?state.rows[g].concat(res.rows[g]):res.rows[g]});
    const inf=res.info;if(inf.hospital)state.info.hospital=inf.hospital;if(inf.lab)state.info.lab=inf.lab;
    if(inf.eqa)Object.keys(inf.eqa).forEach(k=>{if(GROUPS.includes(k))state.info.eqa[k]=inf.eqa[k]});
    if(touched.length&&!touched.includes(state.group))state.group=touched[0];
    save();show();
    setStatus(`นำเข้า ${res.count} แถว (${res.used.join(", ")})`+(res.skipped.length?` · ข้ามเทสที่ไม่รู้จัก: ${res.skipped.slice(0,6).join(", ")}`:"")+(res.empty?` · ข้าม ${res.empty} แถวที่ Mean/SD ว่าง`:""));
  }catch(e){setStatus("นำเข้าไม่สำเร็จ: "+e.message)}
}
function svgData(svg){
  const cs=getComputedStyle(document.documentElement),vb=svg.viewBox.baseVal,c=svg.cloneNode(true);
  c.setAttribute("xmlns","http://www.w3.org/2000/svg");c.setAttribute("width",vb.width);c.setAttribute("height",vb.height);c.removeAttribute("style");
  c.setAttribute("font-family","system-ui,-apple-system,Sarabun,Arial,sans-serif");
  c.insertAdjacentHTML("afterbegin",`<rect width="100%" height="100%" fill="${cs.getPropertyValue("--card").trim()||"#fff"}"/>`);
  const str=new XMLSerializer().serializeToString(c).replace(/var\((--[\w-]+)\)/g,(m,v)=>cs.getPropertyValue(v).trim()||"#888");
  return{str,w:vb.width,h:vb.height};
}
function exportImage(svg,fmt,name){
  const{str,w,h}=svgData(svg);
  if(fmt==="svg"){download(new Blob([str],{type:"image/svg+xml"}),name+".svg");return}
  const img=new Image(),sc=2;
  img.onload=()=>{const cv=document.createElement("canvas");cv.width=w*sc;cv.height=h*sc;const x=cv.getContext("2d");x.scale(sc,sc);x.drawImage(img,0,0,w,h);
    cv.toBlob(b=>download(b,name+".png"),"image/png")};
  img.onerror=()=>setStatus("สร้างรูปไม่สำเร็จ");
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(str);
}

      <label id="expTypeWrap" style="display:none">ประเภทรายงาน <select id="expType">${REPORTS.map(r=>`<option>${r}</option>`).join("")}</select></label></div>
    <div class="exp-row exp-test-only"><b>ส่วนที่จะพิมพ์ (ติ๊กเลือก)</b>${EXP_PARTS.map(([k,l])=>`<label class="exp-chk"><input type="checkbox" data-p="${k}" checked> ${l}</label>`).join("")}
      <span class="note">ชุดด่วน:</span><button class="btn sm" data-preset="all">ทั้งหมด</button><button class="btn sm" data-preset="unc">เฉพาะ Uncertainty</button><button class="btn sm" data-preset="sigma">Sigma + chart</button><button class="btn sm" data-preset="qgi">เฉพาะ QGI</button></div>
    <div class="exp-row"><label>กลุ่ม <select id="expGroup"><option value="all">ทั้งหมด</option>${GROUPS.map(g=>`<option>${g}</option>`).join("")}</select></label>
      <label class="exp-test-only">เฉพาะ Sigma ต่ำสุด &lt; <input id="expSig" type="number" step="0.5" placeholder="ทั้งหมด" style="width:80px"></label>
      <button class="btn sm exp-test-only" id="expAll">เลือกทุกเทส</button><button class="btn sm exp-test-only" id="expNone">ล้างที่เลือก</button>
      <details class="exp-det exp-test-only"><summary>เลือกเทสที่จะพิมพ์</summary>${checks}</details></div></div>
    <div id="expPages" class="exp-pages"></div>`;
  $("expPrint").onclick=()=>window.print();
  $("expExit").onclick=exitExport;
  const PRESETS_P={all:["data","tea","sigma","qgi","unc","chart"],unc:["unc"],sigma:["sigma","chart"],qgi:["qgi"]};
  const syncParts=()=>document.querySelectorAll("[data-p]").forEach(c=>{c.checked=!!expState.parts[c.dataset.p]});
  document.querySelectorAll("[data-p]").forEach(c=>c.onchange=()=>{expState.parts[c.dataset.p]=c.checked;expRender()});
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{const on=PRESETS_P[b.dataset.preset];EXP_PARTS.forEach(([k])=>expState.parts[k]=on.includes(k));syncParts();expRender()});
  $("expGroup").onchange=e=>{expState.group=e.target.value;expRender()};
  $("expLayout").onchange=e=>{expState.layout=e.target.value;expRender()};
  $("expType").onchange=e=>{expState.type=e.target.value;expRender()};
  $("expSig").oninput=e=>{expState.maxSigma=e.target.value;expRender()};
  const setAll=on=>{document.querySelectorAll("[data-k]").forEach(c=>{c.checked=on;on?expState.sel.add(c.dataset.k):expState.sel.delete(c.dataset.k)});expRender()};
  $("expAll").onclick=()=>setAll(true);$("expNone").onclick=()=>setAll(false);
  document.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{c.checked?expState.sel.add(c.dataset.k):expState.sel.delete(c.dataset.k);expRender()});
  expRender();window.scrollTo(0,0);
}
function exitExport(){document.body.classList.remove("exportmode","portrait");const po=document.getElementById("pageOrient");if(po)po.remove();show()}

function templateRows(){
  const rows=[];
  GROUPS.forEach(g=>PRESETS.filter(p=>p.group===g).forEach(p=>{
    const n=(g==="CBC"?3:2),src=(p.clia_pct||p.clia_abs)?SRC.CLIA:SRC.RICOS;
    for(let k=1;k<=n;k++)rows.push([g,p.test,"L"+k,"","","",0,0,2,src,"",""]);
  }));
  return rows;
}
const TPL_HEAD=["Group","Test","Level","Mean","SD","EQA bias list","u_ref","u_cal","k","TEa source","Custom TEa %","Custom TEa source"];
function downloadTemplate(kind){
  const rows=templateRows();
  if(kind==="csv"){
    const map={"EQA bias list":"EQA_bias_list","TEa source":"TEa_source","Custom TEa %":"Custom_TEa%","Custom TEa source":"Custom_TEa_source"};
    const head=["Hospital","Lab","EQA",...TPL_HEAD.map(h=>map[h]||h)];
    download(new Blob([IO.toCsv([head,...rows.map(r=>["","","",...r])])],{type:"text/csv;charset=utf-8"}),"template_mu_sigma.csv");
  }else{
    const tests=PRESETS.map(p=>[p.group,p.test,p.unit,p.clia_text,p.ric.TE]);
    const guide=[["Column","คำอธิบาย"],["Group","Biochemistry หรือ CBC (เว้นว่างได้ ระบบจะดูจากชื่อ Test)"],["Test","ชื่อเทส ต้องตรงกับชีต Test list (เลือกจาก dropdown)"],
      ["Level","ชื่อ level ของ QC เช่น L1, L2, L3 — เพิ่มแถวใหม่ได้โดยคัดลอกแถวเดิมแล้วเปลี่ยน Level"],["Mean","ค่าเฉลี่ย IQC ของ level นั้น (จำเป็น)"],["SD","SD ของ IQC (จำเป็น)"],
      ["EQA bias list","Bias % จาก EQA/PT หลายรอบ คั่นด้วย comma เช่น 1.2, -0.8, 0.5 (เว้นว่างได้ = bias 0)"],["u_ref","ความไม่แน่นอนของค่าเป้าหมาย EQA (%) ไม่ทราบใส่ 0"],
      ["u_cal","ความไม่แน่นอนของ calibrator (%) ไม่ทราบใส่ 0"],["k","coverage factor ปกติ 2"],["TEa source","CLIA 2025 / Ricos Desirable / Custom"],
      ["Custom TEa %","ใส่เมื่อ TEa source = Custom"],["Custom TEa source","ระบุที่มาของ TEa แบบ Custom"],
      ["หมายเหตุ","แถวที่ Mean และ SD ว่างจะถูกข้ามตอน Import · ข้อมูล รพ./Lab/EQA กรอกในชีต Info · เสร็จแล้วบันทึกไฟล์และกดปุ่ม Import ในเว็บ"]];
    const dv=[{sqref:"B2:B600",list:`'Test list'!$B$2:$B$${tests.length+1}`},{sqref:"J2:J600",list:`"${SRC.CLIA},${SRC.RICOS},${SRC.CUSTOM}"`},{sqref:"A2:A600",list:'"Biochemistry,CBC"'}];
    const bytes=IO.makeXlsx([
      {name:"Info",header:false,rows:[["Hospital",""],["Lab",""],["EQA Biochemistry",""],["EQA CBC",""],["","(กรอกในคอลัมน์ B)"]]},
      {name:"Data",rows:[TPL_HEAD,...rows],dv},
      {name:"คำแนะนำ",rows:guide},
      {name:"Test list",rows:[["Group","Test","Unit","CLIA 2025 criterion","Ricos TE %"],...tests]}]);
    download(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"template_mu_sigma.xlsx");
  }
  setStatus(`ดาวน์โหลด template (${kind==="csv"?"CSV":"Excel"}) แล้ว — กรอก Mean, SD, Bias แล้วกด Import`);
}
function initTools(){
  $("btnTplX").onclick=()=>downloadTemplate("xlsx");$("btnTplC").onclick=()=>downloadTemplate("csv");
  $("btnImport").onclick=()=>$("fileIn").click();
  $("fileIn").onchange=e=>{const f=e.target.files[0];if(f)doImport(f);e.target.value=""};
  $("btnCsv").onclick=exportCsv;$("btnXlsx").onclick=exportXlsx;
  $("btnPdf").onclick=enterExport;
}

if(!state.rows.Biochemistry.length&&!state.rows.CBC.length){GROUPS.forEach(g=>state.rows[g]=exampleRows(g))}
initTools();
show();
</script>
