    const name=enc.encode(f.name),data=f.data,crc=crc32(data);

  if(header)x+='<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  x+="<cols>"+widths.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join("")+"</cols><sheetData>";

/* ---------------- ZIP / XLSX reader ---------------- */
async function inflateRaw(u8){

}
async function readZip(u8){

  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;

  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u8.subarray(ds,ds+csz);
    files[name]=method===0?raw:await inflateRaw(raw);

}
const unx=s=>s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCodePoint(+d)).replace(/&#x([0-9a-f]+);/gi,(m,d)=>String.fromCodePoint(parseInt(d,16))).replace(/&amp;/g,"&");

const textOf=s=>{let o="";String(s).replace(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g,(m,t)=>{o+=unx(t);return m});return o};

  const rels={};txt("xl/_rels/workbook.xml.rels").replace(/<Relationship\s([^>]*?)\/?>/g,(m,a)=>{const o=attrs(a);rels[o.Id]=o.Target;return m});
  const out=[];
  txt("xl/workbook.xml").replace(/<sheet\s([^>]*?)\/?>/g,(m,a)=>{
    const o=attrs(a),t=rels[o["r:id"]];if(!t)return m;
    const path=t.startsWith("/")?t.slice(1):"xl/"+t.replace(/^\.\//,"");
    const x=txt(path),rows=[];
    x.replace(/<c\s([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g,(mm,a2,inner)=>{
      const c=attrs(a2),m2=/^([A-Z]+)(\d+)$/.exec(c.r||"");if(!m2||inner==null)return mm;
      let v;

/* ---------------- CSV ---------------- */
function parseCsv(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"",cnt=c=>(first.match(new RegExp(c==="\t"?"\\t":"\\"+c,"g"))||[]).length;
  const d=[",",";","\t"].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}
    else cur+=ch;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

const norm=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]/g,"");

}
function matchPreset(name,presets){
  const n=norm(name);if(!n)return null;
  let p=presets.find(x=>norm(x.test)===n);if(p)return p;
  const alias={bun:"bunureanitrogen",urea:"bunureanitrogen",ureanitrogen:"bunureanitrogen",tbil:"bilirubintotal",totalbilirubin:"bilirubintotal",
    cholesterol:"cholesteroltotal",totalcholesterol:"cholesteroltotal",hdl:"hdlcholesterol",ldl:"ldlcholesteroldirect",ldlcholesterol:"ldlcholesteroldirect",
    alp:"alkalinephosphatase",tp:"totalprotein",calcium:"calciumtotal",ca:"calciumtotal",hgb:"hemoglobin",hb:"hemoglobin",hct:"hematocrit",plt:"platelet",
    platelets:"platelet",wbc:"wbc",rbc:"rbc",na:"sodium",k:"potassium",cl:"chloride",mg:"magnesium",phos:"phosphorus",phosphate:"phosphorus",ua:"uricacid",
    uricacid:"uricacid",tg:"triglycerides",glu:"glucose",crea:"creatinine",hba1c:"hba1c"};
  const a=alias[n];if(a){p=presets.find(x=>norm(x.test)===a);if(p)return p}
  return presets.find(x=>n.length>=3&&(norm(x.test).startsWith(n)||n.startsWith(norm(x.test))))||null;
}
function srcOf(v,SRC){
  const n=norm(v);if(!n)return null;
  if(n.includes("clia")&&SRC.MAX&&n.includes("max"))return SRC.MAX;
  if(n.includes("clia")&&SRC.MIN&&n.includes("min"))return SRC.MIN;
  if(n.includes("clia"))return SRC.CLIA;if(n.includes("ricos")||n.includes("biolog"))return SRC.RICOS;if(n.includes("custom"))return SRC.CUSTOM;
  return null;

/* label | value rows of an Info / Lab_Info sheet */
function applyInfo(res,label,v){
  const raw=String(label??""),l=norm(raw);
  if(!v||!l)return;
  const I=res.info,g=grpOf(l),setG=k=>{if(g){(I[k]=I[k]||{})[g]=v}};
  if(l.includes("hospital")||raw.includes("โรงพยาบาล"))I.hospital=v;
  else if(l==="dataset"||raw.includes("ชื่อชุดข้อมูล"))I.dataset=v;
  else if(l==="period"||l.includes("evaluationperiod")||raw.includes("ช่วงเวลา"))I.period=v;
  else if(l.includes("preparedby")||raw.includes("ผู้จัดทำ"))I.preparedBy=v;
  else if(l.includes("approvedby")||raw.includes("อนุมัติ"))I.approvedBy=v;
  else if(l.includes("biasmethod")){res.opts.biasMethod=/signed|มีเครื่องหมาย/i.test(v)?"signed":"abs"}
  else if(l.includes("cvmethod")){res.opts.cvMethod=/pool/i.test(v)?"pooled":"avg"}
  else if(l.includes("decisionbasis")||l.includes("decision")){res.opts.decide=/avg|average|เฉลี่ย/i.test(v)?"avg":"min"}
  else if(l.includes("qcruleset")){res.opts.rules=/old|เดิม/i.test(v)?"old":"wg"}
  else if(l.startsWith("iqc")&&g){
    const q=((I.iqc=I.iqc||{})[g]=I.iqc[g]||{name:"",lot:["","",""],exp:["","",""]});
    if(l.endsWith("name"))q.name=v;
    else{const mm=/l(\d)(lot|exp)/.exec(l.replace(g==="CBC"?"cbc":"biochemistry",""));if(mm&&+mm[1]>=1&&+mm[1]<=3)q[mm[2]][+mm[1]-1]=v}
  }
  else if(l.includes("eqa")&&g)setG("eqa");
  else if(l.includes("analyzer")&&g)setG("analyzer");
  else if((l.startsWith("sn")||l.includes("serial"))&&g)setG("sn");
  else if(l.startsWith("lab"))I.lab=v;
}

/* the lab's own "Sigma CBC template" (sheets Raw Data + Performance): monthly %CV per level + EQA trials per test */
function importUserTemplate(res,tables,presets,SRC){
  const rawT=tables.find(t=>/^raw\s*data$/i.test((t.name||"").trim()));
  if(!rawT)return false;
  const R=rawT.rows||[],starts=[];
  R.forEach((r,i)=>{if(r&&typeof r[1]==="string"&&/precision\s*iqc/i.test(r[1]))starts.push(i)});
  if(!starts.length)return false;
  const touched=new Set();let used=0;
  starts.forEach((b0,bi)=>{
    const b1=bi+1<starts.length?starts[bi+1]:R.length,title=String(R[b0][1]),name=title.split(":").slice(1).join(":").trim()||title,p=matchPreset(name,presets);
    if(!p){if(!res.skipped.includes(name))res.skipped.push(name);return}
    let eqaProg="";
    for(let i=b0;i<Math.min(b0+3,b1);i++){const c=R[i]&&R[i][6];if(typeof c==="string"&&/eqa/i.test(c))eqaProg=c.split(/[;:]/).pop().trim()}
    let hr=-1;
    for(let i=b0;i<Math.min(b0+6,b1);i++){const r=R[i]||[];if(typeof r[2]==="string"&&/^level/i.test(r[2].trim())){hr=i;break}}
    if(hr<0)return;
    const labels=[2,3,4].map(c=>String(R[hr][c]||"").replace(/^level[\s\-_]*/i,"").trim()||("L"+(c-1))),cvs=[[],[],[]],trials=[];
    for(let i=hr+1;i<b1;i++){
      const r=R[i]||[];if(typeof r[1]==="string"&&/average/i.test(r[1]))break;
      [2,3,4].forEach((c,k)=>{if(typeof r[c]==="number"&&isFinite(r[c]))cvs[k].push(r[c])});
      const lab=r[7],gm=r[8],sdi=r[9];
      if(typeof lab==="number"||typeof gm==="number"){
        let gsd="";if(typeof lab==="number"&&typeof gm==="number"&&typeof sdi==="number"&&sdi!==0)gsd=String(+Math.abs((lab-gm)/sdi).toPrecision(4));
        trials.push({t:cellStr(r[6]),lab:cellStr(lab),gm:cellStr(gm),gsd});
      }
    }
    if(!cvs.some(a=>a.length)&&!trials.length)return;
    const g=p.group;touched.add(g);
    cvs.forEach((a,k)=>{if(a.length){res.rows[g].push({test:p.test,level:labels[k],mean:"",sd:"",cvlist:a.join(", "),bias:"",uref:0,ucal:0,k:2,
      src:(p.clia_pct||p.clia_abs)?SRC.CLIA:SRC.RICOS,custom:"",csrc:""});res.count++}});
    if(trials.length)res.eqa[g+"|"+p.test]=trials;
    if(eqaProg)(res.meta[g+"|"+p.test]=res.meta[g+"|"+p.test]||{}).eqa=eqaProg;
    used++;
  });
  if(!used)return false;
  const g0=[...touched][0]||"CBC";
  // TEa (defined / calculated, bigger one is used in the lab's file) and its reference, from the Performance sheet
  const perf=tables.find(t=>/^performance$/i.test((t.name||"").trim()));
  if(perf){
    const P=perf.rows||[],tea={},ref={};
    P.forEach(r=>{
      if(!r||typeof r[1]!=="string")return;
      const p=matchPreset(r[1].replace(/\s+/g," ").trim(),presets);if(!p)return;
      const j=typeof r[9]==="number"?r[9]:0,kk=typeof r[10]==="number"?r[10]:0;
      if((typeof r[9]==="number"||typeof r[10]==="number")&&Math.max(j,kk)>0)tea[p.test]=Math.max(j,kk);
      if(typeof r[13]==="string"&&r[13].trim())ref[p.test]=r[13].trim();
    });
    Object.keys(res.rows).forEach(g=>res.rows[g].forEach(row=>{
      if(tea[row.test]!=null&&!row.custom){row.src=SRC.CUSTOM;row.custom=String(tea[row.test]);row.csrc="ตามไฟล์ template"+(ref[row.test]?" ("+ref[row.test]+")":"")}
    }));
    // header information
    for(let i=0;i<Math.min(P.length,14);i++){
      const r=P[i]||[],lab=typeof r[3]==="string"?r[3]:"",nextVal=(from)=>{for(let c=from+1;c<r.length;c++){if(r[c]!=null&&String(r[c]).trim()!=="")return cellStr(r[c])}return""};

function importTables(tables,presets,SRC){
  const res={rows:{Biochemistry:[],CBC:[]},info:{},opts:{},eqa:{},meta:{},skipped:[],used:[],count:0,empty:0};
  importUserTemplate(res,tables,presets,SRC);
  for(const t of tables){
    const rows=t.rows||[];
    if(/^raw\s*data$/i.test((t.name||"").trim())&&res.used.some(u=>u.startsWith("Raw Data")))continue;
    // lab info sheets (Info / Lab_Info): label | value
    if(/^(info|lab_?info)$/i.test(t.name||"")){
      rows.forEach(r=>applyInfo(res,r[0],cellStr(r[1])));
      continue;
    }
    // EQA trials sheet: Group | Test | Trial | Lab result | Group mean | Group SD
    let ehi=-1,emap=null;
    for(let i=0;i<Math.min(rows.length,25)&&ehi<0;i++){
      const m={};(rows[i]||[]).forEach((h,j)=>{const r=eqaRole(h);if(r&&!(r in m))m[r]=j});
      if("test" in m&&"lab" in m&&"gm" in m){ehi=i;emap=m}
    }
    if(ehi>=0){
      let n=0;
      for(let i=ehi+1;i<rows.length;i++){
        const r=rows[i]||[],g=k=>k in emap?r[emap[k]]:undefined,name=cellStr(g("test"));
        if(!name)continue;
        const p=matchPreset(name,presets);if(!p){if(cellStr(g("lab"))!==""&&!res.skipped.includes(name))res.skipped.push(name);continue}
        if(cellStr(g("lab"))===""&&cellStr(g("gm"))==="")continue;
        let grp=cellStr(g("group"));grp=["Biochemistry","CBC"].find(x=>norm(x)===norm(grp))||p.group;
        (res.eqa[grp+"|"+p.test]=res.eqa[grp+"|"+p.test]||[]).push({t:cellStr(g("trial")),lab:cellStr(g("lab")),gm:cellStr(g("gm")),gsd:cellStr(g("gsd"))});n++;
      }
      if(n)res.used.push(`${t.name} (EQA): ${n} รอบ`);
      continue;
    }
    let hi=-1,map=null;
    for(let i=0;i<Math.min(rows.length,25)&&hi<0;i++){
      const m={},bi=[];
      (rows[i]||[]).forEach((h,j)=>{const r=roleOf(h);if(!r)return;if(r==="bias#")bi.push(j);else if(!(r in m))m[r]=j});
      if("test" in m&&("mean" in m||"cvlist" in m)&&("sd" in m||"cvlist" in m)){hi=i;map=m;map.bi=bi}
    }
    if(hi<0)continue;
    let n=0;
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i]||[],g=k=>k in map?r[map[k]]:undefined,name=cellStr(g("test"));
      if(!name)continue;
      const p=matchPreset(name,presets);
      if(!p){if((cellStr(g("mean"))!==""||cellStr(g("cvlist"))!=="")&&!res.skipped.includes(name))res.skipped.push(name);continue}
      if(cellStr(g("mean"))===""&&cellStr(g("sd"))===""&&cellStr(g("cvlist"))===""){res.empty++;continue}
      let grp=cellStr(g("group"));grp=["Biochemistry","CBC"].find(x=>norm(x)===norm(grp))||p.group;
      let bias=cellStr(g("biaslist"));
      if(!bias&&map.bi.length)bias=map.bi.map(j=>cellStr(r[j])).filter(x=>x!==""&&isFinite(parseFloat(x))).join(", ");
      const row={test:p.test,level:cellStr(g("level"))||"L1",mean:cellStr(g("mean")),sd:cellStr(g("sd")),cvlist:cellStr(g("cvlist")),bias,
        uref:cellStr(g("uref"))||0,ucal:cellStr(g("ucal"))||0,k:cellStr(g("k"))||2,
        src:srcOf(g("src"),SRC)||((p.clia_pct||p.clia_abs)?SRC.CLIA:SRC.RICOS),custom:cellStr(g("custom")),csrc:cellStr(g("csrc"))};
      res.rows[grp].push(row);n++;res.count++;
      const mk=grp+"|"+p.test,mt=res.meta[mk]=res.meta[mk]||{};
      if(cellStr(g("method"))&&!mt.method)mt.method=cellStr(g("method"));
      if(cellStr(g("eqatest"))&&!mt.eqa)mt.eqa=cellStr(g("eqatest"));
      if(n===1){
        ["hospital","lab","dataset","period"].forEach(k=>{if(cellStr(g(k)))res.info[k]=cellStr(g(k))});
        if(cellStr(g("eqa"))){(res.info.eqa=res.info.eqa||{})[grp]=cellStr(g("eqa"))}
        if(cellStr(g("analyzer"))){(res.info.analyzer=res.info.analyzer||{})[grp]=cellStr(g("analyzer"))}
        if(cellStr(g("sn"))){(res.info.sn=res.info.sn||{})[grp]=cellStr(g("sn"))}
      }
    }
    if(n)res.used.push(`${t.name}: ${n}`);
  }
  Object.keys(res.meta).forEach(k=>{if(!res.meta[k].method&&!res.meta[k].eqa)delete res.meta[k]});
  return res;
}

const biasTxt=()=>state.opts.biasMethod==="signed"?"|ค่าเฉลี่ยแบบมีเครื่องหมาย|":"ค่าเฉลี่ยของ |bias|";
const decName=()=>state.opts.decide==="avg"?"Average":"Min";
function calc(r){
  const p=byName(r.test);if(!p)return null;
  let mean=num(r.mean);const sd=num(r.sd),cvs=parseList(r.cvlist).filter(x=>x>=0);
  if(!(mean>0)){if(cvs.length)mean=null;else return null}
  let cv,cvSrc;
  if(cvs.length){
    cv=state.opts.cvMethod==="pooled"?Math.sqrt(cvs.reduce((a,b)=>a+b*b,0)/cvs.length):cvs.reduce((a,b)=>a+b,0)/cvs.length;
    cvSrc="%CV รายเดือน "+cvs.length+" ค่า ("+(state.opts.cvMethod==="pooled"?"pooled":"เฉลี่ย")+")";
  }else if(mean>0&&sd>=0){cv=sd/mean*100;cvSrc="SD / Mean"}
  else return null;
  let bs=eqaBiasList(p.group,p.test),biasSrc="Key-in EQA "+bs.length+" รอบ";
  if(!bs.length){bs=parseList(r.bias);biasSrc=bs.length?"กรอกเอง "+bs.length+" ค่า":"ไม่มีข้อมูล bias"}
  const meanSigned=bs.length?bs.reduce((a,b)=>a+b,0)/bs.length:0,meanAbs=bs.length?bs.reduce((a,b)=>a+Math.abs(b),0)/bs.length:0;
  const meanBias=state.opts.biasMethod==="signed"?meanSigned:meanAbs;
  const rms=bs.length?Math.sqrt(bs.reduce((a,b)=>a+b*b,0)/bs.length):0;
  const uref=num(r.uref)||0,ucal=num(r.ucal)||0,k=num(r.k)||2;
  const ubias=Math.hypot(rms,uref);
  const uc=Math.sqrt(cv*cv+ubias*ubias+ucal*ucal);
  const U=k*uc,Uabs=mean?U/100*mean:null;
  const teaOf=src=>{let pct=0,abs=0;
    if(src===SRC.CUSTOM)pct=num(r.custom)||0;
    else if(src===SRC.CLIA){pct=p.clia_pct||0;abs=p.clia_abs||0}
    else pct=p.ric.TE;
    return{pct,abs,eff:Math.max(pct,mean&&abs?abs/mean*100:0)}};
  let T;
  if(r.src===SRC.MAX||r.src===SRC.MIN){
    const cands=[(p.clia_pct||p.clia_abs)?teaOf(SRC.CLIA):null,teaOf(SRC.RICOS)].filter(x=>x&&x.eff>0);
    T=cands.length?cands.reduce((x,y)=>(r.src===SRC.MAX?y.eff>x.eff:y.eff<x.eff)?y:x):{pct:0,abs:0,eff:0};
  }else T=teaOf(r.src);
  const tea=T.eff;
  const sigma=cv>0&&tea>0?(tea-Math.abs(meanBias))/cv:null;

  return{cv,cvSrc,sd:mean?cv*mean/100:null,meanBias,meanSigned,meanAbs,biasSrc,rms,uref,ubias,ucal,uc,k,U,Uabs,tea,teaPct:T.pct,teaAbs:T.abs,sigma,qgi,nb:bs.length,unit:p.unit,mean};
}
/* decisive level of a test: Min (worst level) or Average (average CV / TEa / bias over the levels) */
function decisive(a){
  const mn=a.reduce((x,y)=>y.c.sigma<x.c.sigma?y:x);
  if(state.opts.decide!=="avg"||a.length<2)return mn;
  const m=kk=>mean_(a.map(v=>v.c[kk])),cv=m("cv"),tea=m("tea"),b=mean_(a.map(v=>Math.abs(v.c.meanBias)));
  if(!(cv>0&&tea>0))return mn;
  const sigma=(tea-b)/cv;
  return{r:{test:mn.r.test,level:"Average"},c:Object.assign({},mn.c,{cv,tea,meanBias:b,sigma,qgi:b/(1.5*cv),U:m("U"),Uabs:null,mean:null}),avg:true};
}
/* Westgard Sigma Rules (J.O. & S.A. Westgard, 2014): rule set by Sigma band and number of control levels per run */
const WG2={6:["1:3s","N=2, R=1","กฎเดียว ง่ายที่สุด"],5:["1:3s/2:2s/R:4s","N=2, R=1","multirule 3 กฎ"],
  4:["1:3s/2:2s/R:4s/4:1s","N=4, R=1 (หรือ N=2, R=2)","เพิ่ม 4:1s"],0:["1:3s/2:2s/R:4s/4:1s/8:x","N=4, R=2 (หรือ N=2, R=4)","QC สูงสุด เพิ่ม 8:x"]};
const WG3={6:["1:3s","N=3, R=1","กฎเดียว วัด 1 ค่าต่อแต่ละ level"],5:["1:3s/2of3:2s/R:4s","N=3, R=1","เพิ่ม 2of3:2s และ R:4s"],
  4:["1:3s/2of3:2s/R:4s/3:1s","N=3, R=1","เพิ่ม 3:1s"],0:["1:3s/2of3:2s/R:4s/3:1s/6:x","N=6, R=1 (หรือ N=3, R=2)","QC สูงสุด เพิ่ม 6:x ทำ N รวม 6"]};
const qcBand=s=>s>=6?6:s>=5?5:s>=4?4:0;
function levelCount(test){const p=byName(test);if(!p)return 2;const n=state.rows[p.group].filter(r=>r.test===test).length;return n>=3?3:2}
function oldRule(s){
  if(s>=6)return"1:3s, N=2, R=1";if(s>=5)return"1:3s/2:2s/R:4s, N=2, R=1";
  if(s>=4)return"1:2.5s/2:2s/R:4s/4:1s/10x, N=4, R=2";if(s>=3)return"1:2s/2:2s/R:4s/4:1s/8x/10x, N=6, R=2";
  return"ไม่ผ่าน: ต้องปรับปรุงวิธี";
}
function qcRule(s,test){

  const set=(test?levelCount(test):2)>=3?WG3:WG2,r=set[qcBand(s)];
  return`${r[0]}, ${r[1]}`+(s<3?" · ⚠ σ<3 ควรปรับปรุงวิธี (QC อย่างเดียวชดเชยไม่ได้)":"");

function cls(s,test){

  if(s>=4)return["Good","s4",rule];

}
const needHtml=q=>`<span class="need ${q.needCls}">${q.need}</span>`;

}
let opLabels=false;

  if(kind==="unc"){set("rms",c?f2(c.rms):"");set("uc",c?f2(c.uc):"");set("U",c?f2(c.U):"");set("res",c?fmtU(c.mean,c.Uabs,c.unit):"")}

/* ---------- Key-in EQA (trial-by-trial, per test) ---------- */
const eqaOpen=new Set();
function eqaStats(g,tst){
  const bs=eqaBiasList(g,tst);
  return{n:bs.length,meanAbs:bs.length?mean_(bs.map(Math.abs)):null,meanSigned:bs.length?mean_(bs):null,rms:bs.length?Math.sqrt(mean_(bs.map(b=>b*b))):null};
}
const eqaSummary=(g,tst)=>{const s=eqaStats(g,tst);return s.n?`${s.n} รอบ · เฉลี่ย |bias| ${f2(s.meanAbs)}% · เฉลี่ยมีเครื่องหมาย ${f2(s.meanSigned)}% · RMS ${f2(s.rms)}%`:"ยังไม่มีข้อมูล"};
function pageEqa(){
  const g=state.group,tests=[...new Set(state.rows[g].map(r=>r.test))];
  const panels=tests.map(tst=>{
    const k=eqaKey(g,tst),tr=state.eqa[k]||[],m=state.meta[k]||{};
    return`<details class="eqa-test" data-k="${esc(k)}" ${eqaOpen.has(k)?"open":""}><summary><b>${esc(tst)}</b> <span class="note" data-sum>${eqaSummary(g,tst)}</span></summary>
      <div class="eqa-meta"><label>Methodology (ถ้ามี)<input data-m="method" value="${esc(m.method||"")}" placeholder="เช่น Impedance / Flow cytometry"></label>
        <label>โปรแกรม EQA ของเทสนี้ (ถ้าต่างจากของกลุ่ม)<input data-m="eqa" value="${esc(m.eqa||"")}" placeholder="เว้นว่าง = ใช้ชื่อ EQA ของกลุ่ม"></label></div>
      <div class="wrap"><table><tr><th>รอบ / Sample</th><th>Lab result</th><th>Group mean</th><th>Group SD (ถ้ามี)</th><th>% Bias</th><th>SDI</th><th></th></tr>
      ${tr.map((x,i)=>`<tr data-i="${i}"><td><input class="wl" style="width:90px" data-e="t" value="${esc(x.t)}"></td>
        <td><input data-e="lab" inputmode="decimal" value="${esc(x.lab)}"></td><td><input data-e="gm" inputmode="decimal" value="${esc(x.gm)}"></td><td><input data-e="gsd" inputmode="decimal" value="${esc(x.gsd||"")}"></td>
        <td class="out" data-o="b"></td><td class="out" data-o="s"></td><td><button class="del" data-del title="ลบรอบนี้">✕</button></td></tr>`).join("")}</table></div>
      <div class="bar" style="margin-top:8px"><button class="btn sm" data-add="1">+ 1 รอบ</button><button class="btn sm" data-add="6">+ 6 รอบ</button><button class="btn sm" data-clr>ล้างรอบของเทสนี้</button></div></details>`}).join("");
  $("view").innerHTML=`<p class="note"><b>Key-in EQA</b> — กรอกผลเข้าร่วม EQA/PT <u>รายเทสรายรอบ</u>: Lab result, Group mean (และ Group SD ถ้ามี) ระบบคำนวณ <b>%Bias = (Lab − Group mean) / Group mean × 100</b> และ <b>SDI = (Lab − Group mean) / Group SD</b> ให้อัตโนมัติ · เมื่อเทสมีข้อมูลที่นี่ หน้า Key-in จะใช้ bias จากตารางนี้แทนช่อง bias ที่กรอกเอง (ใช้กับทุก level ของเทสนั้น) · Bias ที่ใช้คิด Sigma เลือกวิธีได้ด้านล่าง</p>
    ${infoForm(g)}${settingsBar(["bias"])}
    <div class="bar"><button class="btn sm" id="eqaOpenAll">เปิดทุกเทส</button><button class="btn sm" id="eqaCloseAll">ปิดทุกเทส</button><span class="note">${g}: ${tests.length} เทส</span></div>
    ${panels||'<p class="note">ยังไม่มีเทส — เพิ่มข้อมูลในหน้า Key-in ก่อน</p>'}`;
  bindInfoForm(g);bindSettings();
  $("eqaOpenAll").onclick=()=>{tests.forEach(x=>eqaOpen.add(eqaKey(g,x)));pageEqa()};
  $("eqaCloseAll").onclick=()=>{eqaOpen.clear();pageEqa()};
  document.querySelectorAll(".eqa-test").forEach(det=>{
    const k=det.dataset.k,tst=k.slice(g.length+1);
    det.addEventListener("toggle",()=>{det.open?eqaOpen.add(k):eqaOpen.delete(k)});
    det.querySelectorAll("[data-m]").forEach(el=>el.addEventListener("input",()=>{const mm=state.meta[k]=state.meta[k]||{};mm[el.dataset.m]=el.value;save()}));
    const refresh=()=>{
      (state.eqa[k]||[]).forEach((x,i)=>{
        const tr=det.querySelector(`tr[data-i="${i}"]`);if(!tr)return;
        const b=trialBias(x),sd=parseFloat(x.gsd),lab=parseFloat(x.lab),gm=parseFloat(x.gm);
        tr.querySelector('[data-o="b"]').textContent=b==null?"":f2(b);
        tr.querySelector('[data-o="s"]').textContent=isFinite(lab)&&isFinite(gm)&&sd>0?f2((lab-gm)/sd):"";
      });
      det.querySelector("[data-sum]").textContent=eqaSummary(g,tst);
    };
    det.querySelectorAll("tr[data-i]").forEach(tr=>{
      const i=+tr.dataset.i;
      tr.querySelectorAll("[data-e]").forEach(el=>el.addEventListener("input",()=>{state.eqa[k][i][el.dataset.e]=el.value;save();refresh()}));
      tr.querySelector("[data-del]").onclick=()=>{state.eqa[k].splice(i,1);eqaOpen.add(k);save();pageEqa()};
    });
    det.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
      const arr=state.eqa[k]=state.eqa[k]||[],n=+b.dataset.add;
      for(let j=0;j<n;j++)arr.push({t:"",lab:"",gm:"",gsd:""});eqaOpen.add(k);save();pageEqa()});
    det.querySelector("[data-clr]").onclick=()=>{delete state.eqa[k];eqaOpen.add(k);save();pageEqa()};
    refresh();
  });
}

/* ---------- 2) Uncertainty ---------- */
function pageUncertainty(){
  const g=state.group,vs=view(g),ok=vs.filter(v=>v.c);
  const maxv=ok.reduce((a,v)=>!a||v.c.U>a.c.U?v:a,null),minv=ok.reduce((a,v)=>!a||v.c.U<a.c.U?v:a,null);
  const lab=v=>v.r.test+(v.r.level?" "+v.r.level:"");
  const sumRows=byTest(ok).map(([t,a],ti)=>{const Us=a.map(v=>v.c.U),worst=a.reduce((x,v)=>v.c.U>x.c.U?v:x);
    return`<tr class="g${ti%3}"><td>${esc(t)}</td><td>${a.length}</td><td>${f2(Math.min(...Us))} – ${f2(Math.max(...Us))}</td>
    <td class="l">${a.map(v=>`${esc(v.r.level)}: ${fmtU(v.c.mean,v.c.Uabs,v.c.unit)}`).join(" · ")}</td><td class="l">${esc(worst.r.level)} (U=${f2(worst.c.U)}%)</td></tr>`}).join("");

  cards([["จำนวน level ที่คำนวณได้",ok.length],["U% เฉลี่ย",ok.length?f2(mean_(ok.map(v=>v.c.U)))+" %":"-"],

/* ---------- 3) Sigma & OPSpecs ---------- */

  const skipped=vs.filter(v=>v.c&&v.c.sigma==null).length;
  const sumRows=byTest(ok).map(([t,a],ti)=>{const w=decisive(a);
    return`<tr class="g${ti%3}"><td>${esc(t)}</td><td>${a.length}</td><td class="l">${a.map(v=>`${esc(v.r.level)}: ${f2(v.c.sigma)}`).join(" · ")}</td>
    <td><b>${f2(w.c.sigma)}</b> (${esc(w.r.level)})</td><td>${chip(w.c.sigma)}</td><td class="l">${cls(w.c.sigma,w.r.test)[2]}</td></tr>`}).join("");
  const body=ok.map(v=>{const c=v.c;return`<tr ${trc(v)}><td>${esc(v.r.test)}</td><td>${esc(v.r.level)}</td><td>${fm(c.mean)}</td><td>${f2(c.cv)}</td>
    <td>${f2(c.meanBias)}</td><td>${esc(v.r.src)}${v.r.src===SRC.CUSTOM&&v.r.csrc?` <small>(${esc(v.r.csrc)})</small>`:""}</td><td>${f2(c.tea)}</td>
    <td><b>${f2(c.sigma)}</b></td><td>${chip(c.sigma)}</td><td class="l">${cls(c.sigma,v.r.test)[2]}</td></tr>`}).join("");
  const pts=ok.filter(v=>v.c.tea>0).map(v=>({label:lab(v),x:v.c.cv/v.c.tea*100,y:Math.abs(v.c.meanBias)/v.c.tea*100,sg:v.c.sigma,cc:cls(v.c.sigma)[1],name:cls(v.c.sigma)[0]}));

  cards([["Level ที่คำนวณได้",ok.length],["Sigma เฉลี่ย",ok.length?f2(mean_(ok.map(v=>v.c.sigma))):"-"],["σ ≥ 4",`${ok.filter(v=>v.c.sigma>=4).length} / ${ok.length}`],...counts.map(([n,k])=>[n,k])])+
  `<section><h2>สรุปผล Sigma รายเทส (ตัดสินจาก ${decName()}) — ${g}</h2>${table(["Test","จำนวน level","Sigma แต่ละ level","Sigma ("+decName()+")","Class","Suggested QC rule"],sumRows)}</section>
   <section><h2>รายละเอียด Sigma (ทุก level)</h2>${table(["Test","Level","Mean","CV %","Bias % (ที่ใช้)","TEa source","TEa eff %","Sigma","Class","Suggested QC rule"],body)}</section>
   <section><h2>Sigma ของแต่ละ level</h2>${chartBox("c_sig","sigma_"+g,barChart(ok.map(v=>({label:lab(v),value:v.c.sigma,color:`var(${sc[cls(v.c.sigma)[1]]})`})),{max:8,lines:[3,4,5,6],lineLabel:v=>"σ"+v,aria:"Sigma chart"}))}</section>
   <section><h2>Normalized OPSpecs chart — ${g}</h2><div class="bar"><label><input type="checkbox" id="opl" ${opLabels?"checked":""}> แสดงชื่อบนจุดด้วย</label>
   <span class="note">x = CV/TEa×100 · y = |Bias|/TEa×100 · เส้น σ: y = 100 − σ·x · จุดใต้เส้น σ สูงกว่า = คุณภาพดีกว่า · รายชื่อเทสจัดกลุ่มตามสีอยู่ทางขวา</span></div>${chartBox("c_ops","opspecs_"+g,opSvg(pts,g,true,opLabels))}</section>`;

/* ---------- 4) QGI ---------- */
function pageQGI(){
  const g=state.group,vs=view(g),ok=vs.filter(v=>v.c&&v.c.qgi!=null),lab=v=>v.r.test+(v.r.level?" "+v.r.level:"");
  const need=ok.filter(v=>v.c.sigma<6),n=c=>need.filter(v=>qgiInfo(v.c.qgi,v.c.sigma).cls===c).length;
  const body=ok.map(v=>{const c=v.c,q=qgiInfo(c.qgi,c.sigma);return`<tr ${trc(v)}><td>${esc(v.r.test)}</td><td>${esc(v.r.level)}</td><td>${f2(c.cv)}</td><td>${f2(Math.abs(c.meanBias))}</td>
    <td>${f2(c.sigma)} ${chip(c.sigma)}</td><td><b>${f2(c.qgi,3)}</b></td><td><span class="cls ${q.cls}">${q.name}</span></td><td class="l">${needHtml(q)}</td><td class="l">${q.act}</td></tr>`}).join("");
  const sumRows=byTest(ok).map(([t,a],ti)=>{const w=decisive(a),q=qgiInfo(w.c.qgi,w.c.sigma);
    return`<tr class="g${ti%3}"><td>${esc(t)}</td><td class="l">${a.map(v=>`${esc(v.r.level)}: ${f2(v.c.qgi,2)}`).join(" · ")}</td><td>${esc(w.r.level)} (σ=${f2(w.c.sigma)})</td><td><span class="cls ${q.cls}">${q.name}</span></td><td class="l">${needHtml(q)}</td></tr>`}).join("");
  const qc={q1:"--q1",q2:"--q2",q3:"--q3"};
  $("view").innerHTML=settingsBar(["bias","dec"])+`<p class="note">QGI (Quality Goal Index) = |Bias%| / (1.5 × CV%) · &lt;0.8 → ปัญหา imprecision · 0.8–1.2 → ทั้งสองอย่าง · &gt;1.2 → ปัญหา inaccuracy (bias) · ใช้วินิจฉัยสาเหตุเมื่อ Sigma ไม่ถึงเป้า (ตัดสินจาก ${decName()})</p>`+
  cards([["Level ที่คำนวณได้",ok.length],["Imprecision (σ<6)",n("q1")],["Imprecision + Inaccuracy (σ<6)",n("q2")],["Inaccuracy (σ<6)",n("q3")]])+
  `<section><h2>สรุป QGI รายเทส — ${g}</h2>${table(["Test","QGI แต่ละ level","Level ที่ Sigma ("+decName()+")","สาเหตุหลัก (ตาม level นั้น)","ต้องแก้ไขหรือไม่"],sumRows)}</section>
   <section><h2>รายละเอียด QGI (ทุก level)</h2>${table(["Test","Level","CV %","|Bias| %","Sigma","QGI","แปลผล","ความจำเป็น","แนวทางแก้ไข"],body)}</section>
   <section><h2>QGI ของแต่ละ level</h2>${chartBox("c_qgi","qgi_"+g,barChart(ok.map(v=>({label:lab(v),value:v.c.qgi,color:`var(${qc[qgiInfo(v.c.qgi,v.c.sigma).cls]})`})),{max:Math.max(2,...ok.map(v=>v.c.qgi))*1.05,lines:[0.8,1.2],aria:"QGI chart"}))}</section>`;
  bindSettings();
}

function qcTreeSvg(hl){ // hl = {nl:2|3, band:6|5|4|0}

  const box=(x,y,w,h,title,lines,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${o.fill||"var(--card)"}" fill-opacity="${o.fo??1}" stroke="${o.stroke||"var(--line)"}" stroke-width="${o.sw||1.5}"/>`+
    `<text x="${x+w/2}" y="${y+(lines.length?20:h/2+5)}" text-anchor="middle" font-size="${o.fs||13}" font-weight="700" fill="var(--ink)">${esc2(title)}</text>`+

    <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--mut)"/></marker>
    <marker id="ahon" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="var(--pri)"/></marker></defs>`;
  s+=box(300,8,440,46,"คำนวณ Sigma = (TEa − |Bias|) / CV",["ใช้ Sigma ของ level ที่ตัดสิน (Min หรือ Average)"],{fill:"var(--pri)",fo:.12,stroke:"var(--pri)",sw:2});
  s+=arrow(520,54,520,78);
  s+=box(360,78,320,44,"QC ต่อ run ใช้กี่ level?",[],{fill:"var(--pri)",fo:.08,stroke:"var(--pri)",sw:2});
  const cols=[{nl:2,cx:150,leafX:272,leafW:238,head:"2 level (N = 2, 4, 8)",set:WG2},{nl:3,cx:660,leafX:782,leafW:250,head:"3 level (N = 3, 6) เช่น CBC / Hematology",set:WG3}];

    s+=box(c.cx-125,156,250,38,c.head,[],{fill:"var(--pri)",fo:act?.18:.06,stroke:"var(--pri)",sw:act?3:1.5,fs:12.5});
    s+=arrow(c.cx,194,c.cx,y0-36,"",0,0,act);

        `<text x="${c.cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">σ ≥ ${b} ?</text>`;

  });
  s+=box(40,640,960,42,"σ < 3 : Westgard ไม่มีชุดกฎแนะนำ — “ถ้าวิธีมี performance ไม่ดี ไม่มี QC ใดชดเชยได้” → ปรับปรุงวิธี (ดู QGI) และใช้ QC สูงสุดระหว่างรอปรับปรุง",[],{fill:"var(--s0)",fo:.14,stroke:"var(--s0)",sw:1.8,fs:12.5});

    <div class="doc" style="margin-top:14px"><h2>อธิบายสัญลักษณ์ของกฎ</h2><ul>
      <li><b>1:3s</b> — control 1 ค่าเกิน ±3SD → reject</li>
      <li><b>2:2s</b> — control 2 ค่าติดกันเกิน 2SD ด้านเดียวกัน (ข้าม level หรือข้าม run) → reject</li>
      <li><b>R:4s</b> — ใน run เดียวกัน control ตัวหนึ่งเกิน +2SD และอีกตัวต่ำกว่า −2SD (ช่วงห่าง &gt; 4SD) → reject (ชี้ imprecision)</li>
      <li><b>4:1s</b> — control 4 ค่าติดกันเกิน 1SD ด้านเดียวกัน → reject (ชี้ bias)</li>
      <li><b>8:x / 6:x / 9:x / 12:x</b> — control ติดกัน 8 (6, 9, 12) ค่าอยู่ด้านเดียวกันของค่าเฉลี่ย → reject (ชี้ bias)</li>
      <li><b>2of3:2s</b> — ใน 3 control ของ run เดียวกัน 2 ค่าเกิน 2SD ด้านเดียวกัน · <b>3:1s</b> — control 3 ค่าติดกันเกิน 1SD ด้านเดียวกัน (ใช้กับ 3 level)</li>
      <li><b>N</b> = จำนวนค่า control ต่อ run (ที่ประเมินพร้อมกัน) · <b>R</b> = จำนวน run ที่ประเมินรวมกัน (ใช้กับกฎข้าม run เช่น 4:1s, 8:x)</li></ul></div>
    <div class="doc warn-box" style="margin-top:14px"><h2>⚠️ ข้อควรระวัง / ข้อจำกัด</h2><ul>
      <li><b>การแบ่งช่วง Sigma เป็น 6 / 5 / 4 / &lt;4:</b> Westgard แสดงเป็นระดับ Sigma ที่เป็นจำนวนเต็ม — webapp ใช้ชุดกฎของระดับเต็มที่ “เท่ากับหรือต่ำกว่า” (เช่น σ 5.3 ใช้ชุดของ 5, σ 4.6 ใช้ชุดของ 4) เป็นแนวทางอนุรักษ์ ซึ่งเป็นการตีความของ webapp ไม่ใช่ข้อกำหนดของ Westgard</li>
      <li>ต้นฉบับพิมพ์ตัวเลือกของ σ &lt; 4 (2 level) ว่า “N=2, N=4” — webapp ตีความว่าเป็น N=2, <b>R=4</b></li>
      <li>σ &lt; 3 Westgard ไม่มีชุดกฎแนะนำ — ควรปรับปรุงวิธี (ดู QGI ว่าสาเหตุมาจาก imprecision หรือ bias)</li>
      <li>การเลือก QC จริงควรพิจารณาร่วมกับความเสี่ยงทางคลินิก ความถี่ของ run และข้อกำหนดของห้องปฏิบัติการ (ISO 15189 / CLSI C24) และยืนยันด้วย QC design หรือ power function เมื่อจำเป็น — แผนผังนี้เป็นแนวทางเบื้องต้น</li>
      <li>ชุดกฎ “ตารางเดิมของ webapp” (ตัวเลือกในแถบ ⚙) ต่างจาก Westgard ที่ช่วง σ 4–5 และ 3–4 และไม่แยกกรณี 3 level — ค่าเริ่มต้นใหม่คือ Westgard Sigma Rules</li></ul></div>
    ${refBox(["rules","best","role","grid"])}`;
  const sel=$("qcTest");if(sel)sel.onchange=()=>{qcSel=sel.value;pageQcTree()};
  bindSettings();
}

function pageRef(){
  const r=PRESETS.map(p=>`<tr><td>${p.group}</td><td class="l">${esc(p.test)}</td><td>${esc(p.unit)}</td><td class="l">${esc(p.clia_text)}</td>
  <td>${p.ric.CVI}</td><td>${p.ric.CVg}</td><td>${p.ric.I}</td><td>${p.ric.B}</td><td><b>${p.ric.TE}</b></td></tr>`).join("");
  $("view").innerHTML=`<div class="doc" style="margin-bottom:12px"><b>แหล่งอ้างอิง TEa (Westgard QC)</b><ul>
  <li><a href="https://www.westgard.com/clia-and-quality-regulation-requirements/quality-requirements/2024-clia-requirements.html" target="_blank" rel="noopener">CLIA 2025 Acceptance Limits for Proficiency Testing</a> — final rule มีผล 1 ม.ค. 2025 (TV = target value)<br><span class="url">https://www.westgard.com/clia-and-quality-regulation-requirements/quality-requirements/2024-clia-requirements.html</span></li>
  <li><a href="https://www.westgard.com/clia-and-quality-regulation-requirements/quality-requirements/biodatabase1.html" target="_blank" rel="noopener">Desirable Biological Variation Database specifications</a><br><span class="url">https://www.westgard.com/clia-and-quality-regulation-requirements/quality-requirements/biodatabase1.html</span><br>(Ricos 2014) — <code>I = 0.5·CVI</code>, <code>B = 0.25·√(CVI²+CVg²)</code>, <code>TE = 1.65·I + B</code></li></ul>
  <p class="note">ตรวจสอบค่ากับเอกสารต้นฉบับ/ผู้จัด PT ของห้องปฏิบัติการก่อนใช้งานจริง · Westgard ระบุว่าฐานข้อมูล Ricos ไม่ได้ปรับปรุงแล้ว (ฐานข้อมูลใหม่อยู่ที่ EFLM) · MCV/MCH/MCHC ไม่มีเกณฑ์ใน CLIA</p></div>`+
  table(["Group","Test","Unit","CLIA 2025 criterion (TV ±)","CVI %","CVg %","I %","B %","Ricos TE %"],r);
}
function pageMethod(){
  $("view").innerHTML=`<div class="doc"><h2>วิธีคำนวณ (top-down)</h2><ol>
  <li><b>u<sub>Rw</sub> (%)</b> = CV% = SD / Mean × 100 จาก IQC สะสมระยะยาว (ควรครอบคลุมการเปลี่ยน lot reagent/calibrator, ผู้ปฏิบัติงาน)</li>
  <li><b>Bias%</b> จาก EQA/PT แต่ละรอบ = (ค่าที่แล็บวัด − ค่าเป้าหมาย)/ค่าเป้าหมาย × 100 ; Mean bias (signed) ใช้ใน Sigma/QGI ; RMS bias = √(Σbias²/n) ใช้ใน MU</li>
  <li><b>u<sub>bias</sub></b> = √(RMS bias² + u<sub>ref</sub>²) — u<sub>ref</sub> คือความไม่แน่นอนของค่าเป้าหมาย EQA (ใส่ 0 หากไม่ทราบ)</li>
  <li><b>u<sub>c</sub></b> = √(u<sub>Rw</sub>² + u<sub>bias</sub>² + u<sub>cal</sub>²) ; ใส่ u<sub>cal</sub> เมื่อยังไม่ได้รวมความไม่แน่นอนของ calibrator ไว้ใน CV</li>
  <li><b>U</b> = k × u<sub>c</sub> (k = 2 ≈ 95%) ; U(abs) = U% × Mean / 100 ; รายงาน “Mean ± U”</li>
  <li><b>TEa eff%</b> = max(TEa%, TEa<sub>abs</sub>/Mean×100) รองรับเกณฑ์ “…หรือ … (greater)” และ Na/K/Ca ที่เป็นหน่วยสัมบูรณ์ (ผลขึ้นกับระดับ Mean ของ level นั้น)</li>
  <li><b>Sigma</b> = (TEa eff% − |Mean bias%|) / CV%</li>
  <li><b>OPSpecs (normalized)</b>: x = CV/TEa×100, y = |Bias|/TEa×100 ; เส้น σ: y = 100 − σ·x</li>
  <li><b>QGI</b> = |Mean bias%| / (1.5 × CV%) — ดูคำอธิบายละเอียดด้านล่าง</li></ol>
  <h2>การแปลผล Sigma</h2><p>σ ≥ 6 World class · 5–6 Excellent · 4–5 Good · 3–4 Marginal · &lt; 3 Unacceptable</p></div>

  <div class="doc" style="margin-top:14px"><h2>คำอธิบาย TEa eff (Effective Total Allowable Error)</h2>
  <p><b>TEa eff คืออะไร</b> — ค่า TEa (เป็น %) ที่ <u>ใช้จริง</u> ในการคำนวณของแต่ละ level ย่อมาจาก <i>Effective Total Allowable Error</i></p>
  <p><b>ทำไมต้องมี</b> — เกณฑ์ TEa บางตัวระบุเป็น “% หรือค่าสัมบูรณ์ แล้วแต่ว่าอันไหนมากกว่า” เช่น Glucose ±6 mg/dL หรือ ±8% ดังนั้น TEa เป็น % จึงเปลี่ยนไปตามความเข้มข้นของ level ส่วน Na, K, Ca ที่ CLIA ให้เป็นหน่วยสัมบูรณ์อย่างเดียว (เช่น Na ±4 mmol/L) ก็ต้องแปลงเป็น % ก่อนใช้</p>
  <p><b>สูตร</b> &nbsp; <code>TEa eff % = max( TEa %, TEa abs / Mean × 100 )</code></p>
  <table style="width:100%;margin:8px 0"><tr><th class="l">ตัวอย่าง</th><th class="l">เกณฑ์</th><th class="l">การคำนวณ</th><th class="l">TEa eff</th></tr>
  <tr><td class="l">Glucose, Mean = 100 mg/dL</td><td class="l">±6 mg/dL หรือ ±8%</td><td class="l">6/100×100 = 6% เทียบกับ 8%</td><td class="l"><b>8%</b> (ใช้ %)</td></tr>
  <tr><td class="l">Glucose, Mean = 50 mg/dL</td><td class="l">±6 mg/dL หรือ ±8%</td><td class="l">6/50×100 = 12% เทียบกับ 8%</td><td class="l"><b>12%</b> (ใช้ค่าสัมบูรณ์)</td></tr>
  <tr><td class="l">Sodium, Mean = 140 mmol/L</td><td class="l">±4 mmol/L</td><td class="l">4/140×100</td><td class="l"><b>2.86%</b></td></tr>
  <tr><td class="l">WBC (CLIA ±10%)</td><td class="l">±10%</td><td class="l">ไม่มีค่าสัมบูรณ์</td><td class="l"><b>10%</b></td></tr></table>
  <p><b>นำไปใช้ที่ไหน</b> — ในสูตร Sigma = (TEa eff − |Bias|)/CV และเป็นตัวหารของกราฟ OPSpecs (x = CV/TEa eff, y = |Bias|/TEa eff) · เกณฑ์ Ricos และ Custom เป็น % ล้วน จึงได้ TEa eff = TEa ที่ตั้งไว้</p>
  <p class="note">เพราะ TEa eff ขึ้นกับ Mean ของแต่ละ level แต่ละ level ของเทสเดียวกันจึงอาจได้ TEa eff และ Sigma ต่างกัน</p></div>

  <div class="doc" style="margin-top:14px"><h2>วิธีคำนวณที่ตั้งค่าได้ (แถบ ⚙ วิธีคำนวณ)</h2>
  <table class="gt"><tr><th>ตัวเลือก</th><th>ตัวเลือกที่มี</th><th>ความหมาย / ตัวอย่าง</th></tr>
  <tr><td><b>Bias ที่ใช้ใน Sigma / QGI</b></td><td><b>เฉลี่ยของ |bias| (Absolute)</b> (ค่าเริ่มต้น) · |ค่าเฉลี่ยแบบมีเครื่องหมาย| (Signed)</td>
    <td><b>Absolute</b> = ค่าเฉลี่ยของขนาด bias แต่ละรอบ ไม่สนเครื่องหมาย (วิธีเดียวกับ template เดิมของแล็บ) · <b>Signed</b> = ค่าสัมบูรณ์ของค่าเฉลี่ย bias ที่มีเครื่องหมาย บวกลบหักล้างกันได้ · ตัวอย่าง bias 6 รอบ = +2, −2, +2, −2, +2, −2 → เฉลี่ย |bias| = <b>2</b> แต่ค่าเฉลี่ยมีเครื่องหมาย = <b>0</b> (บวกลบหักล้างกัน ทำให้ Sigma สูงเกินจริง) · ส่วน Uncertainty ใช้ RMS bias ตามมาตรฐานเสมอ</td></tr>
  <tr><td><b>รวม %CV รายเดือน</b></td><td><b>%CV เฉลี่ยรายเดือน</b> (ค่าเริ่มต้น) · <b>Pooled CV (RMS)</b></td>
    <td><b>%CV เฉลี่ยรายเดือน</b> = ค่าเฉลี่ยเลขคณิตของ %CV แต่ละเดือน (วิธีเดียวกับ template เดิมของแล็บ) · <b>Pooled CV (RMS)</b> = √(Σ CV² / n) — ยกกำลังสอง %CV แต่ละเดือนก่อนเฉลี่ยแล้วถอดรากกลับ จึงให้น้ำหนักเดือนที่ CV สูงมากกว่า เหมาะเมื่อ CV แต่ละเดือนต่างกันมาก เพราะ imprecision ระยะยาวถูกดึงโดยเดือนที่แย่ (ตัวอย่าง CV 2, 4, 6 → เฉลี่ย 4.00 แต่ pooled 4.32 ได้ Sigma ต่ำกว่าเล็กน้อย) · ถ้าทุกเดือนใกล้เคียงกัน สองวิธีให้ค่าเกือบเท่ากัน</td></tr>
  <tr><td><b>สรุป Sigma / QC rule ตัดสินจาก</b></td><td><b>Min</b> (ค่าเริ่มต้น) · Average</td>
    <td>Min = Sigma ของ level ที่แย่สุด (conservative) · Average = (TEa − bias)/CV เฉลี่ยของทุก level ใช้กับสรุปรายเทส, QC rule, QGI และรายงาน ส่วน Sigma ราย level ยังแสดงครบ</td></tr>
  <tr><td><b>ชุดกฎ QC ที่แนะนำ</b></td><td><b>Westgard Sigma Rules</b> (ค่าเริ่มต้น) · ตารางเดิมของ webapp</td>
    <td>Westgard Sigma Rules แยกชุดกฎตาม Sigma (6 / 5 / 4 / &lt;4) และตามจำนวน control level ต่อ run (2 level หรือ 3 level เช่น CBC) — ดูแผนผังในแท็บ “แผนผัง QC rule”</td></tr>
  <tr><td><b>แหล่ง TEa</b> (รายแถว)</td><td>CLIA 2025 · Ricos · Custom · <b>Max (CLIA/Ricos)</b> · <b>Min (CLIA/Ricos)</b></td>
    <td>Max/Min เลือกค่า TEa eff ที่มากสุด/น้อยสุดของสองแหล่ง (ถ้าเทสไม่มีเกณฑ์ CLIA ใช้ Ricos) · ใช้ Max ระวังว่าผ่อนปรนกว่า ควรระบุเหตุผล</td></tr></table>
  <p class="note"><b>SDI</b> (Standardized Deviation Index) = (Lab result − Group mean) / Group SD ใช้ดู bias ของแต่ละรอบเทียบกลุ่ม (|SDI| ≤ 2 ถือว่าปกติ) · วิธีที่เลือกถูกพิมพ์ไว้ท้ายรายงาน และบันทึกในชีต Info ตอน Export</p></div>

  <div class="doc" style="margin-top:14px"><h2>คำอธิบาย QGI (Quality Goal Index)</h2>
  <p><b>QGI คืออะไร</b> — ดัชนีที่ใช้วินิจฉัยว่า <u>เมื่อ Sigma ไม่ถึงเป้า สาเหตุหลักมาจาก imprecision (CV สูง) หรือ inaccuracy (bias สูง)</u> โดยเทียบขนาดของ bias กับ imprecision ของวิธีตรวจ จึงช่วยตัดสินใจว่าควรแก้ที่ส่วนใด</p>
  <p><b>สูตร</b> &nbsp; <code>QGI = |Bias%| / (1.5 × CV%)</code> &nbsp; (Bias = ค่าเฉลี่ย bias จาก EQA/PT แบบมีเครื่องหมาย ใช้ค่าสัมบูรณ์, CV = SD/Mean×100 จาก IQC ของ level เดียวกัน)</p>
  <table style="width:100%;margin:8px 0"><tr><th class="l">ค่า QGI</th><th class="l">แปลผล</th><th class="l">ความหมาย</th><th class="l">แนวทางแก้ไข</th></tr>
  <tr><td class="l"><span class="cls q1">&lt; 0.8</span></td><td class="l">Imprecision</td><td class="l" style="white-space:normal">bias น้อยเมื่อเทียบกับ CV — ปัญหาอยู่ที่ความแม่น้อย/ผลแกว่ง</td><td class="l" style="white-space:normal">ตรวจ maintenance, probe/pipette, อายุ reagent และ lot ของ QC, ความถี่ calibration, สภาพแวดล้อม/อุณหภูมิ, ผู้ปฏิบัติงาน เพื่อลด SD</td></tr>
  <tr><td class="l"><span class="cls q2">0.8 – 1.2</span></td><td class="l">Imprecision + Inaccuracy</td><td class="l" style="white-space:normal">ทั้ง bias และ CV มีส่วนเท่าๆ กัน</td><td class="l" style="white-space:normal">ปรับปรุงทั้งสองด้าน — เริ่มจาก precision แล้วตามด้วยการ calibrate/ตรวจ traceability</td></tr>
  <tr><td class="l"><span class="cls q3">&gt; 1.2</span></td><td class="l">Inaccuracy (bias)</td><td class="l" style="white-space:normal">bias เป็นสาเหตุหลัก</td><td class="l" style="white-space:normal">recalibrate, ตรวจ calibrator/traceability และ lot, เทียบกับ reference หรือกลุ่มเพื่อน EQA, พิจารณาปรับ factor/ใช้ method อื่น</td></tr></table>
  <p><b>เมื่อไรควรใช้</b> — ใช้เมื่อ Sigma ต่ำกว่าเป้า (ที่ σ &lt; 4 ต้องปรับปรุง · σ 4–6 ควรติดตาม · σ ≥ 6 ไม่จำเป็นต้องแก้) หน้า QGI จึงแสดงคอลัมน์ “ความจำเป็น” และสรุปรายเทสจาก level ที่ Sigma ต่ำสุด</p>
  <p><b>ตัวอย่าง</b> — CV = 3.0%, Bias = 2.0% → QGI = 2.0 / (1.5 × 3.0) = 0.44 (&lt; 0.8) → ปัญหาหลักคือ imprecision ; ถ้า CV = 1.5%, Bias = 3.0% → QGI = 3.0 / (1.5 × 1.5) = 1.33 (&gt; 1.2) → ปัญหาหลักคือ bias</p>
  <p><b>ข้อควรระวัง</b> — QGI เป็นเครื่องมือชี้แนวทางแก้ไข ไม่ใช่เกณฑ์ผ่าน/ไม่ผ่าน (ใช้ Sigma ตัดสิน) · ถ้า bias มาจาก EQA เพียงไม่กี่รอบ ค่า bias และ QGI จะมีความไม่แน่นอนสูง · ควรคำนวณแยกทุก level ของ IQC</p></div>

  <div class="doc" style="margin-top:14px"><h2>คำอธิบายคำศัพท์</h2><ul>
  <li><b>IQC</b> — Internal Quality Control : การควบคุมคุณภาพภายในห้องปฏิบัติการ ใช้คำนวณ Mean/SD/CV</li>
  <li><b>EQA / PT</b> — External Quality Assessment / Proficiency Testing : การประเมินคุณภาพภายนอก ใช้คำนวณ bias เทียบกับค่าเป้าหมาย</li>
  <li><b>CV%</b> — สัมประสิทธิ์การกระจาย (SD/Mean×100) สะท้อน imprecision</li>
  <li><b>Bias%</b> — ความคลาดเคลื่อนเชิงระบบเทียบกับค่าเป้าหมาย สะท้อน inaccuracy</li>
  <li><b>TEa</b> — Total Allowable Error : ความคลาดเคลื่อนรวมที่ยอมรับได้ (อ้างอิง CLIA 2025 หรือ Ricos desirable)</li>
  <li><b>TEa eff</b> — Effective TEa : TEa (%) ที่ใช้จริงของแต่ละ level = max(TEa %, TEa abs/Mean×100) (ดูคำอธิบายด้านบน)</li>
  <li><b>Sigma</b> — จำนวน SD ของ imprecision ที่พอดีกับช่วง TEa หลังหัก bias ; ยิ่งสูงยิ่งดี (σ ≥ 6 = World class)</li>
  <li><b>Measurement Uncertainty (U)</b> — ช่วงที่ค่าจริงน่าจะอยู่ (ที่ความเชื่อมั่น ≈ 95% เมื่อ k = 2) ; u<sub>c</sub> = ความไม่แน่นอนมาตรฐานรวม</li>
  <li><b>u<sub>Rw</sub></b> — ความไม่แน่นอนจากความแม่น (within-lab reproducibility) = CV% จาก IQC ระยะยาว</li>
  <li><b>RMS bias</b> — ค่ากำลังสองเฉลี่ยของ bias จาก EQA/PT = √(Σbias²/n)</li>
  <li><b>u<sub>ref</sub></b> — ความไม่แน่นอนของค่าเป้าหมาย (assigned value) ของ EQA</li>
  <li><b>u<sub>bias</sub></b> — ความไม่แน่นอนเนื่องจาก bias = √(RMS bias² + u<sub>ref</sub>²)</li>
  <li><b>u<sub>cal</sub></b> — ความไม่แน่นอนของ calibrator</li>
  <li><b>u<sub>c</sub></b> — ความไม่แน่นอนมาตรฐานรวม (combined standard uncertainty) = √(u<sub>Rw</sub>² + u<sub>bias</sub>² + u<sub>cal</sub>²)</li>
  <li><b>k</b> — coverage factor (ปกติ 2)</li>
  <li><b>OPSpecs chart</b> — แผนภูมิ normalized (x = CV/TEa, y = Bias/TEa) แสดงตำแหน่งของแต่ละ test เทียบเส้น σ ; จุดที่อยู่ใกล้มุมซ้ายล่างดีที่สุด</li>
  <li><b>SDI</b> — Standardized Deviation Index = (Lab result − Group mean)/Group SD จาก EQA/PT</li>
  <li><b>Pooled CV</b> — รวม %CV หลายเดือนแบบ RMS = √(Σ CV²/n)</li>
  <li><b>level</b> — ระดับของสาร QC (เช่น normal / abnormal) ; Biochemistry ใช้ 2 level, CBC ใช้ 3 level เป็นค่าเริ่มต้น</li></ul>
  <p class="note">ควรตัดสินใจจาก level ที่ตัดสินใจทางคลินิก (medical decision level) หรือ level ที่ Sigma ต่ำสุด</p></div>`+refBox(["clia","ricos","rules","best","role","grid"]);
}

const REPORTS=["Sigma & OPSpecs","Uncertainty","QGI"];
function barsSplit(items,opts){
  if(!items.length)return'<span class="note">ยังไม่มีข้อมูล</span>';
  if(items.length<=20)return barChart(items,opts);
  const h=Math.ceil(items.length/2);
  return`<div class="bars2">${barChart(items.slice(0,h),opts)}${barChart(items.slice(h),opts)}</div>`;
}
function pageReport(opts){
  const keepFn=opts&&opts.keep?opts.keep:()=>true;
  const type=opts&&REPORTS.includes(opts.type)?opts.type:(REPORTS.includes(state.reportType)?state.reportType:REPORTS[0]);
  const rv=state.reportView==="test"?"test":"group";
  const portrait=!!(opts&&opts.portrait);
  const today=new Date().toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"});
  const i=state.info;
  const iqcLine=g=>{const q=i.iqc[g],lv=[0,1,2].map(k=>(q.lot[k]||q.exp[k])?`L${k+1}: ${esc(q.lot[k]||"—")}${q.exp[k]?" (Exp "+esc(q.exp[k])+")":""}`:"").filter(Boolean);
    return q.name||lv.length?`<div class="pg-iqc"><b>IQC</b> ${esc(q.name)} ${lv.join(" · ")}</div>`:""};
  const signLine=()=>i.preparedBy||i.approvedBy?`<div class="pg-sign"><span><b>ผู้จัดทำ</b> ${esc(i.preparedBy)||"……………………"}</span><span><b>ผู้ตรวจสอบ / อนุมัติ</b> ${esc(i.approvedBy)||"……………………"}</span></div>`:"";
  const optsNote=()=>"วิธี: Bias = "+biasTxt()+" · %CV รายเดือน = "+(state.opts.cvMethod==="pooled"?"pooled":"เฉลี่ย")+" · สรุป = "+decName()+" · กฎ QC = "+(state.opts.rules==="old"?"ตารางเดิม":"Westgard Sigma Rules");
  const head=(title,sub,g,kick,eqaOv)=>`<div class="pg-head"><div><div class="pg-kicker">Measurement Uncertainty &amp; Sigma Metric · ${kick||type}</div><h2>${title}</h2><div class="pg-sub">${sub}</div></div>
    <div class="pg-meta"><div><b>รพ.</b> ${esc(i.hospital)||"—"}</div><div><b>Lab</b> ${esc(i.lab)||"—"}</div><div><b>EQA</b> ${esc(eqaOv||i.eqa[g])||"—"}</div><div><b>Analyzer</b> ${esc(i.analyzer[g])||"—"}</div><div><b>S/N</b> ${esc(i.sn[g])||"—"}</div>${i.dataset?`<div><b>ชุดข้อมูล</b> ${esc(i.dataset)}</div>`:""}${i.period?`<div><b>ช่วงประเมิน</b> ${esc(i.period)}</div>`:""}<div><b>วันที่</b> ${today}</div></div></div>${iqcLine(g)}`;
  const refLine=keys=>keys&&keys.length?`<div class="pg-ref"><b>อ้างอิง (Westgard QC):</b> ${keys.map(k=>`${REFS[k].s} — ${REFS[k].u}`).join(" · ")}</div>`:"";
  const foot=(note,label,refs)=>`<div class="pg-foot"><span>${note}</span><span class="by">By <b>PANTONE LAB</b></span><span>${label}</span></div>${refLine(refs)}${signLine()}`;
  const lab=v=>v.r.test+(v.r.level?" "+v.r.level:"");
  const abbr=(full,unc)=>abbrBox("ตัวย่อ",[["TEa eff","Effective Total Allowable Error : ค่า TEa (%) ที่ใช้จริงของ level นั้น = max(TEa %, TEa abs / Mean × 100)"],
    ...(full?[["TEa","Total Allowable Error"],["CV","สัมประสิทธิ์การกระจาย (SD/Mean×100)"],["σ","Sigma metric = (TEa eff − |Bias|)/CV"],["QGI","Quality Goal Index = |Bias|/(1.5×CV)"],
      ...(unc?[]:[["U","Expanded uncertainty = k·u<sub>c</sub>"],["IQC/EQA","การควบคุมคุณภาพภายใน / การประเมินคุณภาพภายนอก"]])]:[])]);
  const pages=[];

  const repSigma=(g,vs)=>{
    const sg=vs.filter(v=>v.c.sigma!=null),skipped=vs.length-sg.length;
    const body=sg.map(v=>{const c=v.c;return`<tr ${trc(v)}><td>${esc(v.r.test)}</td><td>${esc(v.r.level)}</td><td>${fm(c.mean)} ${esc(c.unit)}</td><td>${f2(c.cv)}</td><td>${f2(c.meanBias)}</td>
      <td>${f2(c.tea)}<br><small>${esc(v.r.src)}${v.r.src===SRC.CUSTOM&&v.r.csrc?": "+esc(v.r.csrc):""}</small></td><td><b>${f2(c.sigma)}</b></td><td>${chip(c.sigma)}</td><td class="l">${cls(c.sigma,v.r.test)[2]}</td></tr>`}).join("");
    const fn="TEa: CLIA 2025 / Ricos desirable (Westgard QC) · Sigma = (TEa<sub>eff</sub>% − |Bias%|)/CV% · "+optsNote();
    pages.push(`<section class="pg">${head("ผลการคำนวณ Sigma — "+g,"Sigma และ QC rule ที่แนะนำของทุก level",g)}
      ${cards([["จำนวน level",sg.length],["Sigma เฉลี่ย",sg.length?f2(mean_(sg.map(v=>v.c.sigma))):"-"],["σ ≥ 4",`${sg.filter(v=>v.c.sigma>=4).length} / ${sg.length}`],["σ < 3",sg.filter(v=>v.c.sigma<3).length]])}
      ${sg.length?table(["Test","Level","Mean","CV %","Bias %","TEa eff % (แหล่ง)","Sigma","Class","Suggested QC rule"],body):'<p class="note">ยังไม่มีข้อมูล</p>'}
      ${skipped?`<p class="note">${skipped} แถวไม่มี TEa จึงไม่คำนวณ Sigma</p>`:""}${abbr(false)}${foot(fn,g+" · ผลการคำนวณ",["clia","ricos","rules"])}</section>`);
    const pts=sg.filter(v=>v.c.tea>0).map(v=>({label:lab(v),x:v.c.cv/v.c.tea*100,y:Math.abs(v.c.meanBias)/v.c.tea*100,sg:v.c.sigma,cc:cls(v.c.sigma)[1],name:cls(v.c.sigma)[0]}));
    const chips=[["World class",6],["Excellent",5],["Good",4],["Marginal",3],["Unacceptable",0]].map(([n,x])=>`<span class="cls ${cls(x)[1]}">${n}: ${sg.filter(v=>cls(v.c.sigma)[0]===n).length}</span>`).join(" ");
    pages.push(`<section class="pg opg">${head("Normalized OPSpecs chart — "+g,"ตำแหน่งของแต่ละ test/level เทียบเส้น Sigma",g)}

      <div class="op-guide"><b>วิธีอ่านกราฟ</b> — แกน x = CV/TEa×100 · แกน y = |Bias|/TEa×100 · เส้น σ: y = 100 − σ·x · จุดที่อยู่ใต้/ซ้ายของเส้น σ สูงกว่าคือคุณภาพดีกว่า (พื้นที่แรเงาเขียว = σ ≥ 6) · เส้นประ = 33% TEa</div>
      ${foot(fn,g+" · OPSpecs chart",["clia","ricos","rules"])}</section>`);
  };

  const repUnc=(g,vs)=>{
    const maxv=vs.reduce((a,v)=>!a||v.c.U>a.c.U?v:a,null),minv=vs.reduce((a,v)=>!a||v.c.U<a.c.U?v:a,null);
    const sum=byTest(vs).map(([t,a],ti)=>{const Us=a.map(v=>v.c.U),w=a.reduce((x,v)=>v.c.U>x.c.U?v:x);
      return`<tr class="g${ti%3}"><td>${esc(t)}</td><td>${a.length}</td><td>${f2(Math.min(...Us))} – ${f2(Math.max(...Us))}</td>
      <td class="l">${a.map(v=>`${esc(v.r.level)}: ${fmtU(v.c.mean,v.c.Uabs,v.c.unit)}`).join(" · ")}</td><td class="l">${esc(w.r.level)} (U=${f2(w.c.U)}%)</td></tr>`}).join("");
    const det=vs.map(v=>{const c=v.c;return`<tr ${trc(v)}><td>${esc(v.r.test)}</td><td>${esc(v.r.level)}</td><td>${esc(c.unit)}</td><td>${fm(c.mean)}</td>
      <td>${f2(c.cv)}</td><td>${f2(c.rms)}</td><td>${f2(c.uref)}</td><td>${f2(c.ubias)}</td><td>${f2(c.ucal)}</td><td><b>${f2(c.uc)}</b></td><td>${c.k}</td>
      <td><b>${f2(c.U)}</b></td><td>${f2(c.Uabs,3)}</td><td class="l">${fmtU(c.mean,c.Uabs,c.unit)}</td></tr>`}).join("");
    const fn="u<sub>c</sub> = √(u<sub>Rw</sub>² + u<sub>bias</sub>² + u<sub>cal</sub>²) · U = k·u<sub>c</sub> · u<sub>bias</sub> = √(RMS bias² + u<sub>ref</sub>²)";
    pages.push(`<section class="pg">${head("รายงาน Measurement Uncertainty — "+g,"Top-down (ISO 15189 / ISO/TS 20914) ของทุก level",g)}
      ${cards([["จำนวน level",vs.length],["U% เฉลี่ย",vs.length?f2(mean_(vs.map(v=>v.c.U)))+" %":"-"],["U% สูงสุด",maxv?`${f2(maxv.c.U)} %<br><small>${esc(lab(maxv))}</small>`:"-"],["U% ต่ำสุด",minv?`${f2(minv.c.U)} %<br><small>${esc(lab(minv))}</small>`:"-"]])}
      ${vs.length?`<h3 class="pg-h3">สรุปรายเทส</h3>${table(["Test","จำนวน level","U % (min – max)","Result: Mean ± U ของแต่ละ level","Level ที่ U สูงสุด"],sum)}
      <h3 class="pg-h3">รายละเอียดการคำนวณ</h3>${table(["Test","Level","Unit","Mean","u_Rw = CV %","RMS bias %","u_ref %","u_bias %","u_cal %","u_c %","k","U %","U (abs)","Result (Mean ± U)"],det)}`:'<p class="note">ยังไม่มีข้อมูล</p>'}
      <div class="op-guide"><b>สูตรที่ใช้</b> — u<sub>Rw</sub> = CV% = SD/Mean×100 (IQC สะสม) · u<sub>bias</sub> = √(RMS bias² + u<sub>ref</sub>²) (RMS bias จาก EQA/PT) · u<sub>c</sub> = √(u<sub>Rw</sub>² + u<sub>bias</sub>² + u<sub>cal</sub>²) · U = k × u<sub>c</sub> (k = 2 ≈ 95%) · U(abs) = U% × Mean/100</div>
      ${uncAbbrHtml()}${foot(fn,g+" · ตาราง Uncertainty")}</section>`);
    const items=vs.map(v=>({label:lab(v),value:v.c.U,color:`var(--t${v.g})`}));
    pages.push(`<section class="pg opg">${head("กราฟ Expanded uncertainty U% — "+g,"U% (k ตามที่กำหนดในแต่ละแถว) ของทุก level",g)}
      <div class="op-chips"><span class="cls q1">เฉลี่ย ${vs.length?f2(mean_(vs.map(v=>v.c.U))):"-"} %</span><span class="cls q2">สูงสุด ${maxv?f2(maxv.c.U):"-"} %</span><span class="cls s6">ต่ำสุด ${minv?f2(minv.c.U):"-"} %</span></div>
      <div class="op-chart">${barsSplit(items,{max:Math.max(10,...vs.map(v=>v.c.U))*1.05,aria:"U% chart"})}</div>
      <div class="op-guide"><b>วิธีอ่านกราฟ</b> — ความยาวแท่ง = U% ของแต่ละ level (ยิ่งยาวยิ่งไม่แน่นอนมาก) · สีแท่งสลับตามเทสเพื่อแยกแต่ละเทส · U ที่สูงมักมาจาก CV หรือ bias จาก EQA ที่สูง ดูรายละเอียด u<sub>Rw</sub>, u<sub>bias</sub>, u<sub>cal</sub> ในหน้าตาราง</div>
      ${foot(fn,g+" · กราฟ U%")}</section>`);
  };

  const repQgi=(g,vs)=>{
    const ok=vs.filter(v=>v.c.qgi!=null),need=ok.filter(v=>v.c.sigma<6),n=c=>need.filter(v=>qgiInfo(v.c.qgi,v.c.sigma).cls===c).length;
    const sum=byTest(ok).map(([t,a],ti)=>{const w=decisive(a),q=qgiInfo(w.c.qgi,w.c.sigma);
      return`<tr class="g${ti%3}"><td>${esc(t)}</td><td class="l">${a.map(v=>`${esc(v.r.level)}: ${f2(v.c.qgi,2)}`).join(" · ")}</td><td>${esc(w.r.level)} (σ=${f2(w.c.sigma)})</td><td><span class="cls ${q.cls}">${q.name}</span></td><td class="l">${needHtml(q)}</td></tr>`}).join("");
    const det=ok.map(v=>{const c=v.c,q=qgiInfo(c.qgi,c.sigma);return`<tr ${trc(v)}><td>${esc(v.r.test)}</td><td>${esc(v.r.level)}</td><td>${f2(c.cv)}</td><td>${f2(Math.abs(c.meanBias))}</td>
      <td>${f2(c.sigma)} ${chip(c.sigma)}</td><td><b>${f2(c.qgi,3)}</b></td><td><span class="cls ${q.cls}">${q.name}</span></td><td class="l">${needHtml(q)}</td><td class="l" style="white-space:normal;min-width:260px">${q.act}</td></tr>`}).join("");
    const fn="QGI = |Bias%| / (1.5 × CV%) · &lt;0.8 imprecision · 0.8–1.2 ทั้งสอง · &gt;1.2 inaccuracy (bias)";
    pages.push(`<section class="pg">${head("รายงาน QGI (Quality Goal Index) — "+g,"วินิจฉัยสาเหตุเมื่อ Sigma ไม่ถึงเป้า ของทุก level",g)}
      ${cards([["จำนวน level",ok.length],["Imprecision (σ<6)",n("q1")],["Imprecision + Inaccuracy (σ<6)",n("q2")],["Inaccuracy (σ<6)",n("q3")]])}
      ${ok.length?`<h3 class="pg-h3">สรุปรายเทส (ตัดสินจาก ${decName()})</h3>${table(["Test","QGI แต่ละ level","Level ที่ Sigma ("+decName()+")","สาเหตุหลัก","ความจำเป็น"],sum)}
      <h3 class="pg-h3">รายละเอียด QGI</h3>${table(["Test","Level","CV %","|Bias| %","Sigma","QGI","แปลผล","ความจำเป็น","แนวทางแก้ไข"],det)}`:'<p class="note">ยังไม่มีข้อมูล</p>'}
      ${foot(fn,g+" · ตาราง QGI")}</section>`);
    const items=ok.map(v=>({label:lab(v),value:v.c.qgi,color:`var(${{q1:"--q1",q2:"--q2",q3:"--q3"}[qgiInfo(v.c.qgi,v.c.sigma).cls]})`}));
    pages.push(`<section class="pg opg">${head("กราฟ QGI (Quality Goal Index) — "+g,"เส้นประ = เกณฑ์ 0.8 และ 1.2",g)}
      <div class="op-chips"><span class="cls q1">Imprecision: ${ok.filter(v=>v.c.qgi<0.8).length}</span><span class="cls q2">ทั้งสอง: ${ok.filter(v=>v.c.qgi>=0.8&&v.c.qgi<=1.2).length}</span><span class="cls q3">Inaccuracy: ${ok.filter(v=>v.c.qgi>1.2).length}</span></div>
      <div class="op-chart">${barsSplit(items,{max:Math.max(2,...ok.map(v=>v.c.qgi))*1.05,lines:[0.8,1.2],aria:"QGI chart"})}</div>
      <div class="qg-guide">
        <div style="border-left-color:var(--q1)"><b>QGI &lt; 0.8 — Imprecision</b><br>ตรวจ maintenance, probe/pipette, reagent & QC lot, ความถี่ calibration เพื่อลด SD</div>
        <div style="border-left-color:var(--q2)"><b>0.8 – 1.2 — ทั้งสองอย่าง</b><br>ปรับปรุงทั้ง precision และ bias เริ่มจาก precision</div>
        <div style="border-left-color:var(--q3)"><b>QGI &gt; 1.2 — Inaccuracy (bias)</b><br>recalibrate, ตรวจ calibrator/traceability, เทียบกับ reference หรือกลุ่ม EQA</div></div>
      ${foot(fn,g+" · กราฟ QGI")}</section>`);
  };


  const tpages=[];
  let tnum=0;const ttotal=GROUPS.reduce((n,g)=>n+byTest(view(g).filter(v=>v.c&&v.c.sigma!=null)).filter(([tt,aa])=>keepFn(g,tt,aa)).length,0);
  const PARTS=Object.assign({data:true,tea:true,sigma:true,qgi:true,unc:true,chart:true},opts&&opts.parts);
  const repTest=(g,vs)=>{
    byTest(vs.filter(v=>v.c.sigma!=null)).forEach(([test,a])=>{
      if(!keepFn(g,test,a))return;
      tnum++;
      const p=byName(test),w=decisive(a),q=qgiInfo(w.c.qgi,w.c.sigma),wu=a.reduce((x,v)=>v.c.U>x.c.U?v:x);
      const teaParts=v=>{const r=v.r;if(r.src===SRC.CUSTOM)return[num(r.custom)||0,0];if(r.src===SRC.CLIA)return[p.clia_pct||0,p.clia_abs||0];return[p.ric.TE,0]};
      const lv=v=>`<th>${esc(v.r.level)}</th>`;
      const row=(label,fn,cls_)=>`<tr${cls_?` class="${cls_}"`:""}><td class="l">${label}</td>${a.map(v=>`<td>${fn(v)}</td>`).join("")}</tr>`;
      const sec=(title)=>`<tr class="psec"><td colspan="${a.length+1}" class="l">${title}</td></tr>`;
      const R={};  // row builders
      R.mean=()=>row("Mean ("+esc(p.unit)+")",v=>fm(v.c.mean));
      R.cv=()=>row("CV % (u<sub>Rw</sub>)",v=>f2(v.c.cv));
      R.bias=()=>row("Bias % (ที่ใช้: "+(state.opts.biasMethod==="signed"?"|เฉลี่ยมีเครื่องหมาย|":"เฉลี่ย |bias|")+")",v=>f2(v.c.meanBias));
      R.tea=()=>row("<b>TEa eff %</b>",v=>`<b>${f2(v.c.tea)}</b>`);
      const blocks=[];
      if(PARTS.data)blocks.push(sec("ข้อมูล IQC / EQA")+R.mean()+row("SD",v=>v.c.sd==null?"—":+v.c.sd.toFixed(4))+R.cv()+row("EQA bias % (รอบที่ได้)",v=>`<small>${esc(v.r.bias)||"—"}</small>`)+R.bias());
      if(PARTS.tea)blocks.push(sec("TEa (ความคลาดเคลื่อนรวมที่ยอมรับได้)")+row("แหล่ง TEa",v=>`${esc(v.r.src)}${v.r.src===SRC.CUSTOM&&v.r.csrc?` <small>(${esc(v.r.csrc)})</small>`:""}`)+row("TEa % / TEa abs ("+esc(p.unit)+")",v=>`${f2(teaParts(v)[0])} / ${teaParts(v)[1]?+teaParts(v)[1]:"—"}`)+R.tea());
      if(PARTS.sigma)blocks.push(sec("Sigma")+(PARTS.data?"":R.cv()+R.bias())+(PARTS.tea?"":R.tea())+row("<b>Sigma</b>",v=>`<b style="font-size:15px">${f2(v.c.sigma)}</b>`,"prow-hi")+row("Class",v=>chip(v.c.sigma))+row("QC rule ที่แนะนำ",v=>`<small>${cls(v.c.sigma,test)[2]}</small>`));
      if(PARTS.qgi)blocks.push(sec("QGI — Quality Goal Index")+(PARTS.data||PARTS.sigma?"":R.cv()+row("|Bias| %",v=>f2(Math.abs(v.c.meanBias))))+row("QGI",v=>`${f2(v.c.qgi,2)} <small>${qgiInfo(v.c.qgi,v.c.sigma).name}</small>`)+row("ความจำเป็น",v=>`<small>${needHtml(qgiInfo(v.c.qgi,v.c.sigma))}</small>`));
      if(PARTS.unc)blocks.push(sec("Measurement Uncertainty (k = "+esc(a[0].c.k)+")")+(PARTS.data?"":R.mean()+R.cv())+(PARTS.data?row("u<sub>bias</sub> % / u<sub>c</sub> %",v=>`${f2(v.c.ubias)} / ${f2(v.c.uc)}`):row("RMS bias % / u<sub>ref</sub> %",v=>`${f2(v.c.rms)} / ${f2(v.c.uref)}`)+row("u<sub>bias</sub> % / u<sub>cal</sub> %",v=>`${f2(v.c.ubias)} / ${f2(v.c.ucal)}`)+row("u<sub>c</sub> %",v=>f2(v.c.uc)))+row("<b>U %</b>",v=>`<b>${f2(v.c.U)}</b>`,"prow-hi")+row("Result (Mean ± U)",v=>`<small>${fmtU(v.c.mean,v.c.Uabs,v.c.unit)}</small>`));
      const hasTable=blocks.length>0;
      const onlyChart=!hasTable&&PARTS.chart;
      const params=hasTable?`<div class="wrap"><table class="ptable"><tr><th class="l">Parameter</th>${a.map(lv).join("")}</tr>${blocks.join("")}</table></div>`:"";
      const pts=a.filter(v=>v.c.tea>0).map(v=>({label:test+" "+v.r.level,short:v.r.level,x:v.c.cv/v.c.tea*100,y:Math.abs(v.c.meanBias)/v.c.tea*100,sg:v.c.sigma,cc:cls(v.c.sigma)[1],name:cls(v.c.sigma)[0]}));
      const crit=`CLIA 2025: ${p.clia_pct||p.clia_abs?esc(p.clia_text):"ไม่มีเกณฑ์"} · Ricos desirable TE: ${p.ric.TE}%`;
      const cardList=[];
      if(PARTS.sigma){cardList.push(["Sigma ("+decName()+")",`${f2(w.c.sigma)}<br><small>${esc(w.r.level)}</small>`]);cardList.push(["Class",chip(w.c.sigma)||"-"])}
      if(PARTS.qgi)cardList.push(["QGI — Quality Goal Index (ตาม "+decName()+")",f2(w.c.qgi,2)]);
      if(PARTS.unc)cardList.push(["U % สูงสุด",`${f2(wu.c.U)}<br><small>${esc(wu.r.level)}</small>`]);
      cardList.push(["จำนวน level",a.length]);
      const bits=[];
      if(PARTS.sigma)bits.push(`Sigma (${decName()}) ที่ level ${esc(w.r.level)} = <b>${f2(w.c.sigma)}</b> (${cls(w.c.sigma)[0]}) → QC rule ที่แนะนำ: <b>${cls(w.c.sigma,test)[2]}</b>`);
      if(PARTS.qgi)bits.push(`QGI ${f2(w.c.qgi,2)} → <b>${q.name}</b> (${needHtml(q)})${w.c.sigma<6?` · แนวทาง: ${q.act}`:""}`);
      if(PARTS.unc)bits.push(`U% สูงสุด <b>${f2(wu.c.U)}%</b> ที่ level ${esc(wu.r.level)} → ${fmtU(wu.c.mean,wu.c.Uabs,wu.c.unit)}`);
      const summary=bits.length?`<div class="op-guide"><b>สรุป</b> — ${bits.join(" · ")}</div>`:"";
      const chartBlock=PARTS.chart?`<div${onlyChart?' style="max-width:70%;margin:0 auto"':""}><h3 class="pg-h3" style="margin-top:0">Normalized OPSpecs chart — ${esc(test)}</h3><div class="op-chart">${opSvg(pts,g,true,true,250)}</div>
          <p class="note">x = CV/TEa eff×100 · y = |Bias|/TEa eff×100 · เส้น σ: y = 100 − σ·x · จุดใต้/ซ้ายเส้น σ สูงกว่า = ดีกว่า</p>${hasTable?summary:""}</div>`:"";
      const leftBlock=hasTable?`<div>${params}${PARTS.tea||PARTS.sigma?`<p class="note" style="margin-top:8px">เกณฑ์ TEa — ${crit}</p>`:""}${PARTS.chart?"":summary}</div>`:"";
      const single=!(hasTable&&PARTS.chart);
      const kick="รายงานรายเทส · "+[PARTS.data&&"ข้อมูล IQC/EQA",PARTS.tea&&"TEa",PARTS.sigma&&"Sigma",PARTS.qgi&&"QGI (Quality Goal Index)",PARTS.unc&&"Uncertainty",PARTS.chart&&"OPSpecs"].filter(Boolean).join(" · ");
      const fn=[(PARTS.sigma||PARTS.tea)&&"Sigma = (TEa eff − |Bias|)/CV",PARTS.qgi&&"QGI = |Bias|/(1.5·CV)",PARTS.unc&&"U = k·u<sub>c</sub>",(PARTS.sigma||PARTS.qgi)&&optsNote()].filter(Boolean).join(" · ")||"Normalized OPSpecs";
      const mt=state.meta[eqaKey(g,test)]||{};
      tpages.push(`<section class="pg tpg">${head(esc(test),`${g} · หน่วย ${esc(p.unit)} · ${a.length} level${mt.method?" · Methodology: "+esc(mt.method):""}`,g,kick,mt.eqa)}
        ${cards(cardList)}
        <div class="tpg-grid"${single?' style="grid-template-columns:1fr!important"':""}>${leftBlock}${chartBlock}</div>
        ${PARTS.tea||PARTS.sigma?abbr(true,PARTS.unc):(PARTS.qgi?abbrBox("ตัวย่อ",[["QGI","Quality Goal Index = |Bias%| / (1.5 × CV%) · &lt;0.8 imprecision · 0.8–1.2 ทั้งสอง · &gt;1.2 inaccuracy (bias)"],["CV","สัมประสิทธิ์การกระจาย (SD/Mean×100)"],["Bias","ความคลาดเคลื่อนเชิงระบบจาก EQA/PT"],["σ","Sigma metric"]]):"")}${PARTS.unc?uncAbbrHtml():""}${foot(fn,`${g} · ${esc(test)} · หน้า ${tnum} / ${ttotal}`,[...(PARTS.tea||PARTS.sigma?["clia","ricos"]:[]),...(PARTS.sigma?["rules"]:[])])}</section>`);
    });
  };
  GROUPS.forEach(g=>{
    if(opts&&opts.groups&&!opts.groups.includes(g))return;
    const vs=view(g).filter(v=>v.c);
    (type==="Uncertainty"?repUnc:type==="QGI"?repQgi:repSigma)(g,vs);
    repTest(g,vs);
  });

  $("expType").onchange=e=>{expState.type=e.target.value;expRender()};
  $("expSig").oninput=e=>{expState.maxSigma=e.target.value;expRender()};
  const setAll=on=>{document.querySelectorAll("[data-k]").forEach(c=>{c.checked=on;on?expState.sel.add(c.dataset.k):expState.sel.delete(c.dataset.k)});expRender()};
  $("expAll").onclick=()=>setAll(true);$("expNone").onclick=()=>setAll(false);
  document.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{c.checked?expState.sel.add(c.dataset.k):expState.sel.delete(c.dataset.k);expRender()});
  expRender();window.scrollTo(0,0);
}
function exitExport(){document.body.classList.remove("exportmode","portrait");const po=document.getElementById("pageOrient");if(po)po.remove();show()}

const TPL_HEAD=["Group","Test","Level","Mean","SD","CV monthly list","EQA bias list","u_ref","u_cal","k","TEa source","Custom TEa %","Custom TEa source","Methodology","EQA (this test)"];
const CSV_MAP={"CV monthly list":"CV_monthly_list","EQA bias list":"EQA_bias_list","TEa source":"TEa_source","Custom TEa %":"Custom_TEa%","Custom TEa source":"Custom_TEa_source","EQA (this test)":"EQA_this_test"};
const EQA_HEAD=["Group","Test","Trial","Lab result","Group mean","Group SD","%Bias","SDI"];
const eqaFormulas=n=>[{f:`IF(AND(ISNUMBER(D${n}),ISNUMBER(E${n}),E${n}<>0),(D${n}-E${n})/E${n}*100,"")`},{f:`IF(AND(ISNUMBER(D${n}),ISNUMBER(E${n}),ISNUMBER(F${n}),F${n}>0),(D${n}-E${n})/F${n},"")`}];
const srcOfPreset=p=>(p.clia_pct||p.clia_abs)?SRC.CLIA:SRC.RICOS;
function templateRows(){
  const rows=[];
  GROUPS.forEach(g=>PRESETS.filter(p=>p.group===g).forEach(p=>{
    for(let k=1;k<=(g==="CBC"?3:2);k++)rows.push([g,p.test,"L"+k,"","","","",0,0,2,srcOfPreset(p),"","","",""]);
  }));
  return rows;
}
function guideRows(){
  return[["Sheet / Column","คำอธิบาย"],
    ["Info","ข้อมูลทั่วไป: ชื่อชุดข้อมูล (ใช้ตั้งชื่อไฟล์), ช่วงเวลาประเมิน, รพ., Lab, ผู้จัดทำ/อนุมัติ, EQA/Analyzer/S/N/IQC ของแต่ละกลุ่ม และวิธีคำนวณ (Bias method / CV method / Decision basis) และชุดกฎ QC (QC rule set) — กรอกในคอลัมน์ B · ค่าที่ใช้ได้: Bias method = abs | signed · CV method = avg | pooled · Decision basis = min | avg · QC rule set = wg (Westgard Sigma Rules) | old (ตารางเดิม)"],
    ["Data › Group","Biochemistry หรือ CBC (เว้นว่างได้ ระบบดูจากชื่อ Test)"],["Data › Test","ชื่อเทส เลือกจาก dropdown (ดูชีต Test list)"],
    ["Data › Level","ชื่อ level ของ QC เช่น L1, L2, L3 — เพิ่ม level ได้โดยคัดลอกแถวแล้วเปลี่ยน Level"],
    ["Data › Mean","ค่าเฉลี่ย IQC ของ level (ถ้าไม่ทราบและมี CV monthly list เว้นว่างได้ — แต่เกณฑ์ TEa หน่วยสัมบูรณ์และ U (abs) ต้องมี Mean)"],
    ["Data › SD","SD ของ IQC (ไม่ต้องกรอกถ้ากรอก CV monthly list)"],
    ["Data › CV monthly list","%CV รายเดือนของ level นี้ คั่นด้วย comma เช่น 2.1, 1.8, 2.4 — ถ้ากรอก ระบบใช้ค่านี้แทน SD/Mean (รวมด้วยค่าเฉลี่ยหรือ pooled ตามที่ตั้งใน Info › CV method)"],
    ["Data › EQA bias list","Bias % จาก EQA/PT คั่นด้วย comma (ใช้เมื่อไม่ได้กรอกชีต EQA ของเทสนั้น)"],
    ["Data › u_ref / u_cal / k","ความไม่แน่นอนของค่าเป้าหมาย EQA (%), ของ calibrator (%) ไม่ทราบใส่ 0 · k = coverage factor ปกติ 2"],
    ["Data › TEa source","CLIA 2025 / Ricos Desirable / Custom / Max (CLIA/Ricos) / Min (CLIA/Ricos)"],
    ["Data › Custom TEa % / source","ใส่เมื่อ TEa source = Custom พร้อมที่มา"],
    ["Data › Methodology / EQA (this test)","ข้อมูลของเทสนั้น (ใส่ที่แถวใดก็ได้ของเทส): Methodology และชื่อโปรแกรม EQA ถ้าต่างจากของกลุ่ม"],
    ["EQA","ผล EQA/PT รายเทสรายรอบ: Test, Trial, Lab result, Group mean, Group SD (ถ้ามี) — ระบบคำนวณ %Bias = (Lab − Group mean)/Group mean × 100 และ SDI · เมื่อเทสมีข้อมูลที่นี่ ใช้แทน EQA bias list (ใช้กับทุก level)"],
    ["หมายเหตุ","แถวที่ไม่มี Mean, SD และ CV monthly list จะถูกข้ามตอน Import · กรอกเสร็จบันทึกไฟล์แล้วกดปุ่ม ⬆ Import ในเว็บ"],
    ["ไฟล์ template ของแล็บเดิม","เว็บ Import ไฟล์ “Sigma CBC template” (ชีต Raw Data + Performance) ได้โดยตรง — อ่าน %CV รายเดือน, ผล EQA รายรอบ, TEa และข้อมูลหัวรายงาน (Mean ไม่มีใน template เดิม จึงเว้นว่าง)"]];
}
function dvFor(testCount){return[{sqref:"B2:B600",list:`'Test list'!$B$2:$B$${testCount+1}`},{sqref:"K2:K600",list:`"${Object.values(SRC).join(",")}"`},{sqref:"A2:A600",list:'"Biochemistry,CBC"'}]}
function infoSheet(I,o){return infoKV(I,o).map(r=>[r[0],r[1],r[2]||""])}
function buildTemplate(){
  const tests=PRESETS.map(p=>[p.group,p.test,p.unit,p.clia_text,p.ric.TE]),eqaRows=[];
  GROUPS.forEach(g=>PRESETS.filter(p=>p.group===g).forEach(p=>{for(let k=0;k<6;k++){const n=eqaRows.length+2;eqaRows.push([g,p.test,"","","","",...eqaFormulas(n)])}}));
  return IO.makeXlsx([
    {name:"Info",header:false,rows:infoSheet(blankInfo(),{biasMethod:"abs",cvMethod:"avg",decide:"min",rules:"wg"})},
    {name:"Data",rows:[TPL_HEAD,...templateRows()],dv:dvFor(tests.length)},
    {name:"EQA",rows:[EQA_HEAD,...eqaRows],dv:[{sqref:"B2:B900",list:`'Test list'!$B$2:$B$${tests.length+1}`},{sqref:"A2:A900",list:'"Biochemistry,CBC"'}]},
    {name:"คำแนะนำ",rows:guideRows()},
    {name:"Test list",rows:[["Group","Test","Unit","CLIA 2025 criterion","Ricos TE %"],...tests]}]);
}
function downloadTemplate(kind){
  if(kind==="csv"){
    const head=["Hospital","Lab","EQA","Analyzer","S/N","Dataset","Period",...TPL_HEAD.map(h=>CSV_MAP[h]||h)];
    download(new Blob([IO.toCsv([head,...templateRows().map(r=>["","","","","","","",...r])])],{type:"text/csv;charset=utf-8"}),"template_mu_sigma.csv");
  }else{
    download(new Blob([buildTemplate()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"template_mu_sigma.xlsx");
  }
  setStatus(`ดาวน์โหลด template (${kind==="csv"?"CSV":"Excel"}) แล้ว — กรอกแล้วกด Import${kind==="csv"?" (CSV ไม่มีชีต EQA รายรอบ ใช้ช่อง EQA bias list)":""}`);
}
const SAMPLE_INFO=Object.assign(blankInfo(),{hospital:"โรงพยาบาลตัวอย่าง",lab:"ห้องปฏิบัติการตัวอย่าง",dataset:"ตัวอย่าง (Sample)",period:"ต.ค. – มี.ค. (ตัวอย่าง)",preparedBy:"ผู้จัดทำตัวอย่าง",approvedBy:"ผู้อนุมัติตัวอย่าง",
  eqa:{Biochemistry:"EQA ตัวอย่าง (Biochemistry)",CBC:"EQA ตัวอย่าง (CBC)"},analyzer:{Biochemistry:"Analyzer ตัวอย่าง (Biochemistry)",CBC:"Analyzer ตัวอย่าง (CBC)"},
  sn:{Biochemistry:"SN-SAMPLE-BIO",CBC:"SN-SAMPLE-CBC"},
  iqc:{Biochemistry:{name:"IQC ตัวอย่าง (Biochemistry)",lot:["LOT-B1","LOT-B2",""],exp:["31-12-26","31-12-26",""]},CBC:{name:"IQC ตัวอย่าง (CBC)",lot:["LOT-C1","LOT-C2","LOT-C3"],exp:["31-12-26","31-12-26","31-12-26"]}}});
function sampleRowsAll(){const rows=[];GROUPS.forEach(g=>exampleRows(g).forEach(r=>rows.push([g,r.test,r.level,asNum(r.mean),asNum(r.sd),"",r.bias,0,0,2,r.src,"","","",""])));return rows}
function downloadSample(kind){
  const rows=sampleRowsAll(),I=SAMPLE_INFO;
  if(kind==="csv"){
    const head=["Hospital","Lab","EQA","Analyzer","S/N","Dataset","Period",...TPL_HEAD.map(h=>CSV_MAP[h]||h)];
    download(new Blob([IO.toCsv([head,...rows.map(r=>[I.hospital,I.lab,I.eqa[r[0]],I.analyzer[r[0]],I.sn[r[0]],I.dataset,I.period,...r])])],{type:"text/csv;charset=utf-8"}),"sample_data_mu_sigma.csv");
  }else{
    const tests=PRESETS.map(p=>[p.group,p.test,p.unit,p.clia_text,p.ric.TE]),eqaRows=[];
    PRESETS.forEach(p=>exampleTrials(p).forEach(x=>{const n=eqaRows.length+2;eqaRows.push([p.group,p.test,x.t,asNum(x.lab),asNum(x.gm),asNum(x.gsd),...eqaFormulas(n)])}));
    const bytes=IO.makeXlsx([
      {name:"Info",header:false,rows:infoSheet(I,{biasMethod:"abs",cvMethod:"avg",decide:"min",rules:"wg"})},
      {name:"Data",rows:[TPL_HEAD,...rows],dv:dvFor(tests.length)},
      {name:"EQA",rows:[EQA_HEAD,...eqaRows],dv:[{sqref:"B2:B900",list:`'Test list'!$B$2:$B$${tests.length+1}`},{sqref:"A2:A900",list:'"Biochemistry,CBC"'}]},
      {name:"หมายเหตุ",rows:[["หมายเหตุ"],["ไฟล์นี้เป็นข้อมูลตัวอย่าง (ค่าสมมติ) สำหรับทดลอง Import และดูรูปแบบข้อมูล — ห้ามนำไปใช้รายงานผลจริง"],
        ["เมื่อ Import ข้อมูลในชีต Info (รพ./Lab/EQA/Analyzer/S/N/IQC/ผู้จัดทำ) ตัวอย่างจะถูกใส่ในกรอบข้อมูลทั่วไปด้วย แก้ไขได้ภายหลัง"],["ต้องการไฟล์เปล่าสำหรับกรอกข้อมูลจริง ให้ใช้ปุ่ม ⬇ Template"]]},
      {name:"Test list",rows:[["Group","Test","Unit","CLIA 2025 criterion","Ricos TE %"],...tests]}]);
    download(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"sample_data_mu_sigma.xlsx");
  }
  setStatus(`ดาวน์โหลดไฟล์ข้อมูลตัวอย่าง (${kind==="csv"?"CSV":"Excel"}) แล้ว — ใช้ทดลอง Import ได้`);
}
function initTools(){
  {const d=$("dsName");d.value=state.info.dataset||"";d.addEventListener("input",()=>{state.info.dataset=d.value;save();const e=$("inDs");if(e)e.value=d.value;const x=$("expName");if(x)x.value=d.value;infoBar()})}
  $("btnSmpX").onclick=()=>downloadSample("xlsx");$("btnSmpC").onclick=()=>downloadSample("csv");
  $("btnTplX").onclick=()=>downloadTemplate("xlsx");$("btnTplC").onclick=()=>downloadTemplate("csv");
  $("btnImport").onclick=()=>$("fileIn").click();
  $("fileIn").onchange=e=>{const f=e.target.files[0];if(f)doImport(f);e.target.value=""};
  $("btnCsv").onclick=exportCsv;$("btnXlsx").onclick=exportXlsx;
  $("btnPdf").onclick=enterExport;
}

if(!state.rows.Biochemistry.length&&!state.rows.CBC.length){GROUPS.forEach(g=>{state.rows[g]=exampleRows(g);exampleEqa(g)})}
initTools();
show();
