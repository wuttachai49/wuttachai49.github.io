<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical News & Updates - Laboratory Knowledge Hub</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a class="brand" href="index.html">PANTONE <span>LAB</span></a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="analyzers.html">Analyzers</a></li>
                <li><a href="knowledge.html">Knowledge Base</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="technical-news.html" class="active" aria-current="page">Technical News</a></li>
                <li><a href="lab-tools.html">Lab Tools</a></li>
            </ul>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">🌙</button>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>📰 Technical News & Updates</h1>
            <p>Latest analyzer updates, technical corrections, and laboratory innovations</p>
        </header>

        <div class="content">
            <h2>Latest Technical Documentation</h2>

            <div class="search-box">
                <input
                    type="text"
                    id="search-news"
                    class="search-input"
                    placeholder="Search technical news by analyzer or keyword..."
                    oninput="searchNews(this.value)"
                >
                <button onclick="searchNews(document.getElementById('search-news').value)">Search</button>
            </div>

            <div id="news-container" class="card-grid"></div>

        </div>

        <footer>
            <p>&copy; 2026 PANTONE Medical Laboratory Knowledge Base.</p>
        </footer>
    </div>

    <script>
        // Technical News Data
        const newsData = [
            {
                "id": "mindray_updates",
                "title": "Mindray Analyzer Technical Updates",
                "subtitle": "BS-1000M & BS-2800M Complete Corrections",
                "date": "August 31, 2026",
                "analyzer": "Mindray BS Series",
                "description": "Complete technical updates and corrections for Mindray BS-1000M and BS-2800M analyzers with final all corrections included.",
                "category": "Technical Update",
                "url": "Mindray_COMPLETE_FINAL_ALL_CORRECTIONS.html"
            },
            {
                "id": "mindray_digest_260911",
                "title": "Mindray IVD Application Digest - Issue 260911",
                "subtitle": "CEA reformulation, Angiotensin I/II launch, P-AMY, MT-8000 EBJ770",
                "date": "September 11, 2026",
                "analyzer": "Mindray CLIA / BS Chemistry / MT-8000 TLA",
                "description": "Six Mindray bulletins: CEA (CLIA) new version Lot 20260501 re-targeted to Roche, new Angiotensin I & II assays, immunoassay bottle change, P-AMY launch, and MT-8000 software EBJ770 (15 changes).",
                "category": "Technical Update",
                "url": "technical-news-260911.html"
            }
        ];

        // Load and display news on page load
        document.addEventListener('DOMContentLoaded', function() {
            displayNews(newsData);
        });

        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function displayNews(news) {
            const container = document.getElementById('news-container');
            if (!container) return;
            container.innerHTML = news.length ? news.map(n => `
                <div class="card">
                    <div class="card-body">
                        <h3>${esc(n.title)}</h3>
                        <p class="card-meta">${esc(n.analyzer)} · ${esc(n.category)} · 📅 ${esc(n.date)}</p>
                        <p class="card-desc">${esc(n.description)}</p>
                    </div>
                    <a class="open-link" href="${esc(n.url)}">Open <span aria-hidden="true">→</span></a>
                </div>`).join('') : '<p class="empty">No technical news available.</p>';
        }

        function searchNews(query) {
            if (!query.trim()) {
                displayNews(newsData);
                return;
            }
            const filtered = newsData.filter(n =>
                n.title.toLowerCase().includes(query.toLowerCase()) ||
                n.analyzer.toLowerCase().includes(query.toLowerCase()) ||
                n.description.toLowerCase().includes(query.toLowerCase()) ||
                n.category.toLowerCase().includes(query.toLowerCase())
            );
            displayNews(filtered);
        }

    </script>
</body>
</html>
